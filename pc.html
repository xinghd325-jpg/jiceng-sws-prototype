<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>基层智治 · 社会工作服务端原型（PC）</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1677FF;
      --color-primary-hover: #4096ff;
      --color-success: #52C41A;
      --color-danger: #FF4D4F;
      --color-warning: #FAAD14;
      --color-border: #E5EAF0;
      --color-border-strong: #D0D7E2;
      --color-bg: #F0F2F5;
      --color-bg-elevated: #FFFFFF;
      --color-text: rgba(0,0,0,0.88);
      --color-text-secondary: rgba(0,0,0,0.55);
      --radius: 6px;
      --radius-lg: 8px;
      --control-height: 32px;
      --font-size: 14px;
      --header-height: 52px;
      --sidebar-width: 248px;
      --drawer-width: 640px;
      --shadow-card: 0 1px 4px rgba(15, 40, 80, 0.06);
      --shadow-soft: 0 2px 10px rgba(15, 40, 80, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: var(--font-size);
      color: var(--color-text);
      background: var(--color-bg);
    }
    /* 整页锁在视口内：侧栏 / 主内容各自滚动，互不影响 */
    #app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: var(--color-primary-hover); }

    /* ---- Shell layout ---- */
    .pc-header {
      height: var(--header-height);
      background: linear-gradient(90deg, #1564e8 0%, #1677FF 42%, #3b8dff 100%);
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 100;
      box-shadow: 0 2px 8px rgba(22, 119, 255, 0.22);
    }
    .pc-header .logo {
      font-size: 15px;
      font-weight: 600;
      margin-right: 16px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pc-header .nav-item {
      padding: 0 12px;
      height: var(--header-height);
      line-height: var(--header-height);
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .pc-header .nav-scroll {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .pc-header .nav-scroll::-webkit-scrollbar { display: none; }
    .pc-header .nav-item:hover { color: #fff; background: rgba(255,255,255,0.1); }
    .pc-header .nav-item.active {
      color: #fff;
      font-weight: 600;
      border-bottom-color: #fff;
      background: rgba(255,255,255,0.12);
    }
    .pc-header .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
    }
    .pc-body {
      display: flex;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .pc-sidebar {
      width: var(--sidebar-width);
      background: #fff;
      border-right: 1px solid var(--color-border);
      flex-shrink: 0;
      overflow: hidden;
      padding: 10px 0 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      box-shadow: 1px 0 0 rgba(15, 40, 80, 0.02);
    }
    .pc-sidebar .menu-group-title {
      padding: 10px 16px 6px;
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .pc-sidebar .menu-group {
      user-select: none;
    }
    .pc-sidebar .menu-group-head {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 10px 10px 14px;
      color: var(--color-text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }
    .pc-sidebar .menu-group-head > span {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }
    .pc-sidebar .menu-group-head:hover { background: #f7f9fc; }
    .pc-sidebar .menu-group-head .arrow {
      margin-left: auto;
      flex-shrink: 0;
      font-size: 14px;
      color: var(--color-text-secondary);
      transition: transform 0.15s ease;
    }
    .pc-sidebar .menu-group-head > i {
      flex-shrink: 0;
    }
    .pc-sidebar .menu-group.collapsed > .menu-group-body { display: none; }
    .pc-sidebar .menu-group.collapsed > .menu-group-head .arrow { transform: rotate(-90deg); }
    .pc-sidebar .menu-group-body { /* nested */ }
    .pc-sidebar .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px 9px 20px;
      color: var(--color-text);
      cursor: pointer;
      font-size: 13px;
      border-right: 2px solid transparent;
    }
    .pc-sidebar .menu-item.depth-1 { padding-left: 28px; }
    .pc-sidebar .menu-item.depth-2 { padding-left: 40px; font-weight: 400; }
    .pc-sidebar .menu-item:hover { background: #f7f9fc; }
    .pc-sidebar .menu-item.active {
      color: var(--color-primary);
      background: #e8f3ff;
      border-right-color: var(--color-primary);
      font-weight: 600;
    }
    .pc-sidebar .menu-item i { font-size: 16px; flex-shrink: 0; }
    .pc-sidebar .menu-subhead {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 28px;
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
    }
    .pc-sidebar .menu-subhead:hover { background: #f5f5f5; color: var(--color-text); }
    .pc-sidebar .menu-subhead .arrow {
      margin-left: auto;
      font-size: 14px;
      color: inherit;
      transition: transform 0.15s ease;
    }
    /* 三级选中时：二级文字高亮，无底色 */
    .pc-sidebar .menu-subhead.is-active-parent {
      color: var(--color-primary);
      font-weight: 600;
      background: transparent !important;
    }
    .pc-sidebar .menu-subhead.is-active-parent:hover {
      color: var(--color-primary);
      background: transparent !important;
    }
    .pc-sidebar .menu-subhead.is-active-parent .arrow {
      color: var(--color-primary);
    }
    .pc-sidebar .menu-subgroup.collapsed > .menu-sub-body { display: none; }
    .pc-sidebar .menu-subgroup.collapsed > .menu-subhead .arrow { transform: rotate(-90deg); }
    .pc-header .header-org-switch {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pc-header .header-org-switch-label {
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.72);
      white-space: nowrap;
      line-height: 1.2;
    }
    .pc-header .header-right .form-control {
      height: 26px;
      min-width: 168px;
      max-width: 240px;
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.35);
      color: #fff;
      font-size: 12px;
      line-height: 24px;
    }
    .pc-header .header-right .form-control option {
      color: var(--color-text);
      background: #fff;
      font-size: 12px;
      line-height: 1.3;
    }
    .pc-header .header-right i { font-size: 18px; cursor: default; opacity: 0.9; }
    .pc-main {
      flex: 1;
      min-width: 0;
      min-height: 0;
      height: 100%;
      padding: 16px 20px 20px;
      overflow: auto;
      overflow-x: hidden;
      background: var(--color-bg);
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    #pc-content { min-height: min-content; }
    .page-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 14px;
      color: var(--color-text);
      letter-spacing: 0.2px;
    }
    .page-desc {
      margin: -8px 0 14px;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.55;
    }
    .page-card {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px 20px;
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.6;
      box-shadow: var(--shadow-card);
    }
    .page-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .page-title-row .page-title { margin-bottom: 0; }

    /* ---- Stats ---- */
    .stats-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stats-card {
      flex: 1;
      min-width: 140px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      box-shadow: var(--shadow-card);
    }
    .stats-card .stats-num {
      font-size: 24px;
      font-weight: 600;
      color: var(--color-primary);
      line-height: 1.2;
    }
    .stats-card .stats-num.danger { color: var(--color-danger); }
    .stats-card .stats-num.success { color: var(--color-success); }
    .stats-card .stats-num.warning { color: var(--color-warning); }
    .stats-card .stats-label {
      margin-top: 6px;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .stats-panel {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .stats-panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label {
      width: 88px;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--color-text-secondary);
      text-align: right;
    }
    .bar-track {
      flex: 1;
      height: 10px;
      background: #eef2f7;
      border-radius: 999px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b8dff, #1677FF);
      border-radius: 999px;
      min-width: 0;
    }
    /* ---- 帮扶数据统计看板 ---- */
    .stats-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      margin-bottom: 14px;
      padding: 12px 14px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
    }
    .stats-toolbar .tb-label {
      font-size: 13px;
      color: var(--color-text-secondary);
      margin-right: 2px;
    }
    .stats-toolbar .tb-chip {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--color-border);
      background: #fff;
      color: var(--color-text-secondary);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }
    .stats-toolbar .tb-chip:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    .stats-toolbar .tb-chip.active {
      background: rgba(22, 119, 255, 0.08);
      border-color: var(--color-primary);
      color: var(--color-primary);
      font-weight: 600;
    }
    .stats-toolbar .tb-meta {
      margin-left: auto;
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .stats-toolbar {
      position: relative;
      z-index: 8;
      overflow: visible;
    }
    .stats-toolbar .tb-org {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 260px;
      flex: 1 1 280px;
      max-width: 420px;
    }
    .stats-toolbar .tb-org .org-filter { flex: 1; min-width: 0; }
    .stats-toolbar .tb-dates {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .stats-toolbar .tb-dates .form-control {
      width: 138px;
      height: 28px;
      padding: 0 8px;
      font-size: 13px;
    }
    .stats-toolbar .tb-dates .tb-date-sep {
      color: rgba(0, 0, 0, 0.35);
      font-size: 13px;
    }
    .stats-crumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 2px 0;
      margin-bottom: 10px;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .stats-crumb .crumb-link {
      border: none;
      background: none;
      padding: 0;
      color: var(--color-primary);
      cursor: pointer;
      font: inherit;
    }
    .stats-crumb .crumb-link:hover { text-decoration: underline; }
    .stats-crumb .crumb-sep {
      color: rgba(0, 0, 0, 0.25);
      margin: 0 6px;
    }
    .stats-crumb .crumb-current {
      color: var(--color-text);
      font-weight: 600;
    }
    .stats-kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    @media (max-width: 1280px) {
      .stats-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .stats-kpi {
      position: relative;
      overflow: hidden;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 14px 16px 14px 18px;
      box-shadow: var(--shadow-card);
      min-height: 92px;
    }
    .stats-kpi::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--color-primary);
    }
    .stats-kpi.k-warning::before { background: var(--color-warning); }
    .stats-kpi.k-success::before { background: var(--color-success); }
    .stats-kpi.k-danger::before { background: var(--color-danger); }
    .stats-kpi.k-purple::before { background: #722ed1; }
    .stats-kpi.k-cyan::before { background: #13c2c2; }
    .stats-kpi .kpi-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .stats-kpi .kpi-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--color-primary);
      background: rgba(22, 119, 255, 0.1);
      flex-shrink: 0;
    }
    .stats-kpi.k-warning .kpi-icon { color: #d48806; background: rgba(250, 173, 20, 0.14); }
    .stats-kpi.k-success .kpi-icon { color: #389e0d; background: rgba(82, 196, 26, 0.12); }
    .stats-kpi.k-danger .kpi-icon { color: #cf1322; background: rgba(255, 77, 79, 0.12); }
    .stats-kpi.k-purple .kpi-icon { color: #531dab; background: rgba(114, 46, 209, 0.12); }
    .stats-kpi.k-cyan .kpi-icon { color: #08979c; background: rgba(19, 194, 194, 0.12); }
    .stats-kpi .kpi-num {
      font-size: 26px;
      font-weight: 700;
      line-height: 1.15;
      color: var(--color-text);
      letter-spacing: -0.02em;
    }
    .stats-kpi .kpi-num small {
      font-size: 14px;
      font-weight: 600;
      margin-left: 2px;
      color: var(--color-text-secondary);
    }
    .stats-kpi .kpi-label {
      margin-top: 4px;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .stats-kpi .kpi-sub {
      margin-top: 8px;
      font-size: 12px;
      color: var(--color-text-secondary);
      line-height: 1.4;
    }
    .stats-kpi .kpi-sub b { color: var(--color-text); font-weight: 600; }
    .stats-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    @media (max-width: 1100px) {
      .stats-grid-2 { grid-template-columns: 1fr; }
    }
    .stats-panel {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      margin-bottom: 12px;
      box-shadow: var(--shadow-card);
    }
    .stats-grid-2 > .stats-panel { margin-bottom: 0; }
    .stats-split {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
      align-items: stretch;
    }
    @media (max-width: 1100px) {
      .stats-split { grid-template-columns: 1fr; }
    }
    .stats-split-main {
      display: flex;
      flex-direction: column;
      margin-bottom: 0;
      min-height: 0;
    }
    .stats-split-main .rank-table { flex: 1; }
    .stats-split-side {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .stats-split-side > .stats-panel {
      flex: 1 1 0;
      margin-bottom: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .stats-split-side > .stats-panel .rank-table,
    .stats-split-side > .stats-panel .bar-row { flex-shrink: 0; }
    .stats-panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }
    .stats-panel-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stats-panel-title i { color: var(--color-primary); font-size: 16px; }
    .stats-panel-extra {
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .stats-empty {
      padding: 28px 12px;
      text-align: center;
      color: var(--color-text-secondary);
      font-size: 13px;
    }
    .funnel-list { display: flex; flex-direction: column; gap: 10px; }
    .funnel-row {
      display: grid;
      grid-template-columns: 72px 1fr 52px;
      align-items: center;
      gap: 10px;
    }
    .funnel-row .f-name {
      font-size: 13px;
      color: var(--color-text-secondary);
      text-align: right;
    }
    .funnel-row .f-track {
      height: 28px;
      background: #f0f5ff;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .funnel-row .f-fill {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, #69b1ff, #1677FF);
      display: flex;
      align-items: center;
      padding: 0 10px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      min-width: 36px;
      white-space: nowrap;
      transition: width 0.35s ease;
    }
    .funnel-row:nth-child(2) .f-fill { background: linear-gradient(90deg, #91caff, #4096ff); }
    .funnel-row:nth-child(3) .f-fill { background: linear-gradient(90deg, #95de64, #52c41a); }
    .funnel-row:nth-child(4) .f-fill { background: linear-gradient(90deg, #ffd666, #faad14); color: #614700; }
    .funnel-row:nth-child(5) .f-fill { background: linear-gradient(90deg, #ff9c6e, #ff4d4f); }
    .funnel-row .f-rate {
      font-size: 12px;
      color: var(--color-text-secondary);
      text-align: right;
    }
    .trend-chart {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 140px;
      padding-top: 8px;
    }
    .trend-col {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
      justify-content: flex-end;
      gap: 6px;
    }
    .trend-bars {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3px;
    }
    .trend-bar {
      width: 10px;
      max-width: 40%;
      border-radius: 3px 3px 0 0;
      min-height: 2px;
      background: #1677FF;
    }
    .trend-bar.sec { background: #95de64; }
    .trend-label {
      font-size: 11px;
      color: var(--color-text-secondary);
      white-space: nowrap;
      transform: scale(0.95);
    }
    .trend-legend {
      display: flex;
      gap: 14px;
      margin-bottom: 8px;
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .trend-legend span::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      margin-right: 5px;
      vertical-align: 0;
      background: #1677FF;
    }
    .trend-legend span.sec::before { background: #95de64; }
    .rank-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .rank-table th {
      text-align: left;
      font-weight: 500;
      color: var(--color-text-secondary);
      padding: 8px 6px;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }
    .rank-table td {
      padding: 9px 6px;

    /* ---- Filter card（对齐原系统：白卡片 + 轻阴影 + 圆角控件） ---- */
    .filter-card {
      background: #fff;

      margin-bottom: 12px;

    .filter-row {

      align-items: center;
      margin-bottom: 10px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 32px;
      min-width: 0;
      max-width: none;
    }
    .filter-item label {
      font-size: 13px;
      color: rgba(0,0,0,0.55);

      width: 84px;
      min-width: 84px;
      text-align: right;
      flex-shrink: 0;
    }
    .filter-item .form-control {

      min-width: 0;
      width: auto;
      max-width: none;
    }
    .filter-item.filter-item-range {
      grid-column: span 2;

    .filter-item.filter-item-range .form-control {

    .filter-range-sep {

    .filter-actions {

      margin-left: 0;
      align-items: center;
      justify-self: start;
    }
    /* 所属组织级联筛选（对齐原系统多列区划选择） */
    .filter-item.filter-item-org {
      position: relative;
      z-index: 6;
    }
    .filter-item.filter-item-org label { width: 84px; min-width: 84px; }
    .filter-item.filter-item-org .org-filter {

      min-width: 0;
      width: auto;

    .org-filter {

    }
    .form-field .org-filter {

      min-width: 0;
    }
    .org-filter-trigger {
      display: inline-flex;

    /* 可视化表单/题目配置 */

    .toolbar {
      display: flex;

    .type-switch {

    /* ---- Form controls ---- */
    .form-control {
      height: var(--control-height);
      border: 1px solid var(--color-border-strong);
      border-radius: var(--radius);
      padding: 4px 12px;
      font-size: 13px;
      color: var(--color-text);
      background: #fff;
      outline: none;
      min-width: 168px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;

    .form-control::placeholder { color: rgba(0,0,0,0.28); }
    .form-control:hover { border-color: #b7c4d4; }

      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.12);

    /* ========== Seed + Storage ========== */

    const STORE_PREFIX = "sws_v1_";

      assistRecords: STORE_PREFIX + "assist_records",

    function storageGet(key) {
      const raw = localStorage.getItem(key);
      if (raw == null) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    }
    function storageSet(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
    function uid(prefix) {
      return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);

    function chineseToInitials(name) {
      const s = String(name || "");
      let out = "";
      for (let i = 0; i < s.length; i++) {
        const ch = s.charAt(i);
        if (PY_CHAR_INITIAL[ch]) out += PY_CHAR_INITIAL[ch];
        else if (/[A-Za-z0-9]/.test(ch)) out += ch.toUpperCase();
      }
      return out;
    }

    function typeCodeFromName(name, used) {
      used = used || {};
      let base = TYPE_CODE_BY_NAME[name] || chineseToInitials(name) || "LX";
      base = String(base).toUpperCase().replace(/[^A-Z0-9]/g, "") || "LX";
      let code = base;
      let n = 2;
      while (used[code]) {
        code = base + n;
        n += 1;
      }
      return code;
    }

    function isAutoNumericTypeCode(code) {
      return /^\d+$/.test(String(code || "").trim());

    function ensureTypeCodesOnList(typeKey) {
      const list = getAll(typeKey);
      if (!list.length) return;
      const used = {};
      let dirty = false;
      list.forEach(function (t) {
        if (!t) return;
        const c = t.code ? String(t.code).trim() : "";
        if (c && !isAutoNumericTypeCode(c) && !TYPE_CODE_BY_NAME[t.name]) used[c] = 1;
      });
      list.forEach(function (t) {
        if (!t || !t.name) return;
        const c = t.code ? String(t.code).trim() : "";
        const mapped = TYPE_CODE_BY_NAME[t.name];
        const shouldAssign = !c || isAutoNumericTypeCode(c) || (mapped && c !== mapped && !used[mapped]);
        if (!shouldAssign) {
          used[c] = 1;
          return;
        }
        if (c && used[c] && !isAutoNumericTypeCode(c) && !mapped) return;
        const next = typeCodeFromName(t.name, used);
        if (t.code !== next) {
          t.code = next;
          dirty = true;
        }
        used[next] = 1;
      });
      list.forEach(function (t) {
        if (!t) return;
        if (t.status !== "disabled" && t.status !== "enabled") {
          t.status = "enabled";
          dirty = true;
        }
      });
      if (dirty) storageSet(typeKey, list);
    }

    function ensureOneTypeCatalog(typeKey, dataKey, fieldKey, defaults, forceReset) {
      const cur = storageGet(typeKey);
      if (!forceReset && cur && Array.isArray(cur) && cur.length) {
        ensureTypeCodesOnList(typeKey);
        return;
      }
      const seen = {};
      const names = [];
      (defaults || []).forEach(function (n) {
        if (!n || seen[n]) return;
        seen[n] = 1;
        names.push(n);
      });
      getAll(dataKey).forEach(function (r) {
        const n = r && r[fieldKey] ? String(r[fieldKey]).trim() : "";
        if (!n || seen[n]) return;
        seen[n] = 1;
        names.push(n);
      });
      const used = {};
      storageSet(
        typeKey,
        names.map(function (name, i) {
          const code = typeCodeFromName(name, used);
          used[code] = 1;
          return {
            id: uid("rtp"),
            name: name,
            code: code,
            status: "enabled",
            sort: i,
          };
        })
      );
    }

    function getResourceTypeList(typeKey) {
      const list = (getAll(typeKey) || []).slice();

      return list.filter(function (t) {

      if (extra && names.indexOf(extra) < 0) {

          const enabled = row.getAttribute("data-status") !== "disabled";
          const nextOn = !enabled;
          row.setAttribute("data-status", nextOn ? "enabled" : "disabled");

          else toggleBtn.classList.remove("on");
          toggleBtn.title = nextOn ? "启用" : "禁用";

    function getOrg(id) {

    /**
     * 组织层级展示：按记录实际层级显示到对应级别
     * - 市级：金华市
     * - 区县：婺城区
     * - 乡镇：婺城区城西街道
     * - 村社：婺城区城西街道幸福社区
     * 支持传入 orgId / 记录对象（优先 orgId，兼容 districtName/townName/orgName）
     */
    /** 列表展示：证件号脱敏，保留前 4 后 4，如 3307**********1234 */
    function maskIdCard(idCard) {
      const s = String(idCard == null ? "" : idCard).replace(/\s+/g, "");
      if (!s) return "-";
      if (s.length <= 8) return s.charAt(0) + "****" + s.slice(-1);
      return s.slice(0, 4) + new Array(s.length - 7).join("*") + s.slice(-4);
    }
    function maskPhone(phone) {
      const p = String(phone || "").replace(/[\s\-]/g, "");
      if (!p) return "-";
      if (/^1\d{10}$/.test(p)) return p.slice(0, 3) + "****" + p.slice(7);
      if (p.length >= 7) return p.slice(0, 3) + "****" + p.slice(-4);
      return p;
    }

    function formatOrgPathLabel(input) {
      if (input == null || input === "") return "-";
      var rec = typeof input === "object" ? input : null;
      var orgId = rec ? rec.orgId || rec.centerOrgId || "" : String(input);
      var org = orgId ? getOrg(orgId) : null;

      // 优先按组织树 path 拼层级（跳过市级，除非本级就是市）
      if (org) {
        var pathIds = org.path && org.path.length ? org.path.slice() : [org.id];
        var names = [];
        pathIds.forEach(function (id) {
          var o = getOrg(id);
          if (!o || !o.name) return;
          if (o.level === "city") {
            if (org.level === "city") names.push(o.name);
            return;
          }
          names.push(o.name);
        });
        if (names.length) return names.join("");
        return org.name || "-";
      }

      // 无 org 树时：用记录上的区/镇/村名称拼接
      if (rec) {
        var parts = [rec.districtName, rec.townName, rec.orgName || rec.villageName].filter(Boolean);
        if (parts.length) {
          // 去重相邻同名
          var out = [];
          parts.forEach(function (p) {
            if (!out.length || out[out.length - 1] !== p) out.push(p);
          });
          return out.join("");
        }
        if (rec.orgName) return rec.orgName;
      }
      return "-";
    }

    function getDeptName(deptId) {

    /** 发布部门展示：组织完整路径 + 部门名（村社不拼部门） */
    function formatPublishDeptLabel(row) {

      if (!orgLabel || orgLabel === "-") return "-";
      const orgRec = row && row.orgId ? getOrg(row.orgId) : null;
      const level = (row && row.orgLevel) || (orgRec && orgRec.level) || "";
      if (level === "village") return orgLabel;
      const deptName =
        (row && row.deptName) ||
        (row && row.deptId ? getDeptName(row.deptId) : "") ||
        "";
      if (!deptName) return orgLabel;
      return orgLabel + deptName;

    function isAncestorOrg(ancestorId, childId) {

    /**

    /**
     * 绑定组织级联筛选：点击展开多列面板，选中任意一级
     * 返回 getValue / setValue
     */
    function bindOrgFilterControl(rootEl, options) {
      options = options || {};
      if (!rootEl) return { getValue: function () { return ""; }, setValue: function () {} };
      const trigger = rootEl.querySelector('[data-role="org-trigger"]');
      const panel = rootEl.querySelector('[data-role="org-panel"]');
      const textEl = rootEl.querySelector(".org-filter-text");
      const placeholder = options.placeholder || "请选择";
      let value = rootEl.getAttribute("data-value") || "";
      // 面板内当前展开路径（含已选）
      let browsePath = [];

      function closePanel() {
        if (!panel) return;
        panel.hidden = true;
        if (trigger) trigger.classList.remove("open");
      }
      function openPanel() {
        if (!panel) return;
        // 根据已选初始化展开路径
        const org = value ? getOrg(value) : null;
        if (org && org.path && org.path.length) {
          browsePath = org.path.filter(function (id) {
            const o = getOrg(id);
            return o && o.level !== "city";
          });
        } else {
          browsePath = [];
        }
        renderPanel();
        panel.hidden = false;
        if (trigger) trigger.classList.add("open");
      }
      function setValue(id, silent) {
        value = id || "";
        rootEl.setAttribute("data-value", value);
        if (textEl) {
          const t = orgFilterDisplayText(value);
          textEl.textContent = t || placeholder;
          if (t) textEl.classList.remove("is-placeholder");
          else textEl.classList.add("is-placeholder");
        }
        if (!silent && typeof options.onChange === "function") options.onChange(value);
      }
      function renderPanel() {
        if (!panel) return;
        // 仅展示当前登录组织及下级，避免筛到权限外区域出现空列表
        const sess = getPcSession();
        const sessOrg = sess && sess.orgId ? getOrg(sess.orgId) : null;
        const rootId =
          sessOrg && sessOrg.level !== "city" ? sessOrg.parentId || "org_city" : "org_city";
        const allowedIds = sess && sess.orgId
          ? new Set(getOrgDescendants(sess.orgId))
          : null;
        const colParents = [rootId];
        for (let i = 0; i < browsePath.length && i < 2; i++) {
          colParents.push(browsePath[i]);
        }
        const cols = colParents.slice(0, 3);
        const allowClear = options.allowClear !== false;
        let html =
          '<div class="org-filter-panel-head"><span>本级及下级组织（可选任意一级）</span>' +
          (allowClear
            ? '<button type="button" class="org-filter-clear" data-act="org-clear">清空</button>'
            : "") +
          "</div>" +
          '<div class="org-filter-cols">';
        cols.forEach(function (parentId, colIndex) {
          let children = getOrgChildren(parentId);
          if (allowedIds) {
            children = children.filter(function (o) {
              return allowedIds.has(o.id);
            });
          }
          if (
            options.includeSessionOrg &&
            colIndex === 0 &&
            sess &&
            sess.orgId
          ) {
            const selfOrg = getOrg(sess.orgId);
            const already = children.some(function (o) {
              return o.id === sess.orgId;
            });
            if (selfOrg && !already && (!allowedIds || allowedIds.has(selfOrg.id))) {
              children = [selfOrg].concat(children);
            }
          }
          html += '<div class="org-filter-col" data-col="' + colIndex + '">';
          if (!children.length) {
            html += '<div class="org-filter-empty">暂无下级</div>';
          } else {
            children.forEach(function (o) {
              const hasChild = getOrgChildren(o.id).length > 0;
              const active =
                value === o.id ||
                browsePath[colIndex] === o.id ||
                (value && isAncestorOrg(o.id, value) && browsePath[colIndex] === o.id);
              const selected = value === o.id;
              html +=
                '<div class="org-filter-item' +
                (selected || (browsePath[colIndex] === o.id) ? " active" : "") +
                '" data-org-id="' +
                escapeHtml(o.id) +
                '" data-has-child="' +
                (hasChild ? "1" : "0") +
                '">' +
                '<span class="of-radio"></span>' +
                '<span class="of-name">' +
                escapeHtml(o.name) +
                "</span>" +
                (hasChild ? '<i class="ri-arrow-right-s-line of-arrow"></i>' : "") +
                "</div>";
            });
          }
          html += "</div>";
        });
        html += "</div>";
        panel.innerHTML = html;
        panel.querySelectorAll(".org-filter-item").forEach(function (item) {
          item.addEventListener("click", function (e) {
            e.stopPropagation();
            const id = item.getAttribute("data-org-id");
            const col = parseInt(item.parentNode.getAttribute("data-col"), 10) || 0;
            const hasChild = item.getAttribute("data-has-child") === "1";
            const sess2 = getPcSession();
            if (sess2 && sess2.orgId && !isAncestorOrg(sess2.orgId, id)) {
              toast("只能筛选本级及下级组织", "warning");
              return;
            }
            if (id === rootId) {
              browsePath = [];
              setValue(id, false);
              renderPanel();
              return;
            }
            browsePath = browsePath.slice(0, col);
            browsePath[col] = id;
            setValue(id, false);
            if (hasChild) {
              renderPanel();
            } else {
              closePanel();
            }
          });
        });
        const clearBtn = panel.querySelector('[data-act="org-clear"]');
        if (clearBtn) {

            setValue("", false);
            renderPanel();
          });

      }

      if (trigger) {
        trigger.addEventListener("click", function (e) {
          e.stopPropagation();
          if (panel && !panel.hidden) closePanel();
          else openPanel();
        });
      }
      // 点击外部关闭
      if (!rootEl._orgFilterDocBound) {
        rootEl._orgFilterDocBound = true;
        document.addEventListener("click", function (e) {
          if (!rootEl.contains(e.target)) closePanel();
        });
      }

      return {
        getValue: function () {
          return value;
        },
        setValue: function (id) {
          setValue(id, true);
        },
        close: closePanel,
      };
    }

    function listForH5(moduleKey) {
      const session = getH5Session();
      if (!session) return [];
      const orgId = session.orgId;
      const userId = session.userId;
      const userOrg = getOrg(orgId);
      const path = userOrg ? (userOrg.path || []) : [];
      const all = getAll(moduleKey).filter((r) => !r.deleted);
      const rule = VISIBILITY[moduleKey];

      if (rule === "upward") {
        return all.filter((r) => r.status === "published" && path.includes(r.orgId));
      }
      if (rule === "village") {
        if (moduleKey === KEYS.topics) {
          return all.filter(function (r) {
            return r.orgId === orgId && isPublishedStatus(r.status, r);
          });
        }
        return all.filter((r) => r.orgId === orgId && r.status === "published");
      }
      if (rule === "scope") {
        // 活动/测评/征集：仅已上架（兼容旧 open）
        const statusOk = function (s) {
          return s === "published" || s === "open";
        };
        return all.filter((r) => statusOk(r.status) && scopeMatchesUser(r, orgId, path));
      }
      if (rule === "self") {
        return all.filter((r) => r.userId === userId);
      }
      return all.filter((r) => r.status === "published");
    }

    function confirmDialog(opts) {

    const DEV_GUIDE_DOCX = "需求文档/社会服务端-凝聚群众服务 开发规则.docx";

    function wAttr(el, name) {

        el.getAttributeNS(WNS, name) ||
        el.getAttribute("w:" + name) ||

        ""
      );

    function wDirect(el, name) {
      if (!el || !el.childNodes) return null;
      for (let i = 0; i < el.childNodes.length; i++) {
        const n = el.childNodes[i];
        if (n.nodeType === 1 && n.localName === name) return n;

      return null;

    function wDirectAll(el, name) {
      const out = [];
      if (!el || !el.childNodes) return out;
      for (let i = 0; i < el.childNodes.length; i++) {
        const n = el.childNodes[i];
        if (n.nodeType === 1 && n.localName === name) out.push(n);

      return out;
    }

    function wDeepText(el) {
      const ts = el.getElementsByTagNameNS(WNS, "t");
      let s = "";
      for (let i = 0; i < ts.length; i++) s += ts[i].textContent || "";
      return s;
    }

    function docxXmlToHtml(xmlText) {
      const doc = new DOMParser().parseFromString(xmlText, "application/xml");
      const err = doc.querySelector("parsererror");
      if (err) throw new Error("文档解析失败");
      const body = doc.getElementsByTagNameNS(WNS, "body")[0];
      if (!body) throw new Error("文档内容为空");
      const parts = [];
      let h6n = 0;
      let n2 = 0;
      const kids = body.childNodes;
      for (let i = 0; i < kids.length; i++) {
        const el = kids[i];
        if (el.nodeType !== 1) continue;
        if (el.localName === "sectPr") continue;
        if (el.localName === "tbl") {
          parts.push('<table class="dg-table">');
          const rows = wDirectAll(el, "tr");
          rows.forEach(function (tr, ri) {
            const trPr = wDirect(tr, "trPr");
            const isHead = ri === 0 || !!(trPr && wDirect(trPr, "tblHeader"));
            const cells = wDirectAll(tr, "tc");
            parts.push(isHead ? "<thead><tr>" : "<tr>");
            cells.forEach(function (tc) {
              const txt = wDeepText(tc).trim();
              const tag = isHead ? "th" : "td";
              const cls = isHead ? ' class="dg-th"' : "";
              parts.push(
                "<" +
                  tag +
                  cls +
                  ">" +
                  (txt ? escapeHtml(txt).replace(/\n/g, "<br/>") : "&nbsp;") +
                  "</" +
                  tag +
                  ">"
              );
            });
            parts.push(isHead ? "</tr></thead>" : "</tr>");
          });
          parts.push("</table>");
          continue;
        }
        if (el.localName !== "p") continue;
        const text = wDeepText(el).trim();
        if (!text) continue;
        const pPr = wDirect(el, "pPr");
        const style = pPr ? wAttr(wDirect(pPr, "pStyle"), "val") : "";
        const numPr = pPr ? wDirect(pPr, "numPr") : null;
        const numId = numPr ? wAttr(wDirect(numPr, "numId"), "val") : "";
        const ind = pPr ? wDirect(pPr, "ind") : null;
        const left = parseInt(wAttr(ind, "left") || "0", 10) || 0;
        const esc = escapeHtml(text);
        if (style === "2") {
          parts.push('<div class="dg-title">' + esc + "</div>");
        } else if (style === "3") {
          parts.push('<h2 class="dg-h2">' + esc + "</h2>");
        } else if (style === "6") {
          h6n += 1;
          parts.push(
            '<h3 class="dg-h3"><span class="dg-n">' + h6n + ".</span> " + esc + "</h3>"
          );
        } else {
          let cls = "dg-p";
          let prefix = "";
          if (numId === "2") {
            n2 += 1;
            prefix = '<span class="dg-n2">(' + n2 + ")</span> ";
            cls += " dg-item";
          } else if (/^[（(]/.test(text) || /^\d+）/.test(text)) {
            cls += " dg-item";
            if (left >= 700) cls += " dg-sub";
          } else if (left >= 700) {
            cls += " dg-sub";
          }
          parts.push('<p class="' + cls + '">' + prefix + esc + "</p>");
        }
      }
      return parts.join("\n");
    }

    function loadScriptOnce(src) {
      return new Promise(function (resolve, reject) {
        if (window.JSZip) {
          resolve();
          return;
        }
        const s = document.createElement("script");
        s.src = src;
        s.onload = function () {
          resolve();
        };
        s.onerror = function () {
          reject(new Error("无法加载文档解析组件"));
        };
        document.head.appendChild(s);
      });
    }

    function loadDevGuideHtml() {
      return loadScriptOnce("https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js")
        .then(function () {
          return fetch(encodeURI(DEV_GUIDE_DOCX), { cache: "no-store" });
        })
        .then(function (res) {
          if (!res.ok) throw new Error("未找到本地开发规则文档");
          return res.arrayBuffer();
        })
        .then(function (buf) {
          return window.JSZip.loadAsync(buf);
        })
        .then(function (zip) {
          const f = zip.file("word/document.xml");
          if (!f) throw new Error("文档格式不正确");
          return f.async("string");
        })
        .then(function (xml) {
          return docxXmlToHtml(xml);
        });
    }

    /** 分页状态 */
    function createPager(pageSize) {
      return { page: 1, pageSize: pageSize || 10 };
    }

    /** 对列表切片；会修正越界页码 */
    function applyPager(list, pager) {
      list = list || [];
      const total = list.length;
      const pageSize = Math.max(1, pager.pageSize || 10);
      const totalPages = Math.max(1, Math.ceil(total / pageSize) || 1);
      let page = pager.page || 1;
      if (page > totalPages) page = totalPages;
      if (page < 1) page = 1;
      pager.page = page;
      pager.pageSize = pageSize;
      const start = (page - 1) * pageSize;
      return {
        total: total,
        totalPages: totalPages,
        page: page,
        pageSize: pageSize,
        rows: list.slice(start, start + pageSize),
      };
    }

    /** 生成页码序列：1 … 4 5 6 … 20 */
    function buildPageItems(current, totalPages) {
      const items = [];
      if (totalPages <= 7) {
        for (let i = 1; i <= totalPages; i++) items.push(i);
        return items;
      }
      items.push(1);
      const left = Math.max(2, current - 1);
      const right = Math.min(totalPages - 1, current + 1);
      if (left > 2) items.push("…");
      for (let p = left; p <= right; p++) items.push(p);
      if (right < totalPages - 1) items.push("…");
      items.push(totalPages);
      return items;
    }

    /**
     * 渲染分页条（仿原系统）
     * onChange({ page, pageSize })
     */
    function renderPagination(footerEl, pageInfo, onChange) {
      if (!footerEl) return;
      pageInfo = pageInfo || {};
      const total = pageInfo.total || 0;
      const page = pageInfo.page || 1;
      const pageSize = pageInfo.pageSize || 10;
      const totalPages = Math.max(1, pageInfo.totalPages || Math.ceil(total / pageSize) || 1);
      const sizes = [10, 20, 50];
      const pageItems = buildPageItems(page, totalPages);

      let html = '<div class="pagination">';
      html += '<span class="pagination-total">共 ' + total + " 条</span>";
      html += '<select class="pagination-size" data-pager="size">';
      sizes.forEach(function (s) {
        html +=
          '<option value="' +
          s +
          '"' +
          (s === pageSize ? " selected" : "") +
          ">" +
          s +
          "条/页</option>";
      });
      html += "</select>";
      html += '<div class="pagination-pages">';
      html +=
        '<button type="button" class="pagination-btn" data-pager="prev"' +
        (page <= 1 ? " disabled" : "") +
        ">&lt;</button>";
      pageItems.forEach(function (it) {
        if (it === "…") {
          html += '<span class="pagination-ellipsis">…</span>';
        } else {
          html +=
            '<button type="button" class="pagination-btn' +
            (it === page ? " active" : "") +
            '" data-pager-page="' +
            it +
            '">' +
            it +
            "</button>";
        }
      });
      html +=
        '<button type="button" class="pagination-btn" data-pager="next"' +
        (page >= totalPages ? " disabled" : "") +
        ">&gt;</button>";
      html += "</div>";
      html +=
        '<span class="pagination-jump">前往 <input class="pagination-jump-input" data-pager="jump" type="text" inputmode="numeric" value="' +
        page +
        '" /> 页</span>';
      html += "</div>";
      footerEl.innerHTML = html;

      function emit(nextPage, nextSize) {
        if (typeof onChange !== "function") return;
        onChange({
          page: nextPage,
          pageSize: nextSize || pageSize,
        });
      }

      const sizeEl = footerEl.querySelector('[data-pager="size"]');
      if (sizeEl) {
        sizeEl.addEventListener("change", function () {
          emit(1, parseInt(sizeEl.value, 10) || 10);
        });
      }
      const prev = footerEl.querySelector('[data-pager="prev"]');
      if (prev) {
        prev.addEventListener("click", function () {
          if (page > 1) emit(page - 1, pageSize);
        });
      }
      const next = footerEl.querySelector('[data-pager="next"]');
      if (next) {
        next.addEventListener("click", function () {
          if (page < totalPages) emit(page + 1, pageSize);
        });
      }
      footerEl.querySelectorAll("[data-pager-page]").forEach(function (btn) {
        btn.addEventListener("click", function () {
          const p = parseInt(btn.getAttribute("data-pager-page"), 10);
          if (!isNaN(p) && p !== page) emit(p, pageSize);
        });
      });
      const jump = footerEl.querySelector('[data-pager="jump"]');
      if (jump) {
        const doJump = function () {
          let p = parseInt(String(jump.value || "").trim(), 10);
          if (isNaN(p)) p = page;
          if (p < 1) p = 1;
          if (p > totalPages) p = totalPages;
          if (p !== page) emit(p, pageSize);
          else jump.value = String(page);
        };
        jump.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            e.preventDefault();
            doJump();
          }
        });
        jump.addEventListener("blur", doJump);
      }
    }

    function renderTable(container, options) {
      options = options || {};
      const columns = options.columns || [];
      const rows = options.rows || [];
      const rowActions = options.rowActions;
      // 操作列宽度：按按钮数给足表头「操作」与按钮，避免竖排/挤扁
      let actionsWidth = options.actionsWidth;
      if (!actionsWidth && rowActions) {
        let maxActs = 1;
        (rows || []).forEach(function (row, ri) {
          try {
            const acts = (rowActions(row, ri) || []).filter(function (a) {
              return a && a.show !== false;
            });
            if (acts.length > maxActs) maxActs = acts.length;
          } catch (e) {}
        });
        if (maxActs <= 1) actionsWidth = "88px";
        else if (maxActs === 2) actionsWidth = "112px";
        else if (maxActs === 3) actionsWidth = "148px";
        else actionsWidth = "168px";
      }
      if (!actionsWidth) actionsWidth = "88px";
      if (!container) return;

      // 按列宽汇总 min-width，防止 fixed 布局把中间列挤成「竖排/只剩一字」
      function parsePx(v, fallback) {
        if (v == null || v === "") return fallback;
        const n = parseInt(String(v), 10);
        return isNaN(n) ? fallback : n;
      }
      let tableMin = 0;
      columns.forEach(function (col, i) {
        if (i === 0) tableMin += parsePx(col.width, 200);
        else tableMin += parsePx(col.width, 120);
      });
      if (rowActions) tableMin += parsePx(actionsWidth, 88);
      tableMin = Math.max(tableMin + 24, 1100);

      let html =
        '<div class="table-wrap"><table style="min-width:' +
        tableMin +
        'px"><thead><tr>';
      columns.forEach(function (col) {
        const w = col.width
          ? ' style="width:' + col.width + ";min-width:" + (col.minWidth || col.width) + '"'
          : "";
        html += "<th" + w + ">" + escapeHtml(col.title || col.key || "") + "</th>";
      });
      if (rowActions) {
        html +=
          '<th class="col-actions" style="width:' +
          actionsWidth +
          ";min-width:" +
          actionsWidth +
          '">操作</th>';
      }
      html += "</tr></thead><tbody>";

      if (!rows.length) {
        const colSpan = columns.length + (rowActions ? 1 : 0);
        html +=
          '<tr><td class="table-empty" colspan="' +
          colSpan +
          '">暂无数据</td></tr>';
      } else {
        rows.forEach(function (row, rowIndex) {
          html += '<tr data-row-index="' + rowIndex + '">';
          columns.forEach(function (col, colIndex) {
            let cell;
            if (typeof col.render === "function") {
              cell = col.render(row, rowIndex);
              if (cell == null) cell = "";
            } else {
              cell = escapeHtml(row[col.key] == null ? "" : row[col.key]);
            }
            // 首列长文本包一层，限制最多两行，避免行高被撑爆
            if (colIndex === 0) {
              html += '<td class="col-first"><div class="cell-text">' + cell + "</div></td>";
            } else {
              const cls = col.ellipsis ? ' class="cell-ellipsis"' : "";
              const tw = col.width
                ? ' style="width:' + col.width + ";min-width:" + col.width + '"'
                : "";
              html += "<td" + cls + tw + ">" + cell + "</td>";
            }
          });
          if (rowActions) {
            html +=
              '<td class="col-actions" style="width:' +
              actionsWidth +
              ";min-width:" +
              actionsWidth +
              '"><div class="col-actions-inner">';
            let actions = [];
            try {
              actions = rowActions(row, rowIndex) || [];
            } catch (err) {
              console.error(err);
            }
            actions.forEach(function (act, actIndex) {
              if (!act) return;
              if (act.show === false) return;
              const danger =
                act.danger === true || act.label === "删除";
              html +=
                '<button type="button" class="link-action' +
                (danger ? " link-action-danger" : "") +
                '" data-row="' +
                rowIndex +
                '" data-act="' +
                actIndex +
                '">' +
                escapeHtml(act.label || "") +
                "</button>";
            });
            html += "</div></td>";
          }
          html += "</tr>";
        });
      }
      html += "</tbody></table></div>";
      container.innerHTML = html;

      if (rowActions && rows.length) {
        container.querySelectorAll(".link-action").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const ri = parseInt(btn.getAttribute("data-row"), 10);
            const ai = parseInt(btn.getAttribute("data-act"), 10);
            const row = rows[ri];
            const acts = rowActions(row, ri) || [];
            const act = acts[ai];
            if (act && typeof act.onClick === "function") act.onClick(row, ri);
          });
        });
      }
      container.querySelectorAll("[data-jump-route]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          const route = el.getAttribute("data-jump-route");
          const fk = el.getAttribute("data-jump-filter");
          const fv = el.getAttribute("data-jump-value") || "";
          const q = {};
          if (fk) q[fk] = fv;
          navigate(route, q);
        });
      });
    }

    /** 下架时间展示：仅展示实际下架时间（已取消定时下架） */
    function formatOfflineAtDisplay(r) {
      if (!r) return "-";
      if (!isOfflineStatus(r.status)) return "-";
      return formatDateTime(
        r.actualOfflineAt || r.offlineAt || r.updatedAt || r.createdAt
      );
    }

    function formatDateTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return (
        d.getFullYear() +
        "-" +
        pad(d.getMonth() + 1) +
        "-" +
        pad(d.getDate()) +
        " " +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes())
      );
    }
    function formatDate(iso) {
      if (!iso) return "-";
      const raw = String(iso);
      const m = raw.match(/^(\d{4}-\d{2}-\d{2})/);
      if (m) return m[1];
      const d = new Date(iso);
      if (isNaN(d.getTime())) return raw;
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    /**
     * 上架状态归一：
     * draft/scheduled → unpublished；open/discussing/voting → published；
     * 活动/征集/测评旧态 ended/closed → offline；
     * 议题旧态 closed/ended 视为曾在架，归为 published。
     */
    function isTopicLikeRecord(record) {
      if (!record) return false;
      if (record.type === "discuss" || record.type === "vote") return true;
      if (record.voteEnd || record.discussStart || record.voteStart) return true;
      return false;
    }
    function normalizeContentStatus(status, record) {
      if (status === "draft" || status === "scheduled") return "unpublished";
      if (status === "open" || status === "discussing" || status === "voting") return "published";
      if (status === "closed" || status === "ended") {
        return isTopicLikeRecord(record) ? "published" : "offline";
      }
      return status || "unpublished";
    }
    function isUnpublishedStatus(status, record) {
      return normalizeContentStatus(status, record) === "unpublished";
    }
    function isPublishedStatus(status, record) {
      return normalizeContentStatus(status, record) === "published";
    }
    function isOfflineStatus(status, record) {
      return normalizeContentStatus(status, record) === "offline";
    }
    function getBusinessStartAt(record) {
      if (!record) return null;
      return record.startAt || record.discussStart || record.voteStart || null;
    }
    /** 业务结束时间（活动/征集/问卷/议题等） */
    function getBusinessEndAt(record) {
      if (!record) return null;
      return record.endAt || record.voteEnd || null;
    }
    /** 进行状态：not_started / ongoing / ended，只由开始/结束时间计算 */
    function getProgressStatus(record) {
      if (!record) return "ongoing";
      const now = Date.now();
      const end = getBusinessEndAt(record);
      if (end) {
        const te = Date.parse(end);
        if (!isNaN(te) && te <= now) return "ended";
      }
      const start = getBusinessStartAt(record);
      if (start) {
        const ts = Date.parse(start);
        if (!isNaN(ts) && now < ts) return "not_started";
      }
      return "ongoing";
    }
    function isProgressEnded(record) {
      return getProgressStatus(record) === "ended";
    }
    function progressStatusLabel(record, asTopic) {
      const p = getProgressStatus(record);
      if (p === "not_started") return "未开始";
      if (p === "ended") return "已结束";
      if (asTopic) {
        const kind =
          (record && record.type) ||
          (record && record.status === "voting" ? "vote" : "discuss");
        return kind === "vote" ? "表决中" : "讨论中";
      }
      return "进行中";
    }
    function progressStatusTagHtml(record, asTopic) {
      const p = getProgressStatus(record);
      const label = progressStatusLabel(record, asTopic);
      let tag = p === "ended" ? "" : p === "not_started" ? "tag-orange" : "tag-green";
      if (asTopic && p === "ongoing") {
        const kind =
          (record && record.type) ||
          (record && record.status === "voting" ? "vote" : "discuss");
        tag = kind === "vote" ? "tag-green" : "tag-blue";
      }
      return '<span class="tag ' + tag + '">' + escapeHtml(label) + "</span>";
    }
    /** @deprecated 进行状态是否已结束；不再用于拦截上架 */
    function isBusinessEnded(record) {
      return isProgressEnded(record);
    }
    /** 已上架后产生的业务数据（报名/答卷）是否可查看：已上架或已下架/已结束 */
    function canViewPublishSideData(status) {
      return isPublishedStatus(status) || isOfflineStatus(status);
    }

    /** 活动是否开启在线报名（缺省视为是，与表单/群众端一致） */
    function isOnlineSignupEnabled(row) {
      if (!row) return false;
      return (
        row.onlineSignup !== false &&
        row.onlineSignup !== "false" &&
        row.onlineSignup !== 0 &&
        row.onlineSignup !== "0"
      );
    }

    /**
     * 规范化发布字段。
     * opts.fromSave：表单保存。立即上架保存即发布；定时上架仅校验计划时间。
     * 定时任务不传 fromSave。
     * 返回 record，校验失败返回 false。
     */
    function normalizeSchedulePublish(record, opts) {
      opts = opts || {};
      if (!record) return record;
      const now = Date.now();
      const nowIso = nowISO();
      // 终态/旧态先归一
      if (record.status === "ended" || record.status === "closed") {
        record.status = "offline";
      } else if (record.status === "draft" || record.status === "scheduled") {
        record.status = "unpublished";
      } else if (record.status === "open") {
        record.status = "published";
      }
      const publishMode = record.publishMode;
      if (Object.prototype.hasOwnProperty.call(record, "publishMode")) {
        delete record.publishMode;
      }
      if (record.status === "unpublished" || (opts.fromSave && record.status === "offline")) {
        if (opts.fromSave) {
          const isSchedule = publishMode === "schedule";
          if (!isSchedule) {
            record.status = "published";
            record.publishAt = nowIso;
            record.actualPublishAt = nowIso;
            delete record.actualOfflineAt;
            if (isProgressEnded(record)) record._endedPublishWarn = true;
          } else {
            if (!record.publishAt) {
              toast("定时上架请填写计划上架时间", "warning");
              return false;
            }
            const t = new Date(record.publishAt).getTime();
            if (isNaN(t)) {
              toast("计划上架时间格式不正确", "warning");
              return false;
            }
            if (t <= now) {
              toast("计划上架时间已过，请修改时间或直接点击「上架」", "warning");
              return false;
            }
            record.status = "unpublished";
            delete record.actualOfflineAt;
          }
        } else if (record.publishAt) {
          const t2 = new Date(record.publishAt).getTime();
          if (!isNaN(t2) && t2 <= now) {
            record.status = "published";
            if (!record.actualPublishAt) record.actualPublishAt = nowIso;
            // publishAt 保留原计划时间；实际上架记 actualPublishAt
          }
        }
      } else if (record.status === "published") {
        if (!record.publishAt) record.publishAt = nowIso;
        if (!record.actualPublishAt) record.actualPublishAt = record.publishAt;
      }
      // 清除历史定时下架字段，避免误触发
      if (Object.prototype.hasOwnProperty.call(record, "offlineAt") && opts.fromSave) {
        delete record.offlineAt;
      }
      return record;
    }

    /** 定时上架到期 → 已上架；到期不改上架状态。议题旧态归为已上架。 */
    function processScheduledPublishes() {
      let changed = false;
      const now = Date.now();
      const nowIso = nowISO();
      SCHEDULE_PUBLISH_KEYS.forEach(function (shortKey) {
        const fullKey = KEYS[shortKey] || shortKey;
        const list = getAll(fullKey);
        if (!list || !list.length) return;
        let dirty = false;
        list.forEach(function (r) {
          if (!r || r.deleted) return;
          if (fullKey === KEYS.topics) {
            if (
              r.status === "ended" ||
              r.status === "closed" ||
              r.status === "discussing" ||
              r.status === "voting" ||
              r.status === "open"
            ) {
              r.status = "published";
              dirty = true;
            }
          } else if (r.status === "ended" || r.status === "closed") {
            r.status = "offline";
            dirty = true;
          }
          if (r.status === "draft" || r.status === "scheduled") {
            r.status = "unpublished";
            dirty = true;
          }
          if (r.status === "open") {
            r.status = "published";
            dirty = true;
          }
          if (r.status === "unpublished" && r.publishAt) {
            const t = new Date(r.publishAt).getTime();
            if (!isNaN(t) && t <= now) {
              r.status = "published";
              r.actualPublishAt = nowIso;
              dirty = true;
            }
          }
        });
        if (dirty) {
          storageSet(fullKey, list);
          changed = true;
        }
      });
      return changed;
    }

    let _scheduleTimer = null;
    function startSchedulePublishTicker() {
      processScheduledPublishes();
      if (_scheduleTimer) return;
      _scheduleTimer = setInterval(function () {
        processScheduledPublishes();
      }, 15000);
    }

    function isoToDatetimeLocal(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return (
        d.getFullYear() +
        "-" +
        pad(d.getMonth() + 1) +
        "-" +
        pad(d.getDate()) +
        "T" +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes())
      );
    }

    function datetimeLocalToIso(val) {
      if (!val) return null;
      const d = new Date(val);
      if (isNaN(d.getTime())) return null;
      return d.toISOString();
    }
    function isoToDateInput(iso) {
      if (!iso) return "";
      const raw = String(iso);
      const m = raw.match(/^(\d{4}-\d{2}-\d{2})/);
      if (m) return m[1];
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }
    function dateInputToValue(val) {
      if (!val) return "";
      const m = String(val).match(/^(\d{4}-\d{2}-\d{2})/);
      return m ? m[1] : "";
    }
    const ATTACH_MAX_COUNT = 5;
    const ATTACH_MAX_BYTES = 10 * 1024 * 1024;
    const ATTACH_ACCEPT =
      "image/*,.pdf,.doc,.docx,.xls,.xlsx,.csv,.ppt,.pptx";
    function isAllowedAttachFile(file) {
      if (!file) return false;
      const name = String(file.name || "").toLowerCase();
      const type = String(file.type || "").toLowerCase();
      if (type.indexOf("image/") === 0) return true;
      if (/\.(png|jpe?g|gif|webp|bmp|svg|pdf|doc|docx|xls|xlsx|csv|ppt|pptx)$/i.test(name)) {
        return true;
      }
      if (
        type === "application/pdf" ||
        type.indexOf("msword") >= 0 ||
        type.indexOf("officedocument") >= 0 ||
        type.indexOf("ms-excel") >= 0 ||
        type.indexOf("ms-powerpoint") >= 0 ||
        type === "text/csv"
      ) {
        return true;
      }
      return false;
    }
    function fileSizeLabel(n) {
      const num = Number(n) || 0;
      if (num < 1024) return num + " B";
      if (num < 1024 * 1024) return Math.round((num / 1024) * 10) / 10 + " KB";
      return Math.round((num / 1024 / 1024) * 10) / 10 + " MB";
    }
    function isAttachImage(item) {
      if (!item) return false;
      if (item.isImage) return true;
      const t = String(item.type || "");
      if (t.indexOf("image/") === 0) return true;
      return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(String(item.name || ""));
    }
    function openAttachPreview(item) {
      if (!item || !item.dataUrl) return;
      if (!isAttachImage(item)) {
        const a = document.createElement("a");
        a.href = item.dataUrl;
        a.download = item.name || "附件";
        document.body.appendChild(a);
        a.click();
        if (a.parentNode) a.parentNode.removeChild(a);
        return;
      }
      const mask = document.createElement("div");
      mask.className = "file-preview-mask";
      mask.innerHTML = '<img alt="" src="' + item.dataUrl.replace(/"/g, "&quot;") + '" />';
      mask.addEventListener("click", function () {
        if (mask.parentNode) mask.parentNode.removeChild(mask);
      });
      document.body.appendChild(mask);
    }
    function attachmentsViewHtml(list) {
      const files = Array.isArray(list) ? list : [];
      if (!files.length) return "";
      return (
        '<div class="attach-list">' +
        files
          .map(function (f) {
            const img = isAttachImage(f);
            const src = String(f.dataUrl || "").replace(/"/g, "&quot;");
            return (
              '<div class="attach-item" data-attach-preview="1" data-image="' +
              (img ? "1" : "0") +

              escapeHtml(f.type || "") +

              '">' +
              (img
                ? '<img class="attach-thumb" alt="" src="' + src + '" />'
                : '<span class="attach-file-icon"><i class="ri-attachment-2"></i></span>') +
              '<span class="attach-meta"><span class="attach-name" title="' +
              escapeHtml(f.name || "附件") +
              '">' +
              escapeHtml(f.name || "附件") +
              '</span><span class="attach-size">' +
              escapeHtml(fileSizeLabel(f.size)) +
              "</span></span></div>"
            );
          })
          .join("") +
        "</div>"

    }

    function bindAttachPreviewClicks(panel) {

      panel._attachPreviewBound = true;
      panel.addEventListener("click", function (e) {

    function bindAttachmentFields(panel) {
      if (!panel) return;
      panel.querySelectorAll("[data-attach]").forEach(function (wrap) {
        if (wrap._attBound) return;
        wrap._attBound = true;
        const mode = wrap.getAttribute("data-attach-mode") || "edit";
        const listEl = wrap.querySelector("[data-attach-list]");
        const addBtn = wrap.querySelector("[data-attach-add]");
        const fileInput = wrap.querySelector("[data-attach-input]");
        const seedEl = wrap.querySelector("[data-attach-seed]");
        let files = [];
        try {
          files = JSON.parse((seedEl && seedEl.value) || "[]") || [];
        } catch (e) {
          files = [];
        }
        if (!Array.isArray(files)) files = [];
        wrap._files = files;
        function renderList() {
          if (!listEl) return;
          if (!files.length) {
            listEl.innerHTML =
              mode === "view"
                ? '<div class="attach-empty">暂无图片/附件</div>'
                : "";
            return;
          }
          listEl.innerHTML = files
            .map(function (f, i) {
              const img = isAttachImage(f);
              return (
                '<div class="attach-item">' +
                (img
                  ? '<img class="attach-thumb" alt="" data-attach-open="' +
                    i +
                    '" src="' +
                    String(f.dataUrl || "").replace(/"/g, "&quot;") +
                    '" />'
                  : '<span class="attach-file-icon" data-attach-open="' +
                    i +
                    '"><i class="ri-attachment-2"></i></span>') +
                '<span class="attach-meta"><span class="attach-name" title="' +
                escapeHtml(f.name || "附件") +
                '">' +
                escapeHtml(f.name || "附件") +
                '</span><span class="attach-size">' +
                escapeHtml(fileSizeLabel(f.size)) +
                "</span></span>" +
                (mode === "view"
                  ? ""
                  : '<button type="button" class="attach-remove" data-attach-del="' +
                    i +
                    '" title="移除"><i class="ri-close-line"></i></button>') +
                "</div>"
              );
            })
            .join("");
        }
        wrap.addEventListener("click", function (e) {
          const openEl = e.target.closest("[data-attach-open]");
          if (openEl) {
            const idx = Number(openEl.getAttribute("data-attach-open"));
            if (!isNaN(idx) && files[idx]) openAttachPreview(files[idx]);
            return;
          }
          const delEl = e.target.closest("[data-attach-del]");
          if (delEl && mode !== "view") {
            const idx = Number(delEl.getAttribute("data-attach-del"));
            if (!isNaN(idx)) {
              files.splice(idx, 1);
              wrap._files = files;
              renderList();
            }
          }
        });
        if (addBtn && fileInput && mode !== "view") {
          addBtn.addEventListener("click", function () {
            fileInput.click();
          });
          fileInput.addEventListener("change", function () {
            const picked = Array.prototype.slice.call(fileInput.files || []);
            fileInput.value = "";
            picked.forEach(function (file) {
              if (files.length >= ATTACH_MAX_COUNT) {
                toast("最多上传 " + ATTACH_MAX_COUNT + " 个文件", "warning");
                return;
              }
              if (!isAllowedAttachFile(file)) {
                toast("仅支持图片、PDF、Excel、Word 等文件", "warning");
                return;
              }
              if (file.size > ATTACH_MAX_BYTES) {
                toast("「" + file.name + "」超过 10MB，请压缩后重试", "warning");
                return;
              }
              const reader = new FileReader();
              reader.onload = function () {
                files.push({
                  id: uid("att"),
                  name: file.name,
                  size: file.size,
                  type: file.type || "",
                  isImage: isAttachImage({ type: file.type, name: file.name }),
                  dataUrl: String(reader.result || ""),
                });
                wrap._files = files;
                renderList();
              };
              reader.readAsDataURL(file);
            });
          });
        }
        renderList();
      });
    }

    function bindSearchSelects(panel) {
      if (!panel) return;
      panel.querySelectorAll("[data-search-select]").forEach(function (wrap) {
        if (wrap._ssBound) return;
        wrap._ssBound = true;
        const hidden = wrap.querySelector("[data-field]");
        const input = wrap.querySelector(".search-select-input");
        const listEl = wrap.querySelector(".search-select-panel");
        if (!hidden || !input || !listEl) return;
        let opts = [];
        try {
          opts = JSON.parse(wrap.getAttribute("data-ss-opts") || "[]") || [];
        } catch (e) {
          opts = [];
        }
        let activeIndex = -1;
        function norm(s) {
          return String(s || "")
            .toLowerCase()
            .replace(/[\s\-]/g, "");
        }
        function matchOpt(opt, q) {
          if (!q) return true;
          const hay = norm(opt.keywords || "") + " " + norm(opt.label || "") + " " + norm(opt.value || "");
          return hay.indexOf(q) >= 0;
        }
        function typeFilterVal() {
          const root = wrap.closest("#sws-drawer") || wrap.closest(".drawer") || panel;
          const typeEl = root && root.querySelector('[data-field="personType"]');
          return typeEl ? String(typeEl.value || "") : "";
        }
        function typedOpts() {
          const typeVal = typeFilterVal();
          return opts.filter(function (o) {
            if (!o || o.value === "" || o.value == null) return false;
            if (typeVal && o.personType && String(o.personType) !== typeVal) return false;
            return true;
          });
        }
        function currentHits() {
          const q = norm(input.value);
          const selected = hidden.value;
          const pool = typedOpts();
          if (selected) {
            const sel = opts.find(function (o) {
              return String(o.value) === String(selected);
            });
            if (sel && String(input.value) === String(sel.label)) return pool;
          }
          return pool.filter(function (o) {
            return matchOpt(o, q);
          });
        }
        function closePanel() {
          listEl.hidden = true;
          activeIndex = -1;
        }
        function highlight(items) {
          items.forEach(function (el, i) {
            if (i === activeIndex) el.classList.add("active");
            else el.classList.remove("active");
          });
          if (activeIndex >= 0 && items[activeIndex]) {
            const el = items[activeIndex];
            if (el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
          }
        }
        function pick(opt) {
          hidden.value = opt ? String(opt.value) : "";
          input.value = opt ? opt.label : "";
          if (opt && opt.personType) {
            const root = wrap.closest("#sws-drawer") || wrap.closest(".drawer") || panel;
            const typeEl = root && root.querySelector('[data-field="personType"]');
            if (typeEl && !typeEl.disabled) typeEl.value = opt.personType;
          }
          closePanel();
        }
        function renderPanel() {
          const hits = currentHits();
          if (!hits.length) {
            listEl.innerHTML = '<div class="search-select-empty">无匹配对象</div>';
            listEl.hidden = false;
            activeIndex = -1;
            return;
          }
          listEl.innerHTML = hits
            .map(function (opt) {
              return (
                '<div class="search-select-item" data-value="' +
                escapeHtml(opt.value) +
                '">' +
                escapeHtml(opt.label) +
                "</div>"
              );
            })
            .join("");
          listEl.hidden = false;
          listEl.querySelectorAll(".search-select-item").forEach(function (item) {
            item.addEventListener("mousedown", function (e) {
              e.preventDefault();
              const id = item.getAttribute("data-value");
              const opt = opts.find(function (o) {
                return String(o.value) === String(id);
              });
              pick(opt);
            });
          });
          activeIndex = 0;
          highlight(listEl.querySelectorAll(".search-select-item"));
        }
        input.addEventListener("focus", function () {
          if (input.disabled) return;
          renderPanel();
        });
        input.addEventListener("input", function () {
          hidden.value = "";
          renderPanel();
        });
        input.addEventListener("keydown", function (e) {
          if (listEl.hidden) {
            if (e.key === "ArrowDown") {
              e.preventDefault();
              renderPanel();
            }
            return;
          }
          const items = listEl.querySelectorAll(".search-select-item");
          if (e.key === "ArrowDown") {
            e.preventDefault();
            activeIndex = Math.min(items.length - 1, activeIndex + 1);
            highlight(items);
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            activeIndex = Math.max(0, activeIndex - 1);
            highlight(items);
          } else if (e.key === "Enter") {
            e.preventDefault();
            if (activeIndex >= 0 && items[activeIndex]) items[activeIndex].dispatchEvent(new Event("mousedown"));
          } else if (e.key === "Escape") {
            closePanel();
          }
        });
        input.addEventListener("blur", function () {
          setTimeout(function () {
            closePanel();
            if (hidden.value) {
              const sel = opts.find(function (o) {
                return String(o.value) === String(hidden.value);
              });
              if (sel) input.value = sel.label;
              return;
            }
            const q = norm(input.value);
            if (!q) return;
            const hits = typedOpts().filter(function (o) {
              return o && o.value && matchOpt(o, q);
            });
            if (hits.length === 1) pick(hits[0]);
            else input.value = "";
          }, 120);
        });
        const typeEl = (wrap.closest("#sws-drawer") || wrap.closest(".drawer") || panel).querySelector(

            }
            if (!listEl.hidden) renderPanel();
          });
        }
        document.addEventListener("click", function (e) {

        });
      });

    function sanitizeRichHtml(html) {
      const wrap = document.createElement("div");
      wrap.innerHTML = String(html || "");
      const allowed = {
        P: 1, BR: 1, DIV: 1, SPAN: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1,
        UL: 1, OL: 1, LI: 1, H2: 1, H3: 1, H4: 1, BLOCKQUOTE: 1, A: 1, IMG: 1,
      };
      function walk(node) {
        Array.prototype.slice.call(node.childNodes).forEach(function (child) {
          if (child.nodeType !== 1) return;
          if (!allowed[child.tagName]) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          Array.prototype.slice.call(child.attributes || []).forEach(function (attr) {
            const n = String(attr.name || "").toLowerCase();
            if (n === "href" || n === "src" || n === "alt" || n === "target") {
              if (/^\s*javascript:/i.test(attr.value || "")) child.removeAttribute(attr.name);
              return;
            }
            child.removeAttribute(attr.name);
          });
          walk(child);
        });
      }
      walk(wrap);
      return wrap.innerHTML;
    }

    function toRichHtml(val) {
      const s = val == null ? "" : String(val);
      if (!s) return "";
      if (looksLikeHtml(s)) return sanitizeRichHtml(s);
      return s
        .split(/\n/)
        .map(function (line) {
          return "<p>" + (line ? escapeHtml(line) : "<br>") + "</p>";
        })
        .join("");
    }
