<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>金华市基层智治综合应用 - 社会工作服务</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1677FF;
      --color-success: #52C41A;
      --color-danger: #FF4D4F;
      --color-warning: #FAAD14;
      --color-border: #D9D9D9;
      --color-bg: #F0F2F5;
      --color-bg-elevated: #FFFFFF;
      --color-text: rgba(0,0,0,0.88);
      --color-text-secondary: rgba(0,0,0,0.65);
      --radius: 2px;
      --control-height: 32px;
      --font-size: 14px;
      --header-height: 48px;
      --sidebar-width: 220px;
      --drawer-width: 640px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: var(--font-size);
      color: var(--color-text);
      background: var(--color-bg);
    }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: #4096ff; }

    /* ---- Shell layout ---- */
    .pc-header {
      height: var(--header-height);
      background: #1677FF;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }
    .pc-header .logo {
      font-size: 15px;
      font-weight: 600;
      margin-right: 32px;
      white-space: nowrap;
    }
    .pc-header .nav-item {
      padding: 0 14px;
      height: var(--header-height);
      line-height: var(--header-height);
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
    }
    .pc-header .nav-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .pc-header .nav-item.active {
      color: #fff;
      font-weight: 600;
      border-bottom-color: #fff;
      background: rgba(0,0,0,0.08);
    }
    .pc-header .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
    }
    .pc-body { display: flex; flex: 1; min-height: 0; }
    .pc-sidebar {
      width: var(--sidebar-width);
      background: #fff;
      border-right: 1px solid var(--color-border);
      flex-shrink: 0;
      overflow-y: auto;
      padding: 8px 0;
    }
    .pc-sidebar .menu-group-title {
      padding: 10px 16px 6px;
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .pc-sidebar .menu-group {
      user-select: none;
    }
    .pc-sidebar .menu-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 10px 16px;
      color: var(--color-text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .pc-sidebar .menu-group-head:hover { background: #f5f5f5; }
    .pc-sidebar .menu-group-head .arrow {
      margin-left: auto;
      font-size: 14px;
      color: var(--color-text-secondary);
      transition: transform 0.15s ease;
    }
    .pc-sidebar .menu-group.collapsed > .menu-group-body { display: none; }
    .pc-sidebar .menu-group.collapsed > .menu-group-head .arrow { transform: rotate(-90deg); }
    .pc-sidebar .menu-group-body { /* nested */ }
    .pc-sidebar .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px 9px 20px;
      color: var(--color-text);
      cursor: pointer;
      font-size: 13px;
      border-right: 2px solid transparent;
    }
    .pc-sidebar .menu-item.depth-1 { padding-left: 28px; }
    .pc-sidebar .menu-item.depth-2 { padding-left: 40px; font-weight: 400; }
    .pc-sidebar .menu-item:hover { background: #f5f5f5; }
    .pc-sidebar .menu-item.active {
      color: var(--color-primary);
      background: #e6f4ff;
      border-right-color: var(--color-primary);
      font-weight: 500;
    }
    .pc-sidebar .menu-item i { font-size: 16px; flex-shrink: 0; }
    .pc-sidebar .menu-subhead {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 28px;
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .pc-sidebar .menu-subhead:hover { background: #f5f5f5; color: var(--color-text); }
    .pc-sidebar .menu-subhead .arrow {
      margin-left: auto;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    .pc-sidebar .menu-subgroup.collapsed > .menu-sub-body { display: none; }
    .pc-sidebar .menu-subgroup.collapsed > .menu-subhead .arrow { transform: rotate(-90deg); }
    .pc-header .header-right .form-control {
      height: 28px;
      min-width: 140px;
      max-width: 220px;
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.35);
      color: #fff;
      font-size: 12px;
    }
    .pc-header .header-right .form-control option { color: var(--color-text); background: #fff; }
    .pc-header .header-right i { font-size: 18px; cursor: default; opacity: 0.9; }
    .pc-main {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      overflow: auto;
    }
    #pc-content { min-height: 100%; }
    .page-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--color-text);
    }
    .page-card {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 24px 20px;
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }

    /* ---- Filter card ---- */
    .filter-card {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 16px 16px 8px;
      margin-bottom: 12px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-item label {
      font-size: 13px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .filter-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* ---- Form controls ---- */
    .form-control {
      height: var(--control-height);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 4px 11px;
      font-size: 13px;
      color: var(--color-text);
      background: #fff;
      outline: none;
      min-width: 160px;
    }
    .form-control:focus { border-color: var(--color-primary); }
    .form-control:disabled,
    .form-control[readonly] {
      background: #f5f5f5;
      color: var(--color-text-secondary);
      cursor: not-allowed;
    }
    select.form-control { padding-right: 24px; }
    textarea.form-control {
      height: auto;
      min-height: 72px;
      padding: 8px 11px;
      resize: vertical;
      line-height: 1.5;
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: var(--control-height);
      padding: 0 15px;
      font-size: 13px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      background: #fff;
      color: var(--color-text);
      line-height: 1;
      transition: none;
    }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .btn-primary:hover { background: #4096ff; border-color: #4096ff; opacity: 1; }
    .btn-success {
      background: var(--color-success);
      border-color: var(--color-success);
      color: #fff;
    }
    .btn-success:hover { background: #73d13d; border-color: #73d13d; opacity: 1; }
    .btn-default {
      background: #fff;
      border-color: var(--color-border);
      color: var(--color-text);
    }
    .btn-default:hover { color: var(--color-primary); border-color: var(--color-primary); opacity: 1; }
    .btn-danger-ghost {
      background: #fff;
      border-color: #ffccc7;
      color: var(--color-danger);
    }
    .btn-danger-ghost:hover { border-color: var(--color-danger); opacity: 1; }
    .btn-link {
      background: transparent;
      border: none;
      color: var(--color-primary);
      padding: 0 6px;
      height: auto;
      font-size: 13px;
    }
    .btn-link:hover { color: #4096ff; opacity: 1; }
    .btn-link.danger { color: var(--color-danger); }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

    /* ---- Table ---- */
    .table-wrap {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: auto;
    }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .table-wrap th {
      background: #e6f4ff;
      color: var(--color-text);
      font-weight: 600;
      font-size: 13px;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }
    .table-wrap td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid #f0f0f0;
      color: var(--color-text);
      word-break: break-all;
      vertical-align: middle;
    }
    .table-wrap tr:last-child td { border-bottom: none; }
    .table-wrap tbody tr:hover { background: #fafafa; }
    .table-wrap .col-actions {
      white-space: nowrap;
      color: var(--color-primary);
    }
    .table-wrap .col-actions a,
    .table-wrap .col-actions .link-action {
      color: var(--color-primary);
      cursor: pointer;
      margin-right: 12px;
      font-size: 13px;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .table-wrap .col-actions a:last-child,
    .table-wrap .col-actions .link-action:last-child { margin-right: 0; }
    .table-wrap .col-actions a:hover,
    .table-wrap .col-actions .link-action:hover { color: #4096ff; }
    .table-empty {
      text-align: center;
      color: var(--color-text-secondary);
      padding: 32px 12px !important;
    }
    .table-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 10px 0 0;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .tag {
      display: inline-block;
      padding: 0 7px;
      height: 22px;
      line-height: 20px;
      font-size: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: #fafafa;
      color: var(--color-text-secondary);
    }
    .tag-blue { color: var(--color-primary); background: #e6f4ff; border-color: #91caff; }
    .tag-green { color: var(--color-success); background: #f6ffed; border-color: #b7eb8f; }
    .tag-orange { color: #d48806; background: #fffbe6; border-color: #ffe58f; }
    .tag-red { color: var(--color-danger); background: #fff2f0; border-color: #ffccc7; }

    /* ---- Drawer ---- */
    .drawer-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--drawer-width);
      max-width: 100%;
      height: 100vh;
      background: #fff;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--color-border);
    }
    .drawer-header {
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .drawer-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drawer-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
    }
    .drawer-body {
      flex: 1;
      overflow: auto;
      padding: 16px 20px 24px;
    }
    .form-section-title {
      font-size: 14px;
      font-weight: 600;
      margin: 8px 0 16px;
      padding-left: 8px;
      border-left: 3px solid var(--color-primary);
      line-height: 1.2;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }
    .form-grid .form-field.full { grid-column: 1 / -1; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field > label {
      font-size: 13px;
      color: var(--color-text);
    }
    .form-field > label .req {
      color: var(--color-danger);
      margin-right: 2px;
    }
    .form-field .form-control { width: 100%; min-width: 0; }

    /* ---- Confirm dialog ---- */
    .confirm-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .confirm-dialog {
      width: 400px;
      max-width: calc(100vw - 32px);
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
    }
    .confirm-dialog .confirm-title {
      padding: 14px 16px 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .confirm-dialog .confirm-content {
      padding: 8px 16px 20px;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .confirm-dialog .confirm-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px 14px;
    }

    /* ---- Toast ---- */
    #sws-toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--radius);
      z-index: 4000;
      font-size: 13px;
      display: none;
      max-width: 80vw;
      text-align: center;
      pointer-events: none;
    }
    #sws-toast.toast-success { background: rgba(82, 196, 26, 0.92); }
    #sws-toast.toast-error { background: rgba(255, 77, 79, 0.92); }
    #sws-toast.toast-warning { background: rgba(250, 173, 20, 0.95); color: #fff; }
  </style>
</head>

    /* ========== DataAPI + 权限 ========== */
    const VISIBILITY = {};
    VISIBILITY[KEYS.notices] = "upward";
    VISIBILITY[KEYS.serviceItems] = "upward";
    VISIBILITY[KEYS.facilities] = "upward";
    VISIBILITY[KEYS.forces] = "upward";
    VISIBILITY[KEYS.aidPolicies] = "upward";
    VISIBILITY[KEYS.foundations] = "upward";
    VISIBILITY[KEYS.affairs] = "village";
    VISIBILITY[KEYS.topics] = "village";
    VISIBILITY[KEYS.activities] = "scope";
    VISIBILITY[KEYS.collectCampaigns] = "scope";
    VISIBILITY[KEYS.surveys] = "scope";
    VISIBILITY[KEYS.suggestions] = "self";
    VISIBILITY[KEYS.assistApplications] = "self";

    function getAll(key) {
      return storageGet(key) || [];
    }
    function getOrg(id) {
      return getAll(KEYS.orgs).find((o) => o.id === id) || null;
    }
    function getOrgDescendants(orgId) {
      return getAll(KEYS.orgs)
        .filter((o) => (o.path || []).includes(orgId))
        .map((o) => o.id);
    }
    function isAncestorOrg(ancestorId, childId) {
      const child = getOrg(childId);
      return !!(child && (child.path || []).includes(ancestorId));
    }

    function getPcSession() {
      return storageGet(KEYS.pcSession);
    }
    function setPcSession(s) {
      storageSet(KEYS.pcSession, s);
    }
    function getH5Session() {
      return storageGet(KEYS.h5Session);
    }
    function setH5Session(s) {
      storageSet(KEYS.h5Session, s);
    }

    function listForPc(key) {
      const session = getPcSession();
      if (!session || !session.orgId) return [];
      const ids = new Set(getOrgDescendants(session.orgId));
      return getAll(key).filter((r) => ids.has(r.orgId) && !r.deleted);
    }
    function canManage(record) {
      const session = getPcSession();
      return !!(record && session && record.orgId === session.orgId);
    }

    function scopeMatchesUser(record, sessionOrgId, path) {
      const ids = record.scopeOrgIds;
      if (ids && ids.length) return ids.includes(sessionOrgId);
      if (record.scopeType === "org") return record.orgId === sessionOrgId;
      // all_children / default: 发布方为本级或上级
      return (path || []).includes(record.orgId);
    }

    function listForH5(moduleKey) {
      const session = getH5Session();
      if (!session) return [];
      const orgId = session.orgId;
      const userId = session.userId;
      const userOrg = getOrg(orgId);
      const path = userOrg ? (userOrg.path || []) : [];
      const all = getAll(moduleKey).filter((r) => !r.deleted);
      const rule = VISIBILITY[moduleKey];

      if (rule === "upward") {
        return all.filter((r) => r.status === "published" && path.includes(r.orgId));
      }
      if (rule === "village") {
        if (moduleKey === KEYS.topics) {
          return all.filter((r) => r.orgId === orgId && r.status !== "draft");
        }
        return all.filter((r) => r.orgId === orgId && r.status === "published");
      }
      if (rule === "scope") {
        const statusOk =
          moduleKey === KEYS.activities
            ? (s) => s === "published"
            : (s) => s === "open";
        return all.filter((r) => statusOk(r.status) && scopeMatchesUser(r, orgId, path));
      }
      if (rule === "self") {
        return all.filter((r) => r.userId === userId);
      }
      return all.filter((r) => r.status === "published");
    }

    function listVisible(key, opts) {
      opts = opts || {};
      if (opts.side === "h5" || opts.client === "h5") return listForH5(key);
      return listForPc(key);
    }

    function getById(key, id) {
      return getAll(key).find((x) => x.id === id) || null;
    }
    function saveRecord(key, record) {
      const list = getAll(key);
      const idx = list.findIndex((x) => x.id === record.id);
      if (idx >= 0) list[idx] = record;
      else list.unshift(record);
      storageSet(key, list);
      return record;
    }
    function removeRecord(key, id) {
      const list = getAll(key).map((x) => (x.id === id ? Object.assign({}, x, { deleted: true }) : x));
      storageSet(key, list);
    }

    /* ========== UI Kit ========== */
    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function toast(message, type) {
      let el = document.getElementById("sws-toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "sws-toast";
        document.body.appendChild(el);
      }
      el.className = "";
      if (type === "success") el.classList.add("toast-success");
      else if (type === "error") el.classList.add("toast-error");
      else if (type === "warning") el.classList.add("toast-warning");
      el.textContent = message == null ? "" : String(message);
      el.style.display = "block";
      clearTimeout(el._t);
      el._t = setTimeout(function () {
        el.style.display = "none";
      }, 2000);
    }

    function confirmDialog(opts) {
      opts = opts || {};
      const title = opts.title || "确认";
      const content = opts.content || "";
      const onOk = opts.onOk;
      const mask = document.createElement("div");
      mask.className = "confirm-mask";
      mask.innerHTML =
        '<div class="confirm-dialog" role="dialog">' +
        '<div class="confirm-title">' + escapeHtml(title) + "</div>" +
        '<div class="confirm-content">' + escapeHtml(content) + "</div>" +
        '<div class="confirm-footer">' +
        '<button type="button" class="btn btn-default" data-act="cancel">取消</button>' +
        '<button type="button" class="btn btn-primary" data-act="ok">确定</button>' +
        "</div></div>";
      function close() {
        if (mask.parentNode) mask.parentNode.removeChild(mask);
      }
      mask.addEventListener("click", function (e) {
        if (e.target === mask) close();
      });
      mask.querySelector('[data-act="cancel"]').addEventListener("click", close);
      mask.querySelector('[data-act="ok"]').addEventListener("click", function () {
        let keep = false;
        if (typeof onOk === "function") {
          try {
            keep = onOk() === false;
          } catch (err) {
            console.error(err);
          }
        }
        if (!keep) close();
      });
      document.body.appendChild(mask);
      return { close: close };
    }

    let _drawerState = null;

    function closeDrawer() {
      const mask = document.getElementById("sws-drawer-mask");
      const panel = document.getElementById("sws-drawer");
      if (mask && mask.parentNode) mask.parentNode.removeChild(mask);
      if (panel && panel.parentNode) panel.parentNode.removeChild(panel);
      _drawerState = null;
    }

      panel.innerHTML =
        '<div class="drawer-header">' +
        '<div class="drawer-title">' + escapeHtml(title) + "</div>" +
        '<div class="drawer-header-actions">' +
        (showSubmit
          ? '<button type="button" class="btn btn-primary" data-act="submit">提交</button>'
          : "") +
        '<button type="button" class="btn btn-danger-ghost" data-act="close">关闭</button>' +
        "</div></div>" +
        '<div class="drawer-body">' + bodyHtml + "</div>";

      panel.querySelector('[data-act="close"]').addEventListener("click", closeDrawer);
      const submitBtn = panel.querySelector('[data-act="submit"]');
      if (submitBtn) {
        submitBtn.addEventListener("click", function () {
          if (typeof onSubmit === "function") {
            let shouldClose = true;
            try {
              shouldClose = onSubmit() !== false;
            } catch (err) {
              console.error(err);
              shouldClose = false;
            }
            if (shouldClose) closeDrawer();
          } else {
            closeDrawer();
          }
        });
      }

      // view mode: disable form controls in body
      if (mode === "view") {
        const body = panel.querySelector(".drawer-body");
        body.querySelectorAll("input, select, textarea, button").forEach(function (ctrl) {
          if (ctrl.getAttribute("data-act")) return;
          if (ctrl.tagName === "BUTTON") {
            ctrl.disabled = true;
          } else {
            ctrl.disabled = true;
          }
        });
      }

      document.body.appendChild(mask);
      document.body.appendChild(panel);
      _drawerState = { mode: mode, onSubmit: onSubmit };
      return { close: closeDrawer, panel: panel };
    }

    function renderTable(container, options) {
      options = options || {};
      const columns = options.columns || [];
      const rows = options.rows || [];
      const rowActions = options.rowActions;
      if (!container) return;

      let html = '<div class="table-wrap"><table><thead><tr>';
      columns.forEach(function (col) {
        const w = col.width ? ' style="width:' + col.width + '"' : "";
        html += "<th" + w + ">" + escapeHtml(col.title || col.key || "") + "</th>";
      });
      if (rowActions) {
        html += '<th style="width:160px">操作</th>';
      }
      html += "</tr></thead><tbody>";

      if (!rows.length) {
        const colSpan = columns.length + (rowActions ? 1 : 0);
        html +=
          '<tr><td class="table-empty" colspan="' +
          colSpan +
          '">暂无数据</td></tr>';
      } else {
        rows.forEach(function (row, rowIndex) {
          html += '<tr data-row-index="' + rowIndex + '">';
          columns.forEach(function (col) {
            let cell;
            if (typeof col.render === "function") {
              cell = col.render(row, rowIndex);
              if (cell == null) cell = "";
            } else {
              cell = escapeHtml(row[col.key] == null ? "" : row[col.key]);
            }
            html += "<td>" + cell + "</td>";
          });
          if (rowActions) {
            html += '<td class="col-actions">';
            let actions = [];
            try {
              actions = rowActions(row, rowIndex) || [];
            } catch (err) {
              console.error(err);
            }
            actions.forEach(function (act, actIndex) {
              if (!act) return;
              if (act.show === false) return;
              html +=
                '<button type="button" class="link-action" data-row="' +
                rowIndex +
                '" data-act="' +
                actIndex +
                '">' +
                escapeHtml(act.label || "") +
                "</button>";
            });
            html += "</td>";
          }
          html += "</tr>";
        });
      }
      html += "</tbody></table></div>";
      container.innerHTML = html;

      if (rowActions && rows.length) {
        container.querySelectorAll(".link-action").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const ri = parseInt(btn.getAttribute("data-row"), 10);
            const ai = parseInt(btn.getAttribute("data-act"), 10);
            const row = rows[ri];
            const acts = rowActions(row, ri) || [];
            const act = acts[ai];
            if (act && typeof act.onClick === "function") act.onClick(row, ri);
          });
        });
      }
    }

    /* ========== Status / form helpers ========== */
    const STATUS_META = {
      draft: { label: "草稿", tag: "tag-orange" },
      published: { label: "已发布", tag: "tag-green" },
      offline: { label: "已下架", tag: "" },
      ended: { label: "已结束", tag: "tag-blue" },
      open: { label: "进行中", tag: "tag-green" },
      closed: { label: "已关闭", tag: "" },
      active: { label: "有效", tag: "tag-green" },
      inactive: { label: "停用", tag: "" },
    };
    const LEVEL_LABEL = { city: "市级", district: "区县", town: "乡镇", village: "村社" };
    const AFFAIR_TYPE_LABEL = { party: "党务", village: "村务", finance: "财务" };
    const SCOPE_TYPE_LABEL = { all_children: "本级及下级", org: "本组织", custom: "指定组织" };

    function statusTagHtml(status) {
      const m = STATUS_META[status] || { label: status || "-", tag: "" };
      return '<span class="tag ' + m.tag + '">' + escapeHtml(m.label) + "</span>";
    }

    function formatDateTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return (
        d.getFullYear() +
        "-" +
        pad(d.getMonth() + 1) +
        "-" +
        pad(d.getDate()) +
        " " +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes())
      );
    }

    function isoToDatetimeLocal(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return (
        d.getFullYear() +
        "-" +
        pad(d.getMonth() + 1) +
        "-" +
        pad(d.getDate()) +
        "T" +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes())
      );
    }

    function datetimeLocalToIso(val) {
      if (!val) return null;
      const d = new Date(val);
      if (isNaN(d.getTime())) return null;
      return d.toISOString();
    }

    function getSessionOrgContext() {
      const session = getPcSession() || {};
      const org = getOrg(session.orgId);
      return {
        session: session,
        orgId: session.orgId || "",
        orgLevel: org ? org.level : session.orgLevel || "",
        orgName: org ? org.name : session.orgName || "",
        userName: session.userName || "管理员",
      };
    }

    function buildFormHtml(fields, record, mode) {
      record = record || {};
      let html = '<div class="form-section-title">基本信息</div><div class="form-grid">';
      (fields || []).forEach(function (f) {
        if (!f || !f.key) return;
        const full = f.full || f.type === "textarea" || f.type === "checkbox";
        const required = !!f.required;
        let val = record[f.key];
        if (val == null) val = f.defaultValue != null ? f.defaultValue : "";
        if (f.type === "datetime") val = isoToDatetimeLocal(val);
        if (f.type === "checkbox") {
          /* handled below */
        } else if (f.type === "arrayText" && Array.isArray(val)) {
          val = val.join(",");
        }
        html +=
          '<div class="form-field' +
          (full ? " full" : "") +
          '"><label>' +
          (required ? '<span class="req">*</span>' : "") +
          escapeHtml(f.label || f.key) +
          "</label>";
        if (f.type === "select") {
          html +=
            '<select class="form-control" data-field="' +
            escapeHtml(f.key) +
            '"' +
            (required ? " required" : "") +
            ">";
          (f.options || []).forEach(function (opt) {
            const ov = typeof opt === "object" ? opt.value : opt;
            const ol = typeof opt === "object" ? opt.label : opt;
            html +=
              '<option value="' +
              escapeHtml(ov) +
              '"' +
              (String(val) === String(ov) ? " selected" : "") +
              ">" +
              escapeHtml(ol) +
              "</option>";
          });
          html += "</select>";
        } else if (f.type === "textarea") {
          html +=
            '<textarea class="form-control" data-field="' +
            escapeHtml(f.key) +
            '" rows="' +
            (f.rows || 4) +
            '"' +
            (required ? " required" : "") +
            ' placeholder="' +
            escapeHtml(f.placeholder || "") +
            '">' +
            escapeHtml(val) +
            "</textarea>";
        } else if (f.type === "checkbox") {
          const checked = val === true || val === "true" || val === 1 || val === "1";
          html +=
            '<label style="display:flex;align-items:center;gap:8px;font-weight:400">' +
            '<input type="checkbox" data-field="' +
            escapeHtml(f.key) +
            '"' +
            (checked ? " checked" : "") +
            " /> " +
            escapeHtml(f.checkLabel || "是") +
            "</label>";
        } else if (f.type === "datetime") {
          html +=
            '<input type="datetime-local" class="form-control" data-field="' +
            escapeHtml(f.key) +
            '" data-dtype="datetime" value="' +
            escapeHtml(val) +
            '"' +
            (required ? " required" : "") +
            " />";
        } else if (f.type === "number") {
          html +=
            '<input type="number" class="form-control" data-field="' +
            escapeHtml(f.key) +
            '" value="' +
            escapeHtml(val) +
            '"' +
            (required ? " required" : "") +
            (f.min != null ? ' min="' + f.min + '"' : "") +
            " />";
        } else {
          html +=
            '<input type="' +
            (f.type === "arrayText" ? "text" : f.inputType || "text") +
            '" class="form-control" data-field="' +
            escapeHtml(f.key) +
            '"' +
            (f.type === "arrayText" ? ' data-dtype="arrayText"' : "") +
            ' value="' +
            escapeHtml(val) +
            '" placeholder="' +
            escapeHtml(f.placeholder || "") +
            '"' +
            (required ? " required" : "") +
            " />";
        }
        html += "</div>";
      });
      html += "</div>";
      return html;
    }

    function readFormValues(panel, fields) {
      const values = {};
      (fields || []).forEach(function (f) {
        if (!f || !f.key) return;
        const el = panel.querySelector('[data-field="' + f.key + '"]');
        if (!el) return;
        if (f.type === "checkbox") {
          values[f.key] = !!el.checked;
        } else if (f.type === "datetime" || el.getAttribute("data-dtype") === "datetime") {
          values[f.key] = datetimeLocalToIso(el.value);
        } else if (f.type === "number") {
          const n = el.value === "" ? null : Number(el.value);
          values[f.key] = n;
        } else if (f.type === "arrayText" || el.getAttribute("data-dtype") === "arrayText") {
          const raw = (el.value || "").trim();
          values[f.key] = raw
            ? raw.split(/[,，\s]+/).map(function (s) {
                return s.trim();
              }).filter(Boolean)
            : [];
        } else {
          values[f.key] = el.value == null ? "" : String(el.value).trim();
        }
      });
      return values;
    }

    function validateFormFields(fields, values) {
      for (let i = 0; i < (fields || []).length; i++) {
        const f = fields[i];
        if (!f || !f.required) continue;
        const v = values[f.key];
        if (f.type === "checkbox") continue;
        if (v == null || v === "" || (Array.isArray(v) && !v.length)) {
          return "请填写" + (f.label || f.key);
        }
      }
      return null;
    }

    function exportCsv(filename, headers, rows) {
      const escapeCell = function (c) {
        const s = c == null ? "" : String(c);
        if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const lines = [headers.map(escapeCell).join(",")];
      (rows || []).forEach(function (r) {
        lines.push(r.map(escapeCell).join(","));
      });
      const bom = "\uFEFF";
      const blob = new Blob([bom + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename || "export.csv";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 0);
    }

    /**
     * Generic list + filter + drawer CRUD page factory.
     * config: { title, storeKey, columns, filters, formFields, statusActions, levelColumn, allowCreate, idPrefix, extraRowActions, onBeforeSave }
     */
    function mountCrudPage(container, config) {
      if (!container || !config) return;
      const title = config.title || "";
      const storeKey = config.storeKey;
      const formFields = config.formFields || [];
      const filters = config.filters || [];
      const allowCreate = config.allowCreate !== false;
      const levelColumn = config.levelColumn !== false;
      const idPrefix = config.idPrefix || "rec";
      const statusActions = config.statusActions !== false;
      let filterState = {};
      filters.forEach(function (f) {
        filterState[f.key] = f.defaultValue != null ? f.defaultValue : "";
      });

      container.innerHTML =
        '<div class="page-title">' +
        escapeHtml(title) +
        "</div>" +
        '<div class="filter-card" data-role="filters"></div>' +
        '<div class="toolbar" data-role="toolbar"></div>' +
        '<div data-role="table"></div>' +
        '<div class="table-footer" data-role="footer"></div>';

      const filterEl = container.querySelector('[data-role="filters"]');
      const toolbarEl = container.querySelector('[data-role="toolbar"]');
      const tableEl = container.querySelector('[data-role="table"]');
      const footerEl = container.querySelector('[data-role="footer"]');

      function renderFilters() {
        let html = '<div class="filter-row">';
        filters.forEach(function (f) {
          html +=
            '<div class="filter-item"><label>' +
            escapeHtml(f.label || f.key) +
            "</label>";
          if (f.type === "select") {
            html +=
              '<select class="form-control" data-filter="' +
              escapeHtml(f.key) +
              '"><option value="">全部</option>';
            (f.options || []).forEach(function (opt) {
              const ov = typeof opt === "object" ? opt.value : opt;
              const ol = typeof opt === "object" ? opt.label : opt;
              html +=
                '<option value="' +
                escapeHtml(ov) +
                '"' +
                (String(filterState[f.key]) === String(ov) ? " selected" : "") +
                ">" +
                escapeHtml(ol) +
                "</option>";
            });
            html += "</select>";
          } else {
            html +=
              '<input type="text" class="form-control" data-filter="' +
              escapeHtml(f.key) +
              '" value="' +
              escapeHtml(filterState[f.key] || "") +
              '" placeholder="' +
              escapeHtml(f.placeholder || "请输入") +
              '" />';
          }
          html += "</div>";
        });
        html +=
          '<div class="filter-actions">' +
          '<button type="button" class="btn btn-primary" data-act="query">查询</button>' +
          '<button type="button" class="btn btn-default" data-act="reset">重置</button>' +
          "</div></div>";
        filterEl.innerHTML = html;
        filterEl.querySelector('[data-act="query"]').addEventListener("click", function () {
          filters.forEach(function (f) {
            const el = filterEl.querySelector('[data-filter="' + f.key + '"]');
            filterState[f.key] = el ? el.value : "";
          });
          refresh();
        });
        filterEl.querySelector('[data-act="reset"]').addEventListener("click", function () {
          filters.forEach(function (f) {
            filterState[f.key] = f.defaultValue != null ? f.defaultValue : "";
          });
          renderFilters();
          refresh();
        });
      }

      function renderToolbar() {
        if (allowCreate) {
          toolbarEl.innerHTML =
            '<button type="button" class="btn btn-success" data-act="create"><i class="ri-add-line"></i> 新增</button>';
          toolbarEl.querySelector('[data-act="create"]').addEventListener("click", function () {
            openRecordDrawer("create", null);
          });
        } else {
          toolbarEl.innerHTML = "";
        }
      }

      function applyFilters(list) {
        return list.filter(function (row) {
          for (let i = 0; i < filters.length; i++) {
            const f = filters[i];
            const q = filterState[f.key];
            if (q == null || q === "") continue;
            if (f.type === "select") {
              if (String(row[f.key] == null ? "" : row[f.key]) !== String(q)) return false;
            } else {
              const hay = String(row[f.key] == null ? "" : row[f.key]);
              if (hay.indexOf(q) < 0) return false;
            }
          }
          return true;
        });
      }

      function buildColumns() {
        const cols = (config.columns || []).slice();
        if (levelColumn) {
          const hasLevel = cols.some(function (c) {
            return c.key === "orgName" || c.key === "_level";
          });
          if (!hasLevel) {
            cols.push({
              title: "发布层级",
              key: "_level",
              width: "100px",
              render: function (row) {
                const lv = LEVEL_LABEL[row.orgLevel] || row.orgLevel || "";
                return escapeHtml((lv ? lv + " · " : "") + (row.orgName || "-"));
              },
            });
          }
        }
        return cols;
      }

      function openRecordDrawer(mode, record) {
        const isCreate = mode === "create";
        const isView = mode === "view";
        const bodyHtml = buildFormHtml(formFields, record || {}, mode);
        openDrawer({
          title: (isCreate ? "新增" : isView ? "查看" : "编辑") + " — " + title,
          mode: mode,
          bodyHtml: bodyHtml,
          onSubmit: function () {
            if (isView) return true;
            const panel = document.getElementById("sws-drawer");
            if (!panel) return false;
            const values = readFormValues(panel, formFields);
            const err = validateFormFields(formFields, values);
            if (err) {
              toast(err, "warning");
              return false;
            }
            const ctx = getSessionOrgContext();
            const now = nowISO();
            let saved;
            if (isCreate) {
              saved = Object.assign({}, values, {
                id: uid(idPrefix),
                orgId: ctx.orgId,
                orgLevel: ctx.orgLevel,
                orgName: ctx.orgName,
                status: values.status || "draft",
                createdAt: now,
                updatedAt: now,
                createdBy: ctx.userName,
              });
              if (saved.status === "published" && !saved.publishAt) saved.publishAt = now;
            } else {
              saved = Object.assign({}, record, values, { updatedAt: now });
              if (saved.status === "published" && !saved.publishAt) saved.publishAt = now;
            }
            if (typeof config.onBeforeSave === "function") {
              const r = config.onBeforeSave(saved, { mode: mode, record: record });
              if (r === false) return false;
              if (r && typeof r === "object") saved = r;
            }
            saveRecord(storeKey, saved);
            toast(isCreate ? "新增成功" : "保存成功", "success");
            refresh();
            return true;
          },
        });
      }

      function setStatus(row, nextStatus) {
        if (!canManage(row)) {
          toast("仅可操作本级数据", "warning");
          return;
        }
        const now = nowISO();
        const next = Object.assign({}, row, { status: nextStatus, updatedAt: now });
        if (nextStatus === "published") next.publishAt = now;
        saveRecord(storeKey, next);
        toast(nextStatus === "published" ? "已发布" : nextStatus === "offline" ? "已下架" : "状态已更新", "success");
        refresh();
      }

      function doDelete(row) {
        if (!canManage(row)) {
          toast("仅可删除本级数据", "warning");
          return;
        }
        confirmDialog({
          title: "确认删除",
          content: "删除后列表不再展示，是否继续？",
          onOk: function () {
            removeRecord(storeKey, row.id);
            toast("已删除", "success");
            refresh();
          },
        });
      }

      function defaultRowActions(row) {
        const acts = [
          {
            label: "查看",
            onClick: function () {
              openRecordDrawer("view", row);
            },
          },
        ];
        if (canManage(row)) {
          acts.push({
            label: "编辑",
            onClick: function () {
              openRecordDrawer("edit", row);
            },
          });
          if (statusActions) {
            if (row.status === "draft" || row.status === "offline") {
              acts.push({
                label: "发布",
                onClick: function () {
                  setStatus(row, "published");
                },
              });
            }
            if (row.status === "published") {
              acts.push({
                label: "下架",
                onClick: function () {
                  setStatus(row, "offline");
                },
              });
            }
          }
          acts.push({
            label: "删除",
            onClick: function () {
              doDelete(row);
            },
          });
        }
        if (typeof config.extraRowActions === "function") {
          const extra = config.extraRowActions(row) || [];
          extra.forEach(function (a) {
            if (a) acts.push(a);
          });
        }
        return acts;
      }

      function refresh() {
        const all = listForPc(storeKey);
        const rows = applyFilters(all);
        renderTable(tableEl, {
          columns: buildColumns(),
          rows: rows,
          rowActions: defaultRowActions,
        });
        footerEl.textContent = "共 " + rows.length + " 条";
      }

      renderFilters();
      renderToolbar();
      refresh();
      return { refresh: refresh };
    }

    function registerInfoDisclosurePages() {
      const statusFilter = {
        key: "status",
        label: "状态",
        type: "select",
        options: [

    const Pages = {};

    const DEFAULT_ROUTE = "notice-list";
    let _currentRouteId = null;

    function collectRouteIds(nodes, out) {
      out = out || [];
      (nodes || []).forEach(function (n) {
        if (n.routeId) out.push(n.routeId);
        if (n.children) collectRouteIds(n.children, out);
      });
      return out;
    }

    function findMenuPath(nodes, routeId, trail) {
      trail = trail || [];
      for (let i = 0; i < (nodes || []).length; i++) {
        const n = nodes[i];
        const next = trail.concat([n]);
        if (n.routeId === routeId) return next;
        if (n.children) {
          const found = findMenuPath(n.children, routeId, next);
          if (found) return found;
        }
      }
      return null;
    }

    function routeLabel(routeId) {
      const path = findMenuPath(PC_MENU, routeId);
      if (path && path.length) return path[path.length - 1].label || routeId;
      return routeId;
    }

    function getPcIdentityOptions() {
      const orgs = getAll(KEYS.orgs);
      const depts = getAll(KEYS.depts);
      const options = [];
      const levelOrder = { city: 0, district: 1, town: 2, village: 3 };
      const sorted = orgs.slice().sort(function (a, b) {
        const la = levelOrder[a.level] != null ? levelOrder[a.level] : 9;
        const lb = levelOrder[b.level] != null ? levelOrder[b.level] : 9;
        if (la !== lb) return la - lb;
        return String(a.name).localeCompare(String(b.name), "zh");
      });
      sorted.forEach(function (org) {
        if (org.level === "town") {
          depts
            .filter(function (d) {
              return d.orgId === org.id;
            })
            .forEach(function (d) {
              options.push({
                key: org.id + "|" + d.id,
                label: org.name + " · " + d.name,
                session: {
                  orgId: org.id,
                  userName: d.role === "center" ? "中心管理员" : d.name + "管理员",
                  role: d.role || "department",
                  deptId: d.id,
                },
              });
            });
        } else {
          let userName = "管理员";
          let role = "admin";
          if (org.level === "city") {
            userName = "市级管理员";
            role = "city";
          } else if (org.level === "district") {
            userName = "区管理员";
            role = "district";
          } else if (org.level === "village") {
            userName = "社区管理员";
            role = "village";
          }
          options.push({
            key: org.id,
            label: org.name,
            session: { orgId: org.id, userName: userName, role: role, deptId: null },
          });
        }
      });
      return options;
    }

    function sessionOptionKey(session) {
      if (!session) return "";
      if (session.deptId) return session.orgId + "|" + session.deptId;
      return session.orgId || "";
    }

    function navigate(routeId) {
      if (!routeId) routeId = DEFAULT_ROUTE;
      const known = collectRouteIds(PC_MENU);
      if (known.indexOf(routeId) < 0) routeId = DEFAULT_ROUTE;
      _currentRouteId = routeId;
      try {
        sessionStorage.setItem("sws_pc_route", routeId);
      } catch (e) { /* ignore */ }

      // expand ancestor groups for current route
      const path = findMenuPath(PC_MENU, routeId) || [];
      path.forEach(function (n) {
        if (n.id && n.children) _menuCollapsed[n.id] = false;
      });

      document.querySelectorAll(".pc-sidebar .menu-item[data-route]").forEach(function (el) {
        if (el.getAttribute("data-route") === routeId) el.classList.add("active");
        else el.classList.remove("active");
      });
      // re-render sidebar collapse state if shell already mounted
      const side = document.getElementById("pc-sidebar");
      if (side) renderSidebar(side);

      const mount = document.getElementById("pc-content");
      if (!mount) return;
      mount.innerHTML = "";
      const page = Pages[routeId];
      if (typeof page === "function") {
        page(mount);
      } else {
        mount.innerHTML =
          '<div class="page-title">' +
          escapeHtml(routeLabel(routeId)) +
          "</div>" +
          '<div class="page-card">页面开发中：' +
          escapeHtml(routeId) +
          "</div>";
      }
    }

    function renderSidebarMenuNodes(nodes, depth) {
      depth = depth || 0;
      let html = "";
      (nodes || []).forEach(function (node) {
        if (node.routeId) {
          html +=
            '<div class="menu-item depth-' +
            depth +
            '" data-route="' +
            escapeHtml(node.routeId) +
            '">' +
            (node.icon ? '<i class="' + escapeHtml(node.icon) + '"></i>' : "") +
            '<span>' +
            escapeHtml(node.label) +
            "</span></div>";
          return;
        }
        if (node.children) {
          const collapsed = !!_menuCollapsed[node.id];
          if (depth === 0) {
            html +=
              '<div class="menu-group' +
              (collapsed ? " collapsed" : "") +
              '" data-group="' +
              escapeHtml(node.id) +
              '">' +
              '<div class="menu-group-head" data-toggle-group="' +
              escapeHtml(node.id) +
              '">' +
              (node.icon ? '<i class="' + escapeHtml(node.icon) + '"></i>' : "") +
              "<span>" +
              escapeHtml(node.label) +
              '</span><i class="ri-arrow-down-s-line arrow"></i></div>' +
              '<div class="menu-group-body">' +
              renderSidebarMenuNodes(node.children, depth + 1) +
              "</div></div>";
          } else {
            html +=
              '<div class="menu-subgroup' +
              (collapsed ? " collapsed" : "") +
              '" data-group="' +
              escapeHtml(node.id) +
              '">' +
              '<div class="menu-subhead" data-toggle-group="' +
              escapeHtml(node.id) +
              '">' +
              (node.icon ? '<i class="' + escapeHtml(node.icon) + '"></i>' : "") +
              "<span>" +
              escapeHtml(node.label) +
              '</span><i class="ri-arrow-down-s-line arrow"></i></div>' +
              '<div class="menu-sub-body">' +
              renderSidebarMenuNodes(node.children, depth + 1) +
              "</div></div>";
          }
        }
      });
      return html;
    }

    function renderSidebar(container) {
      if (!container) return;
      container.innerHTML =
        '<div class="menu-group-title">社会工作服务</div>' + renderSidebarMenuNodes(PC_MENU, 0);

      // restore active
      if (_currentRouteId) {
        container.querySelectorAll(".menu-item[data-route]").forEach(function (el) {
          if (el.getAttribute("data-route") === _currentRouteId) el.classList.add("active");
        });
      }

      container.querySelectorAll("[data-toggle-group]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.stopPropagation();
          const gid = el.getAttribute("data-toggle-group");
          _menuCollapsed[gid] = !_menuCollapsed[gid];
          renderSidebar(container);
        });
      });
      container.querySelectorAll(".menu-item[data-route]").forEach(function (el) {
        el.addEventListener("click", function () {
          navigate(el.getAttribute("data-route"));
        });
      });
    }

    function renderShell() {
      ensureSeed(false);
      if (!getPcSession()) {
        setPcSession({
          orgId: "org_cx",
          userName: "中心管理员",
          role: "center",
          deptId: "dept_center",
        });
      }

      const identities = getPcIdentityOptions();
      const session = getPcSession() || {};
      let selKey = sessionOptionKey(session);
      const hasKey = identities.some(function (o) {
        return o.key === selKey;
      });
      if (!hasKey && identities.length) {
        selKey = identities[0].key;
        setPcSession(identities[0].session);
      }
      const liveSession = getPcSession() || session;

      let topHtml = "";

        topHtml +=
          '<div class="nav-item' +

          '" data-top="' +
          escapeHtml(m.id) +
          '">' +
          escapeHtml(m.label) +
          "</div>";
      });

      let orgOpts = "";
      identities.forEach(function (o) {
        orgOpts +=
          '<option value="' +
          escapeHtml(o.key) +
          '"' +
          (o.key === selKey ? " selected" : "") +
          ">" +
          escapeHtml(o.label) +
          "</option>";
      });

      const app = document.getElementById("app");
      app.innerHTML =
        '<header class="pc-header">' +
        '<div class="logo">金华市基层智治综合应用 -智治系统</div>' +
        topHtml +
        '<div class="header-right">' +
        '<i class="ri-notification-3-line" title="消息"></i>' +
        "<span id=\"pc-user-name\">" +
        escapeHtml(liveSession.userName || "XHD（测试账号）") +
        "</span>" +
        '<select class="form-control" id="pc-org-switcher" title="当前组织">' +
        orgOpts +
        "</select>" +
        "</div></header>" +
        '<div class="pc-body">' +
        '<aside class="pc-sidebar" id="pc-sidebar"></aside>' +
        '<main class="pc-main"><div id="pc-content"></div></main>' +
        "</div>";

      // top menus
      app.querySelectorAll(".nav-item[data-top]").forEach(function (el) {
        el.addEventListener("click", function () {
          const id = el.getAttribute("data-top");
          const item = TOP_MENUS.find(function (m) {
            return m.id === id;
          });
          if (!item || !item.enabled) {
            toast("本演示仅开放社会工作服务");
            return;
          }
          // already on sws
          el.classList.add("active");
        });
      });

      // org switcher
      const sel = document.getElementById("pc-org-switcher");
      if (sel) {
        sel.addEventListener("change", function () {
          const key = sel.value;
          const opt = identities.find(function (o) {
            return o.key === key;
          });
          if (!opt) return;
          setPcSession(opt.session);
          const nameEl = document.getElementById("pc-user-name");
          if (nameEl) nameEl.textContent = opt.session.userName || "";
          toast("已切换至 " + opt.label, "success");
          navigate(_currentRouteId || DEFAULT_ROUTE);
        });
      }

      // default collapse: expand all top groups initially
      PC_MENU.forEach(function (g) {
        if (g.id && _menuCollapsed[g.id] === undefined) _menuCollapsed[g.id] = false;
        (g.children || []).forEach(function (c) {
          if (c.id && c.children && _menuCollapsed[c.id] === undefined) {
            _menuCollapsed[c.id] = false;
          }
        });
      });

      renderSidebar(document.getElementById("pc-sidebar"));

      let route = DEFAULT_ROUTE;
      try {
        route = sessionStorage.getItem("sws_pc_route") || DEFAULT_ROUTE;
      } catch (e) { /* ignore */ }
      navigate(route);
    }

    ensureSeed(false);
    renderShell();
  </script>
</body>
</html>
