    function collectRouteIds(nodes, out) {
      out = out || [];
      (nodes || []).forEach(function (n) {
        if (n.routeId) out.push(n.routeId);
        if (n.children) collectRouteIds(n.children, out);
      });
      return out;
    }

    function findMenuPath(nodes, routeId, trail) {
      trail = trail || [];
      for (let i = 0; i < (nodes || []).length; i++) {
        const n = nodes[i];
        const next = trail.concat([n]);
        if (n.routeId === routeId) return next;
        if (n.children) {
          const found = findMenuPath(n.children, routeId, next);
          if (found) return found;
        }
      }
      return null;
    }

    function findMenuNodeById(nodes, id) {
      for (let i = 0; i < (nodes || []).length; i++) {
        const n = nodes[i];
        if (n.id === id) return n;
        if (n.children) {
          const found = findMenuNodeById(n.children, id);
          if (found) return found;
        }
      }
      return null;
    }

    /**
     * 菜单折叠默认：凝聚群众一级展开；新兴领域 / 基层治理一级收起；
     * 有子级的二级默认收起（避免三级一并铺开）
     * _menuCollapsed[id] === true 表示收起
     */
    function isMenuGroupCollapsed(node, depth) {
      if (!node || !node.id) return false;
      if (_menuCollapsed[node.id] !== undefined) return !!_menuCollapsed[node.id];
      if (node.id === "g-emerging" || node.id === "g-base") return true;
      // 服务资源 / 特定群体默认展开，便于找到类型管理所在列表
      if (node.id === "g-resource" || node.id === "g-assist") return false;
      return depth > 0;
    }

    /** 将某节点下所有「有子菜单的二级分组」设为收起 */
    function collapseSubmenuGroups(node) {
      if (!node || !node.children) return;
      node.children.forEach(function (c) {
        if (c.id && c.children && c.children.length) {
          _menuCollapsed[c.id] = true;
        }
      });
    }

    function routeLabel(routeId) {
      const path = findMenuPath(PC_MENU, routeId);
      if (path && path.length) return path[path.length - 1].label || routeId;
      return routeId;
    }

    /** 右上角仅保留有演示数据的组织，避免把区划树全铺进下拉 */
    var DEMO_PC_ORG_IDS = {
      org_city: 1,
      org_wc: 1,
      org_jd: 1,
      org_cx: 1,
      org_xf: 1,
      org_mf: 1,
      org_dx: 1,
      org_dx_sq: 1,
    };

    function getPcIdentityOptions() {
      const orgs = getAll(KEYS.orgs);
      const depts = getAll(KEYS.depts);
      const options = [];
      const levelOrder = { city: 0, district: 1, town: 2, village: 3 };
      const sorted = orgs.slice().sort(function (a, b) {
        const la = levelOrder[a.level] != null ? levelOrder[a.level] : 9;
        const lb = levelOrder[b.level] != null ? levelOrder[b.level] : 9;
        if (la !== lb) return la - lb;
        return String(a.name).localeCompare(String(b.name), "zh");
      });
      sorted.forEach(function (org) {
        if (!DEMO_PC_ORG_IDS[org.id]) return;
        if (org.level === "town") {
          const orgDepts = depts.filter(function (d) {
            return d.orgId === org.id;
          });
          if (orgDepts.length) {
            orgDepts.forEach(function (d) {
              options.push({
                key: org.id + "|" + d.id,
                label: org.name + " · " + d.name,
                session: {
                  orgId: org.id,
                  userName: d.role === "center" ? "中心管理员" : d.name + "管理员",
                  role: d.role || "department",
                  deptId: d.id,
                },
              });
            });
          } else {
            options.push({
              key: org.id,
              label: org.name,
              session: {
                orgId: org.id,
                userName: "街道管理员",
                role: "center",
                deptId: null,
              },
            });
          }
        } else {
          let userName = "管理员";
          let role = "admin";
          if (org.level === "city") {
            userName = "市级管理员";
            role = "city";
          } else if (org.level === "district") {
            userName = "区管理员";
            role = "district";
          } else if (org.level === "village") {
            userName = "社区管理员";
            role = "village";
          }
          options.push({
            key: org.id,
            label: org.name,
            session: { orgId: org.id, userName: userName, role: role, deptId: null },
          });
        }
      });
      return options;
    }

    function sessionOptionKey(session) {
      if (!session) return "";
      if (session.deptId) return session.orgId + "|" + session.deptId;
      return session.orgId || "";
    }

    function navigate(routeId, query) {
      if (!routeId) routeId = DEFAULT_ROUTE;
      // 旧表决结果/讨论协商管理已并入议题管理
      if (routeId === "topic-vote" || routeId === "topic-discuss") routeId = "topic-list";
      if (routeId === "suggestion-handle") routeId = "suggestion-inbox";
      const known = collectRouteIds(PC_MENU);
      if (known.indexOf(routeId) < 0) routeId = DEFAULT_ROUTE;
      _currentRouteId = routeId;
      _pendingPageFilters =
        query && typeof query === "object" ? query : null;
      try {
        sessionStorage.setItem("sws_pc_route", routeId);
      } catch (e) { /* ignore */ }

      // expand ancestor groups for current route
      const path = findMenuPath(PC_MENU, routeId) || [];
      path.forEach(function (n) {
        if (n.id && n.children) _menuCollapsed[n.id] = false;
      });

      document.querySelectorAll(".pc-sidebar .menu-item[data-route]").forEach(function (el) {
        if (el.getAttribute("data-route") === routeId) el.classList.add("active");
        else el.classList.remove("active");
      });
      // re-render sidebar collapse state if shell already mounted
      const side = document.getElementById("pc-sidebar");
      if (side) renderSidebar(side);

      const mount = document.getElementById("pc-content");
      if (!mount) return;
      mount.innerHTML = "";
      const page = Pages[routeId];
      if (typeof page === "function") {
        page(mount);
      } else {
        mount.innerHTML =
          '<div class="page-title">' +
          escapeHtml(routeLabel(routeId)) +
          "</div>" +
          '<div class="page-card">页面开发中：' +
          escapeHtml(routeId) +
          "</div>";
      }
    }

    function renderSidebarMenuNodes(nodes, depth) {
      depth = depth || 0;
      let html = "";
      (nodes || []).forEach(function (node) {
        // 仅一级菜单展示图标；二级及以下纯文字（折叠箭头除外）
        const showIcon = depth === 0 && node.icon;
        const iconHtml = showIcon ? '<i class="' + escapeHtml(node.icon) + '"></i>' : "";
        if (node.routeId) {
          html +=
            '<div class="menu-item depth-' +
            depth +
            '" data-route="' +
            escapeHtml(node.routeId) +
            '">' +
            iconHtml +
            '<span>' +
            escapeHtml(node.label) +
            "</span></div>";
          return;
        }
        if (node.children) {
          const collapsed = isMenuGroupCollapsed(node, depth);
          if (depth === 0) {
            html +=
              '<div class="menu-group' +
              (collapsed ? " collapsed" : "") +
              '" data-group="' +
              escapeHtml(node.id) +
              '" data-menu-depth="0">' +
              '<div class="menu-group-head" data-toggle-group="' +
              escapeHtml(node.id) +
              '" data-menu-depth="0">' +
              iconHtml +
              "<span>" +
              escapeHtml(node.label) +
              '</span><i class="ri-arrow-down-s-line arrow"></i></div>' +
              '<div class="menu-group-body">' +
              renderSidebarMenuNodes(node.children, depth + 1) +
              "</div></div>";
          } else {
            html +=
              '<div class="menu-subgroup' +
              (collapsed ? " collapsed" : "") +
              '" data-group="' +
              escapeHtml(node.id) +
              '" data-menu-depth="' +
              depth +
              '">' +
              '<div class="menu-subhead" data-toggle-group="' +
              escapeHtml(node.id) +
              '" data-menu-depth="' +
              depth +
              '">' +
              "<span>" +
              escapeHtml(node.label) +
              '</span><i class="ri-arrow-down-s-line arrow"></i></div>' +
              '<div class="menu-sub-body">' +
              renderSidebarMenuNodes(node.children, depth + 1) +
              "</div></div>";
          }
        }
      });
      return html;
    }

    function renderSidebar(container) {
      if (!container) return;
      container.innerHTML =
        '<div class="sidebar-menu">' +
        renderSidebarMenuNodes(PC_MENU, 0) +
        "</div>" +
        '<div class="sidebar-footer">' +
        '<button type="button" class="btn btn-primary btn-devguide" id="pc-dev-guide" title="查看开发说明">' +
        '<i class="ri-file-text-line"></i> 开发说明</button>' +
        '<button type="button" class="btn btn-default" id="pc-reset-demo" title="重置演示数据">' +
        '<i class="ri-refresh-line"></i> 重置演示数据</button></div>';

      // restore active：三级选中时，二级标题仅文字变蓝（无底色）
      if (_currentRouteId) {
        container.querySelectorAll(".menu-item[data-route]").forEach(function (el) {
          if (el.getAttribute("data-route") === _currentRouteId) el.classList.add("active");
        });
        const path = findMenuPath(PC_MENU, _currentRouteId) || [];
        // path 含 [一级, 二级(有子), 三级叶子…] 时，给二级 subhead 加高亮
        if (path.length >= 3) {
          path.forEach(function (n, idx) {
            if (idx === 0) return; // 跳过一级
            if (!n.id || !n.children || !n.children.length) return;
            const subhead = container.querySelector(
              '.menu-subhead[data-toggle-group="' + n.id + '"]'
            );
            if (subhead) subhead.classList.add("is-active-parent");
          });
        }
      }

      container.querySelectorAll("[data-toggle-group]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.stopPropagation();
          const gid = el.getAttribute("data-toggle-group");
          const depth = parseInt(el.getAttribute("data-menu-depth") || "0", 10) || 0;
          const wasCollapsed = isMenuGroupCollapsed(
            { id: gid },
            depth
          );
          // 展开一级：只露出二级标题，二级分组本身保持收起（不带出三级）
          if (wasCollapsed && depth === 0) {
            _menuCollapsed[gid] = false;
            const groupNode = findMenuNodeById(PC_MENU, gid);
            collapseSubmenuGroups(groupNode);
            ["g-resource", "g-assist"].forEach(function (keepId) {
              if (groupNode && (groupNode.id === keepId || (groupNode.children || []).some(function (c) { return c.id === keepId; }))) {
                _menuCollapsed[keepId] = false;
              }
            });
          } else {
            _menuCollapsed[gid] = !wasCollapsed;
          }
          renderSidebar(container);
        });
      });
      container.querySelectorAll(".menu-item[data-route]").forEach(function (el) {
        el.addEventListener("click", function () {
          navigate(el.getAttribute("data-route"));
        });
      });
      const guideBtn = container.querySelector("#pc-dev-guide");
      if (guideBtn) {
        guideBtn.addEventListener("click", function () {
          openDevGuideModal();
        });
      }
      const resetBtn = container.querySelector("#pc-reset-demo");
      if (resetBtn) {
        resetBtn.addEventListener("click", function () {
          confirmDialog({
            title: "重置演示数据",
            content: "将清空并重新写入全部种子数据，当前业务改动会丢失。是否继续？",
            onOk: function () {
              resetDemoData();
              toast("演示数据已重置", "success");
              navigate(_currentRouteId || DEFAULT_ROUTE);
            },
          });
        });
      }
    }

    function renderShell() {
      ensureSeed(false);
      startSchedulePublishTicker();
      if (!getPcSession()) {
        setPcSession({
          orgId: "org_city",
          userName: "市级管理员",
          role: "city",
          deptId: null,
        });
      }

      const identities = getPcIdentityOptions();
      const session = getPcSession() || {};
      let selKey = sessionOptionKey(session);
      const hasKey = identities.some(function (o) {
        return o.key === selKey;
      });
      if (!hasKey && identities.length) {
        selKey = identities[0].key;
        setPcSession(identities[0].session);
      }
      const liveSession = getPcSession() || session;

      let topHtml = "";
      TOP_MENUS.forEach(function (m) {
        topHtml +=
          '<div class="nav-item' +
          (m.id === "sws" ? " active" : "") +
          '" data-top="' +
          escapeHtml(m.id) +
          '">' +
          escapeHtml(m.label) +
          "</div>";
      });

      let orgOpts = "";
      identities.forEach(function (o) {
        orgOpts +=
          '<option value="' +
          escapeHtml(o.key) +
          '"' +
          (o.key === selKey ? " selected" : "") +
          ">" +
          escapeHtml(o.label) +
          "</option>";
      });

      const app = document.getElementById("app");
      app.innerHTML =
        '<header class="pc-header">' +
        '<div class="logo">基层智治 · 社会工作服务端 <span style="font-size:11px;font-weight:400;opacity:0.75;margin-left:6px">版本 ' +
        escapeHtml(DEMO_BUILD) +
        "</span></div>" +
        '<div class="nav-scroll">' +
        topHtml +
        "</div>" +
        '<div class="header-right">' +
        '<i class="ri-notification-3-line" title="消息"></i>' +
        "<span id=\"pc-user-name\">" +
        escapeHtml(liveSession.userName || "XHD（测试账号）") +
        "</span>" +
        '<div class="header-org-switch">' +
        '<label class="header-org-switch-label" for="pc-org-switcher">原型演示组织切换</label>' +
        '<select class="form-control" id="pc-org-switcher" title="原型演示组织切换">' +
        orgOpts +
        "</select></div>" +
        "</div></header>" +
        '<div class="pc-body">' +
        '<aside class="pc-sidebar" id="pc-sidebar"></aside>' +
        '<main class="pc-main"><div id="pc-content"></div></main>' +
        "</div>";

      // top menus
      app.querySelectorAll(".nav-item[data-top]").forEach(function (el) {
        el.addEventListener("click", function () {
          const id = el.getAttribute("data-top");
          const item = TOP_MENUS.find(function (m) {
            return m.id === id;
          });
          if (!item || !item.enabled) {
            toast("本演示仅开放社会工作服务");
            return;
          }
          // already on sws
          el.classList.add("active");
        });
      });

      // org switcher
      const sel = document.getElementById("pc-org-switcher");
      if (sel) {
        sel.addEventListener("change", function () {
          const key = sel.value;
          const opt = identities.find(function (o) {
            return o.key === key;
          });
          if (!opt) return;
          setPcSession(opt.session);
          const nameEl = document.getElementById("pc-user-name");
          if (nameEl) nameEl.textContent = opt.session.userName || "";
          toast("已切换至 " + opt.label, "success");
          navigate(_currentRouteId || DEFAULT_ROUTE);
        });
      }

      // 默认：凝聚群众展开；新兴领域 / 基层治理收起；有子项的二级收起
      // 服务资源 / 特定群体保持展开，便于进入带「类型管理」的列表
      PC_MENU.forEach(function (g) {
        if (g.id && _menuCollapsed[g.id] === undefined) {
          _menuCollapsed[g.id] = g.id === "g-emerging" || g.id === "g-base";
        }
        (g.children || []).forEach(function (c) {
          if (c.id && c.children && c.children.length && _menuCollapsed[c.id] === undefined) {
            _menuCollapsed[c.id] = c.id === "g-resource" || c.id === "g-assist" ? false : true;
          }
        });
      });

      renderSidebar(document.getElementById("pc-sidebar"));

      let route = DEFAULT_ROUTE;
      try {
        route = sessionStorage.getItem("sws_pc_route") || DEFAULT_ROUTE;
      } catch (e) { /* ignore */ }
      navigate(route);
    }

    ensureSeed(false);
    renderShell();
  </script>
</body>
</html>
