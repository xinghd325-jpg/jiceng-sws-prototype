              render: function (r) {
                return r.year != null ? String(r.year) : "-";
              },
            },
            statusCol,
          ],
          formFields: [
            { key: "title", label: "标题", full: true },
            { key: "year", label: "年份" },
            { key: "orgName", label: "所属组织" },
            { key: "source", label: "数据来源" },
            { key: "syncedAt", label: "同步时间" },
          ],
        });
      };

      Pages["base-lists"] = function (container) {
        mountReadOnlyPage(container, {
          title: "基层治理 · 清单管理",
          storeKey: KEYS.baseLists,
          filters: [
            { key: "title", label: "标题", placeholder: "清单标题" },
            { key: "listType", label: "类型", placeholder: "如重点关注" },
          ],
          columns: [
            { title: "标题", key: "title" },
            { title: "类型", key: "listType", width: "110px" },
            {
              title: "数量",
              key: "count",
              width: "80px",
              render: function (r) {
                return r.count != null ? String(r.count) : "-";
              },
            },
            statusCol,
          ],
          formFields: [
            { key: "title", label: "标题", full: true },
            { key: "listType", label: "类型" },
            { key: "count", label: "数量" },
            { key: "orgName", label: "所属组织" },
            { key: "source", label: "数据来源" },
            { key: "syncedAt", label: "同步时间" },
          ],
        });
      };

      Pages["base-teams"] = function (container) {
        mountReadOnlyPage(container, {
          title: "基层治理 · 队伍建设",
          storeKey: KEYS.baseTeams,
          filters: [
            { key: "name", label: "名称", placeholder: "队伍名称" },
            { key: "teamType", label: "类型", placeholder: "如网格力量" },
          ],
          columns: [
            { title: "名称", key: "name" },
            { title: "类型", key: "teamType", width: "110px" },
            {
              title: "人数",
              key: "memberCount",
              width: "80px",
              render: function (r) {
                return r.memberCount != null ? String(r.memberCount) : "-";
              },
            },
            statusCol,
          ],
          formFields: [
            { key: "name", label: "名称", full: true },
            { key: "teamType", label: "类型" },
            { key: "memberCount", label: "人数" },
            { key: "orgName", label: "所属组织" },
            { key: "source", label: "数据来源" },
            { key: "syncedAt", label: "同步时间" },
          ],
        });
      };
    }

    /* ========== PC Shell: top menu + sidebar routes ========== */
    const TOP_MENUS = [
      { id: "home", label: "首页", enabled: false },
      { id: "sws", label: "社会工作服务", enabled: true },
      { id: "emergency", label: "应急管理指挥", enabled: false },
      { id: "event", label: "事件管理", enabled: false },
      { id: "warning", label: "预警管理", enabled: false },
      { id: "task", label: "任务管理", enabled: false },
      { id: "dispute", label: "矛调调处", enabled: false },
      { id: "data", label: "数据管理", enabled: false },
      { id: "connect", label: "业务贯通", enabled: false },
      { id: "perf", label: "绩效考核", enabled: false },
      { id: "office", label: "办公管理", enabled: false },
    ];

    /** 侧栏树与 spec §4.2 一致；叶子含 routeId */
    const PC_MENU = [
      {
        id: "g-emerging",
        label: "新兴领域党的建设",
        icon: "ri-building-2-line",
        children: [
          { routeId: "emerging-objects", label: "对象管理", icon: "ri-user-search-line" },
          { routeId: "emerging-party", label: "党建工作", icon: "ri-flag-line" },
          { routeId: "emerging-governance", label: "服务治理", icon: "ri-government-line" },
        ],
      },
      {
        id: "g-base",
        label: "基层治理与基层政权建设",
        icon: "ri-community-line",
        children: [
          { routeId: "base-village", label: "村社建设", icon: "ri-home-gear-line" },
          { routeId: "base-consult", label: "协商议事", icon: "ri-chat-smile-2-line" },
          { routeId: "base-lists", label: "清单管理", icon: "ri-list-check-2" },
          { routeId: "base-teams", label: "队伍建设", icon: "ri-team-line" },
        ],
      },
      {
        id: "g-cohesion",
        label: "凝聚群众服务",
        icon: "ri-hearts-line",
        children: [
          {
            id: "g-info",
            label: "信息公开管理",
            icon: "ri-megaphone-line",
            children: [
              { routeId: "notice-list", label: "通知公告管理", icon: "ri-notification-3-line" },
              { routeId: "activity-list", label: "活动发布管理", icon: "ri-calendar-event-line" },
              { routeId: "affair-list", label: "三务公开管理", icon: "ri-file-list-3-line" },
              { routeId: "service-item-list", label: "服务项目管理", icon: "ri-service-line" },
            ],
          },
          {
            id: "g-suggest",
            label: "人民建议管理",
            icon: "ri-lightbulb-line",
            children: [
              { routeId: "suggestion-inbox", label: "建议线索归集", icon: "ri-inbox-line" },
              { routeId: "collect-campaign", label: "线索建议征集活动", icon: "ri-survey-line" },
              { routeId: "suggestion-handle", label: "线索建议受理", icon: "ri-todo-line" },
              { routeId: "survey-manage", label: "民主评议与满意度测评", icon: "ri-star-smile-line" },
            ],
          },
          {
            id: "g-topic",
            label: "议事协商管理",
            icon: "ri-discuss-line",
            children: [
              { routeId: "topic-list", label: "议题发布管理", icon: "ri-file-text-line" },
              { routeId: "topic-discuss", label: "讨论协商管理", icon: "ri-chat-3-line" },
              { routeId: "topic-vote", label: "表决结果管理", icon: "ri-checkbox-multiple-line" },
              { routeId: "resident-list", label: "村社居民人员管理", icon: "ri-group-line" },
            ],
          },
          {
            id: "g-resource",
            label: "服务资源管理",
            icon: "ri-map-pin-line",
            children: [
              { routeId: "facility-list", label: "设施资源管理", icon: "ri-building-line" },
              { routeId: "force-list", label: "力量资源管理", icon: "ri-user-star-line" },
            ],
          },
          {
            id: "g-assist",
            label: "特定群体服务（弱势群体帮扶）",
            icon: "ri-hand-heart-line",
            children: [
              { routeId: "vulnerable-warehouse", label: "弱势群体帮扶专题数据仓", icon: "ri-database-2-line" },
              { routeId: "aid-policy", label: "救助政策与社会救助资源", icon: "ri-article-line" },
              { routeId: "foundation", label: "基金会救助信息", icon: "ri-funds-line" },
              { routeId: "assist-record", label: "帮扶记录", icon: "ri-file-history-line" },
              { routeId: "assist-track", label: "帮扶申请全流程跟踪", icon: "ri-route-line" },
              { routeId: "assist-stats", label: "帮扶数据统计", icon: "ri-bar-chart-2-line" },
            ],
          },
        ],
      },
    ];

    const Pages = {};
    registerInfoDisclosurePages();
    registerSuggestDeliberationResourcePages();
    registerAssistProvincialPages();
    const DEFAULT_ROUTE = "notice-list";
    let _currentRouteId = null;
    const _menuCollapsed = {};

    function collectRouteIds(nodes, out) {
      out = out || [];
      (nodes || []).forEach(function (n) {
        if (n.routeId) out.push(n.routeId);
        if (n.children) collectRouteIds(n.children, out);
      });
      return out;
    }

    function findMenuPath(nodes, routeId, trail) {
      trail = trail || [];
      for (let i = 0; i < (nodes || []).length; i++) {
        const n = nodes[i];
        const next = trail.concat([n]);
        if (n.routeId === routeId) return next;
        if (n.children) {
          const found = findMenuPath(n.children, routeId, next);
          if (found) return found;
        }
      }
      return null;
    }

    function routeLabel(routeId) {
      const path = findMenuPath(PC_MENU, routeId);
      if (path && path.length) return path[path.length - 1].label || routeId;
      return routeId;
    }

    function getPcIdentityOptions() {
      const orgs = getAll(KEYS.orgs);
      const depts = getAll(KEYS.depts);
      const options = [];
      const levelOrder = { city: 0, district: 1, town: 2, village: 3 };
      const sorted = orgs.slice().sort(function (a, b) {
        const la = levelOrder[a.level] != null ? levelOrder[a.level] : 9;
        const lb = levelOrder[b.level] != null ? levelOrder[b.level] : 9;
        if (la !== lb) return la - lb;
        return String(a.name).localeCompare(String(b.name), "zh");
      });
      sorted.forEach(function (org) {
        if (org.level === "town") {
          depts
            .filter(function (d) {
              return d.orgId === org.id;
            })
            .forEach(function (d) {
              options.push({
                key: org.id + "|" + d.id,
                label: org.name + " · " + d.name,
                session: {
                  orgId: org.id,
                  userName: d.role === "center" ? "中心管理员" : d.name + "管理员",
                  role: d.role || "department",
                  deptId: d.id,
                },
              });
            });
        } else {
          let userName = "管理员";
          let role = "admin";
          if (org.level === "city") {
            userName = "市级管理员";
            role = "city";
          } else if (org.level === "district") {
            userName = "区管理员";
            role = "district";
          } else if (org.level === "village") {
            userName = "社区管理员";
            role = "village";
          }
          options.push({
            key: org.id,
            label: org.name,
            session: { orgId: org.id, userName: userName, role: role, deptId: null },
          });
        }
      });
      return options;
    }

    function sessionOptionKey(session) {
      if (!session) return "";
      if (session.deptId) return session.orgId + "|" + session.deptId;
      return session.orgId || "";
    }

    function navigate(routeId) {
      if (!routeId) routeId = DEFAULT_ROUTE;
      const known = collectRouteIds(PC_MENU);
      if (known.indexOf(routeId) < 0) routeId = DEFAULT_ROUTE;
      _currentRouteId = routeId;
      try {
        sessionStorage.setItem("sws_pc_route", routeId);
      } catch (e) { /* ignore */ }

      // expand ancestor groups for current route
      const path = findMenuPath(PC_MENU, routeId) || [];
      path.forEach(function (n) {
        if (n.id && n.children) _menuCollapsed[n.id] = false;
      });

      document.querySelectorAll(".pc-sidebar .menu-item[data-route]").forEach(function (el) {
        if (el.getAttribute("data-route") === routeId) el.classList.add("active");
        else el.classList.remove("active");
      });
      // re-render sidebar collapse state if shell already mounted
      const side = document.getElementById("pc-sidebar");
      if (side) renderSidebar(side);

      const mount = document.getElementById("pc-content");
      if (!mount) return;
      mount.innerHTML = "";
      const page = Pages[routeId];
      if (typeof page === "function") {
        page(mount);
      } else {
        mount.innerHTML =
          '<div class="page-title">' +
          escapeHtml(routeLabel(routeId)) +
          "</div>" +
          '<div class="page-card">页面开发中：' +
          escapeHtml(routeId) +
          "</div>";
      }
    }

    function renderSidebarMenuNodes(nodes, depth) {
      depth = depth || 0;
      let html = "";
      (nodes || []).forEach(function (node) {
        if (node.routeId) {
          html +=
            '<div class="menu-item depth-' +
            depth +
            '" data-route="' +
            escapeHtml(node.routeId) +
            '">' +
            (node.icon ? '<i class="' + escapeHtml(node.icon) + '"></i>' : "") +
            '<span>' +
            escapeHtml(node.label) +
            "</span></div>";
          return;
        }
        if (node.children) {
          const collapsed = !!_menuCollapsed[node.id];
          if (depth === 0) {
            html +=
              '<div class="menu-group' +
              (collapsed ? " collapsed" : "") +
              '" data-group="' +
              escapeHtml(node.id) +
              '">' +
              '<div class="menu-group-head" data-toggle-group="' +
              escapeHtml(node.id) +
              '">' +
              (node.icon ? '<i class="' + escapeHtml(node.icon) + '"></i>' : "") +
              "<span>" +
              escapeHtml(node.label) +
              '</span><i class="ri-arrow-down-s-line arrow"></i></div>' +
              '<div class="menu-group-body">' +
              renderSidebarMenuNodes(node.children, depth + 1) +
              "</div></div>";
          } else {
            html +=
              '<div class="menu-subgroup' +
              (collapsed ? " collapsed" : "") +
              '" data-group="' +
              escapeHtml(node.id) +
              '">' +
              '<div class="menu-subhead" data-toggle-group="' +
              escapeHtml(node.id) +
              '">' +
              (node.icon ? '<i class="' + escapeHtml(node.icon) + '"></i>' : "") +
              "<span>" +
              escapeHtml(node.label) +
              '</span><i class="ri-arrow-down-s-line arrow"></i></div>' +
              '<div class="menu-sub-body">' +
              renderSidebarMenuNodes(node.children, depth + 1) +
              "</div></div>";
          }
        }
      });
      return html;
    }

    function renderSidebar(container) {
      if (!container) return;
      container.innerHTML =
        '<div class="sidebar-menu">' +
        '<div class="menu-group-title">社会工作服务</div>' +
        renderSidebarMenuNodes(PC_MENU, 0) +
        "</div>" +
        '<div class="sidebar-footer">' +
        '<button type="button" class="btn btn-default" id="pc-reset-demo" title="重置演示数据">' +
        '<i class="ri-refresh-line"></i> 重置演示数据</button></div>';

      // restore active
      if (_currentRouteId) {
        container.querySelectorAll(".menu-item[data-route]").forEach(function (el) {
          if (el.getAttribute("data-route") === _currentRouteId) el.classList.add("active");
        });
      }

      container.querySelectorAll("[data-toggle-group]").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.stopPropagation();
          const gid = el.getAttribute("data-toggle-group");
          _menuCollapsed[gid] = !_menuCollapsed[gid];
          renderSidebar(container);
        });
      });
      container.querySelectorAll(".menu-item[data-route]").forEach(function (el) {
        el.addEventListener("click", function () {
          navigate(el.getAttribute("data-route"));
        });
      });
      const resetBtn = container.querySelector("#pc-reset-demo");
      if (resetBtn) {
        resetBtn.addEventListener("click", function () {
          confirmDialog({
            title: "重置演示数据",
            content: "将清空并重新写入全部种子数据，当前业务改动会丢失。是否继续？",
            onOk: function () {
              resetDemoData();
              toast("演示数据已重置", "success");
              navigate(_currentRouteId || DEFAULT_ROUTE);
            },
          });
        });
      }
    }

    function renderShell() {
      ensureSeed(false);
      if (!getPcSession()) {
        setPcSession({
          orgId: "org_cx",
          userName: "中心管理员",
          role: "center",
          deptId: "dept_center",
        });
      }

      const identities = getPcIdentityOptions();
      const session = getPcSession() || {};
      let selKey = sessionOptionKey(session);
      const hasKey = identities.some(function (o) {
        return o.key === selKey;
      });
      if (!hasKey && identities.length) {
        selKey = identities[0].key;
        setPcSession(identities[0].session);
      }
      const liveSession = getPcSession() || session;

      let topHtml = "";
      TOP_MENUS.forEach(function (m) {
        topHtml +=
          '<div class="nav-item' +
          (m.id === "sws" ? " active" : "") +
          '" data-top="' +
          escapeHtml(m.id) +
          '">' +
          escapeHtml(m.label) +
          "</div>";
      });

      let orgOpts = "";
      identities.forEach(function (o) {
        orgOpts +=
          '<option value="' +
          escapeHtml(o.key) +
          '"' +
          (o.key === selKey ? " selected" : "") +
          ">" +
          escapeHtml(o.label) +
          "</option>";
      });

      const app = document.getElementById("app");
      app.innerHTML =
        '<header class="pc-header">' +
        '<div class="logo">金华市基层智治综合应用 -智治系统</div>' +
        topHtml +
        '<div class="header-right">' +
        '<i class="ri-notification-3-line" title="消息"></i>' +
        "<span id=\"pc-user-name\">" +
        escapeHtml(liveSession.userName || "XHD（测试账号）") +
        "</span>" +
        '<select class="form-control" id="pc-org-switcher" title="当前组织">' +
        orgOpts +
        "</select>" +
        "</div></header>" +
        '<div class="pc-body">' +
        '<aside class="pc-sidebar" id="pc-sidebar"></aside>' +
        '<main class="pc-main"><div id="pc-content"></div></main>' +
        "</div>";

      // top menus
      app.querySelectorAll(".nav-item[data-top]").forEach(function (el) {
        el.addEventListener("click", function () {
          const id = el.getAttribute("data-top");
          const item = TOP_MENUS.find(function (m) {
            return m.id === id;
          });
          if (!item || !item.enabled) {
            toast("本演示仅开放社会工作服务");
            return;
          }
          // already on sws
          el.classList.add("active");
        });
      });

      // org switcher
      const sel = document.getElementById("pc-org-switcher");
      if (sel) {
        sel.addEventListener("change", function () {
          const key = sel.value;
          const opt = identities.find(function (o) {
            return o.key === key;
          });
          if (!opt) return;
          setPcSession(opt.session);
          const nameEl = document.getElementById("pc-user-name");
          if (nameEl) nameEl.textContent = opt.session.userName || "";
          toast("已切换至 " + opt.label, "success");
          navigate(_currentRouteId || DEFAULT_ROUTE);
        });
      }

      // default collapse: expand all top groups initially
      PC_MENU.forEach(function (g) {
        if (g.id && _menuCollapsed[g.id] === undefined) _menuCollapsed[g.id] = false;
        (g.children || []).forEach(function (c) {
          if (c.id && c.children && _menuCollapsed[c.id] === undefined) {
            _menuCollapsed[c.id] = false;
          }
        });
      });

      renderSidebar(document.getElementById("pc-sidebar"));

      let route = DEFAULT_ROUTE;
      try {
        route = sessionStorage.getItem("sws_pc_route") || DEFAULT_ROUTE;
      } catch (e) { /* ignore */ }
      navigate(route);
    }

    ensureSeed(false);
    renderShell();
  </script>
