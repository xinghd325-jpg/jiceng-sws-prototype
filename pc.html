<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>金华市基层智治综合应用 - 社会工作服务</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1677FF;
      --color-success: #52C41A;
      --color-danger: #FF4D4F;
      --color-warning: #FAAD14;
      --color-border: #D9D9D9;
      --color-bg: #F0F2F5;
      --color-bg-elevated: #FFFFFF;
      --color-text: rgba(0,0,0,0.88);
      --color-text-secondary: rgba(0,0,0,0.65);
      --radius: 2px;
      --control-height: 32px;
      --font-size: 14px;
      --header-height: 48px;
      --sidebar-width: 220px;
      --drawer-width: 640px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: var(--font-size);
      color: var(--color-text);
      background: var(--color-bg);
    }
    #app { min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--color-primary); text-decoration: none; }
    a:hover { color: #4096ff; }

    /* ---- Shell layout ---- */
    .pc-header {
      height: var(--header-height);
      background: #1677FF;
      color: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }
    .pc-header .logo {
      font-size: 15px;
      font-weight: 600;
      margin-right: 32px;
      white-space: nowrap;
    }
    .pc-header .nav-item {
      padding: 0 14px;
      height: var(--header-height);
      line-height: var(--header-height);
      color: rgba(255,255,255,0.85);
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
    }
    .pc-header .nav-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .pc-header .nav-item.active {
      color: #fff;
      font-weight: 600;
      border-bottom-color: #fff;
      background: rgba(0,0,0,0.08);
    }
    .pc-header .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
    }
    .pc-body { display: flex; flex: 1; min-height: 0; }
    .pc-sidebar {
      width: var(--sidebar-width);
      background: #fff;
      border-right: 1px solid var(--color-border);
      flex-shrink: 0;
      overflow: hidden;
      padding: 8px 0 0;
      display: flex;
      flex-direction: column;
    }
    .pc-sidebar .menu-group-title {
      padding: 10px 16px 6px;
      font-size: 12px;
      color: var(--color-text-secondary);
    }
    .pc-sidebar .menu-group {
      user-select: none;
    }
    .pc-sidebar .menu-group-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px 10px 16px;
      color: var(--color-text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .pc-sidebar .menu-group-head:hover { background: #f5f5f5; }
    .pc-sidebar .menu-group-head .arrow {
      margin-left: auto;
      font-size: 14px;
      color: var(--color-text-secondary);
      transition: transform 0.15s ease;
    }
    .pc-sidebar .menu-group.collapsed > .menu-group-body { display: none; }
    .pc-sidebar .menu-group.collapsed > .menu-group-head .arrow { transform: rotate(-90deg); }
    .pc-sidebar .menu-group-body { /* nested */ }
    .pc-sidebar .menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px 9px 20px;
      color: var(--color-text);
      cursor: pointer;
      font-size: 13px;
      border-right: 2px solid transparent;
    }
    .pc-sidebar .menu-item.depth-1 { padding-left: 28px; }
    .pc-sidebar .menu-item.depth-2 { padding-left: 40px; font-weight: 400; }
    .pc-sidebar .menu-item:hover { background: #f5f5f5; }
    .pc-sidebar .menu-item.active {
      color: var(--color-primary);
      background: #e6f4ff;
      border-right-color: var(--color-primary);
      font-weight: 500;
    }
    .pc-sidebar .menu-item i { font-size: 16px; flex-shrink: 0; }
    .pc-sidebar .menu-subhead {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px 8px 28px;
      color: var(--color-text-secondary);
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
    }
    .pc-sidebar .menu-subhead:hover { background: #f5f5f5; color: var(--color-text); }
    .pc-sidebar .menu-subhead .arrow {
      margin-left: auto;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    .pc-sidebar .menu-subgroup.collapsed > .menu-sub-body { display: none; }
    .pc-sidebar .menu-subgroup.collapsed > .menu-subhead .arrow { transform: rotate(-90deg); }
    .pc-header .header-right .form-control {
      height: 28px;
      min-width: 140px;
      max-width: 220px;
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.35);
      color: #fff;
      font-size: 12px;
    }
    .pc-header .header-right .form-control option { color: var(--color-text); background: #fff; }
    .pc-header .header-right i { font-size: 18px; cursor: default; opacity: 0.9; }
    .pc-main {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      overflow: auto;
    }
    #pc-content { min-height: 100%; }
    .page-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--color-text);
    }
    .page-card {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 24px 20px;
      color: var(--color-text-secondary);
      font-size: 14px;
      line-height: 1.6;
    }
    .page-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .page-title-row .page-title { margin-bottom: 0; }

    /* ---- Stats ---- */
    .stats-cards {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .stats-card {
      flex: 1;
      min-width: 140px;
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 14px 16px;
    }
    .stats-card .stats-num {
      font-size: 24px;
      font-weight: 600;
      color: var(--color-primary);
      line-height: 1.2;
    }
    .stats-card .stats-num.danger { color: var(--color-danger); }
    .stats-card .stats-num.success { color: var(--color-success); }
    .stats-card .stats-num.warning { color: var(--color-warning); }
    .stats-card .stats-label {
      margin-top: 6px;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .stats-panel {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
    }
    .stats-panel-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .bar-row:last-child { margin-bottom: 0; }
    .bar-label {
      width: 88px;
      flex-shrink: 0;
      font-size: 13px;
      color: var(--color-text-secondary);
      text-align: right;
    }
    .bar-track {
      flex: 1;
      height: 16px;
      background: #f0f0f0;
      border-radius: var(--radius);
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      background: var(--color-primary);
      border-radius: var(--radius);
      min-width: 0;
    }
    .bar-val {
      width: 48px;
      flex-shrink: 0;
      font-size: 12px;
      color: var(--color-text-secondary);
      text-align: right;
    }
    .pc-sidebar .sidebar-menu { flex: 1; overflow-y: auto; min-height: 0; }
    .pc-sidebar .sidebar-footer {
      flex-shrink: 0;
      border-top: 1px solid var(--color-border);
      padding: 12px 16px;
    }
    .pc-sidebar .sidebar-footer .btn {
      width: 100%;
    }

    /* ---- Filter card ---- */
    .filter-card {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 16px 16px 8px;
      margin-bottom: 12px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 16px;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .filter-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .filter-item label {
      font-size: 13px;
      color: var(--color-text-secondary);
      white-space: nowrap;
    }
    .filter-actions {
      display: flex;
      gap: 8px;
      margin-left: auto;
      align-items: center;
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    /* ---- Form controls ---- */
    .form-control {
      height: var(--control-height);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 4px 11px;
      font-size: 13px;
      color: var(--color-text);
      background: #fff;
      outline: none;
      min-width: 160px;
    }
    .form-control:focus { border-color: var(--color-primary); }
    .form-control:disabled,
    .form-control[readonly] {
      background: #f5f5f5;
      color: var(--color-text-secondary);
      cursor: not-allowed;
    }
    select.form-control { padding-right: 24px; }
    textarea.form-control {
      height: auto;
      min-height: 72px;
      padding: 8px 11px;
      resize: vertical;
      line-height: 1.5;
    }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: var(--control-height);
      padding: 0 15px;
      font-size: 13px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      background: #fff;
      color: var(--color-text);
      line-height: 1;
      transition: none;
    }
    .btn:hover { opacity: 0.92; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary {
      background: var(--color-primary);
      border-color: var(--color-primary);
      color: #fff;
    }
    .btn-primary:hover { background: #4096ff; border-color: #4096ff; opacity: 1; }
    .btn-success {
      background: var(--color-success);
      border-color: var(--color-success);
      color: #fff;
    }
    .btn-success:hover { background: #73d13d; border-color: #73d13d; opacity: 1; }
    .btn-default {
      background: #fff;
      border-color: var(--color-border);
      color: var(--color-text);
    }
    .btn-default:hover { color: var(--color-primary); border-color: var(--color-primary); opacity: 1; }
    .btn-danger-ghost {
      background: #fff;
      border-color: #ffccc7;
      color: var(--color-danger);
    }
    .btn-danger-ghost:hover { border-color: var(--color-danger); opacity: 1; }
    .btn-link {
      background: transparent;
      border: none;
      color: var(--color-primary);
      padding: 0 6px;
      height: auto;
      font-size: 13px;
    }
    .btn-link:hover { color: #4096ff; opacity: 1; }
    .btn-link.danger { color: var(--color-danger); }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }

    /* ---- Table ---- */
    .table-wrap {
      background: var(--color-bg-elevated);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: auto;
    }
    .table-wrap table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    .table-wrap th {
      background: #e6f4ff;
      color: var(--color-text);
      font-weight: 600;
      font-size: 13px;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--color-border);
      white-space: nowrap;
    }
    .table-wrap td {
      padding: 10px 12px;
      font-size: 13px;
      border-bottom: 1px solid #f0f0f0;
      color: var(--color-text);
      word-break: break-all;
      vertical-align: middle;
    }
    .table-wrap tr:last-child td { border-bottom: none; }
    .table-wrap tbody tr:hover { background: #fafafa; }
    .table-wrap .col-actions {
      white-space: nowrap;
      color: var(--color-primary);
    }
    .table-wrap .col-actions a,
    .table-wrap .col-actions .link-action {
      color: var(--color-primary);
      cursor: pointer;
      margin-right: 12px;
      font-size: 13px;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }
    .table-wrap .col-actions a:last-child,
    .table-wrap .col-actions .link-action:last-child { margin-right: 0; }
    .table-wrap .col-actions a:hover,
    .table-wrap .col-actions .link-action:hover { color: #4096ff; }
    .table-empty {
      text-align: center;
      color: var(--color-text-secondary);
      padding: 32px 12px !important;
    }
    .table-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      padding: 10px 0 0;
      font-size: 13px;
      color: var(--color-text-secondary);
    }
    .tag {
      display: inline-block;
      padding: 0 7px;
      height: 22px;
      line-height: 20px;
      font-size: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
      background: #fafafa;
      color: var(--color-text-secondary);
    }
    .tag-blue { color: var(--color-primary); background: #e6f4ff; border-color: #91caff; }
    .tag-green { color: var(--color-success); background: #f6ffed; border-color: #b7eb8f; }
    .tag-orange { color: #d48806; background: #fffbe6; border-color: #ffe58f; }
    .tag-red { color: var(--color-danger); background: #fff2f0; border-color: #ffccc7; }

    /* ---- Drawer ---- */
    .drawer-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1000;
    }
    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: var(--drawer-width);
      max-width: 100%;
      height: 100vh;
      background: #fff;
      z-index: 1001;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--color-border);
    }
    .drawer-header {
      display: flex;
      align-items: center;
      height: 48px;
      padding: 0 16px;
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .drawer-title {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drawer-header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: 12px;
    }
    .drawer-body {
      flex: 1;
      overflow: auto;
      padding: 16px 20px 24px;
    }
    .form-section-title {
      font-size: 14px;
      font-weight: 600;
      margin: 8px 0 16px;
      padding-left: 8px;
      border-left: 3px solid var(--color-primary);
      line-height: 1.2;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px 24px;
    }
    .form-grid .form-field.full { grid-column: 1 / -1; }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field > label {
      font-size: 13px;
      color: var(--color-text);
    }
    .form-field > label .req {
      color: var(--color-danger);
      margin-right: 2px;
    }
    .form-field .form-control { width: 100%; min-width: 0; }

    /* ---- Confirm dialog ---- */
    .confirm-mask {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 3000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .confirm-dialog {
      width: 400px;
      max-width: calc(100vw - 32px);
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--color-border);
    }
    .confirm-dialog .confirm-title {
      padding: 14px 16px 8px;
      font-size: 15px;
      font-weight: 600;
    }
    .confirm-dialog .confirm-content {
      padding: 8px 16px 20px;
      font-size: 13px;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }
    .confirm-dialog .confirm-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 16px 14px;
    }

    /* ---- Toast ---- */
    #sws-toast {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      padding: 8px 16px;
      border-radius: var(--radius);
      z-index: 4000;
      font-size: 13px;
      display: none;
      max-width: 80vw;
      text-align: center;
      pointer-events: none;
    }
    #sws-toast.toast-success { background: rgba(82, 196, 26, 0.92); }
    #sws-toast.toast-error { background: rgba(255, 77, 79, 0.92); }
    #sws-toast.toast-warning { background: rgba(250, 173, 20, 0.95); color: #fff; }
  </style>
</head>
<body>
  <div id="app">PC 骨架加载中</div>
  <script>
    /* ========== Seed + Storage ========== */
    const STORE_PREFIX = "sws_v1_";
    const KEYS = {
      meta: STORE_PREFIX + "meta",
      orgs: STORE_PREFIX + "orgs",
      depts: STORE_PREFIX + "depts",
      pcSession: STORE_PREFIX + "session_pc",
      h5Session: STORE_PREFIX + "session_h5",
      residents: STORE_PREFIX + "residents",
      notices: STORE_PREFIX + "notices",
      activities: STORE_PREFIX + "activities",
      activitySignups: STORE_PREFIX + "activity_signups",
      affairs: STORE_PREFIX + "affairs",
      serviceItems: STORE_PREFIX + "service_items",
      suggestionInbox: STORE_PREFIX + "suggestion_inbox",
      collectCampaigns: STORE_PREFIX + "collect_campaigns",
      suggestions: STORE_PREFIX + "suggestions",
      surveys: STORE_PREFIX + "surveys",
      surveyAnswers: STORE_PREFIX + "survey_answers",
      topics: STORE_PREFIX + "topics",
      topicComments: STORE_PREFIX + "topic_comments",
      topicVotes: STORE_PREFIX + "topic_votes",
      facilities: STORE_PREFIX + "facilities",
      forces: STORE_PREFIX + "forces",
      vulnerablePersons: STORE_PREFIX + "vulnerable_persons",
      aidPolicies: STORE_PREFIX + "aid_policies",
      foundations: STORE_PREFIX + "foundations",
      assistRecords: STORE_PREFIX + "assist_records",
      assistApplications: STORE_PREFIX + "assist_applications",
      emergingObjects: STORE_PREFIX + "emerging_objects",
      emergingParty: STORE_PREFIX + "emerging_party",
      emergingGovernance: STORE_PREFIX + "emerging_governance",
      baseVillage: STORE_PREFIX + "base_village",
      baseConsult: STORE_PREFIX + "base_consult",
      baseLists: STORE_PREFIX + "base_lists",
      baseTeams: STORE_PREFIX + "base_teams",
    };

    function storageGet(key) {
      const raw = localStorage.getItem(key);
      if (raw == null) return null;
      try { return JSON.parse(raw); } catch (e) { return null; }
    }
    function storageSet(key, value) {
      localStorage.setItem(key, JSON.stringify(value));
    }
    function uid(prefix) {
      return prefix + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 7);
    }
    function nowISO() {
      return new Date().toISOString();
    }

    function buildSeed() {
      const t = "2026-07-20T08:00:00.000Z";
      const t2 = "2026-07-21T09:30:00.000Z";
      const t3 = "2026-07-22T10:00:00.000Z";
      const t4 = "2026-07-23T14:00:00.000Z";
      const syncedAt = "2026-07-24T02:00:00.000Z";
      const PROV = "省级统建回流";

      const orgs = [
        { id: "org_city", name: "金华市", level: "city", parentId: null, path: ["org_city"] },
        { id: "org_wc", name: "婺城区", level: "district", parentId: "org_city", path: ["org_city", "org_wc"] },
        { id: "org_cx", name: "城西街道", level: "town", parentId: "org_wc", path: ["org_city", "org_wc", "org_cx"] },
        { id: "org_xf", name: "幸福社区", level: "village", parentId: "org_cx", path: ["org_city", "org_wc", "org_cx", "org_xf"] },
        { id: "org_mf", name: "民丰社区", level: "village", parentId: "org_cx", path: ["org_city", "org_wc", "org_cx", "org_mf"] },
        { id: "org_jd", name: "金东区", level: "district", parentId: "org_city", path: ["org_city", "org_jd"] },
      ];
      const depts = [
        { id: "dept_center", orgId: "org_cx", name: "综合信息指挥室", role: "center" },
        { id: "dept_mz", orgId: "org_cx", name: "民政办", role: "department" },
        { id: "dept_sh", orgId: "org_cx", name: "社会事务办", role: "department" },
      ];

    function listForPc(key) {
      const session = getPcSession();
      if (!session || !session.orgId) return [];
      const ids = new Set(getOrgDescendants(session.orgId));
      return getAll(key).filter((r) => ids.has(r.orgId) && !r.deleted);
    }
    function canManage(record) {
      const session = getPcSession();
      return !!(record && session && record.orgId === session.orgId);
    }

    function scopeMatchesUser(record, sessionOrgId, path) {
      const ids = record.scopeOrgIds;
      if (ids && ids.length) return ids.includes(sessionOrgId);
      if (record.scopeType === "org") return record.orgId === sessionOrgId;
      // all_children / default: 发布方为本级或上级
      return (path || []).includes(record.orgId);
    }

    function listForH5(moduleKey) {
      const session = getH5Session();
      if (!session) return [];
      const orgId = session.orgId;
      const userId = session.userId;
      const userOrg = getOrg(orgId);
      const path = userOrg ? (userOrg.path || []) : [];
      const all = getAll(moduleKey).filter((r) => !r.deleted);
      const rule = VISIBILITY[moduleKey];

      if (rule === "upward") {
        return all.filter((r) => r.status === "published" && path.includes(r.orgId));
      }
      if (rule === "village") {
        if (moduleKey === KEYS.topics) {
          return all.filter((r) => r.orgId === orgId && r.status !== "draft");
        }
        return all.filter((r) => r.orgId === orgId && r.status === "published");
      }
      if (rule === "scope") {
        const statusOk =
          moduleKey === KEYS.activities
            ? (s) => s === "published"
            : (s) => s === "open";
        return all.filter((r) => statusOk(r.status) && scopeMatchesUser(r, orgId, path));
      }
      if (rule === "self") {
        return all.filter((r) => r.userId === userId);
      }
      return all.filter((r) => r.status === "published");
    }

    function listVisible(key, opts) {
      opts = opts || {};
      if (opts.side === "h5" || opts.client === "h5") return listForH5(key);
      return listForPc(key);
    }

    function getById(key, id) {
      return getAll(key).find((x) => x.id === id) || null;
    }
    function saveRecord(key, record) {
      const list = getAll(key);
      const idx = list.findIndex((x) => x.id === record.id);
      if (idx >= 0) list[idx] = record;
      else list.unshift(record);
      storageSet(key, list);
      return record;
    }
    function removeRecord(key, id) {
      const list = getAll(key).map((x) => (x.id === id ? Object.assign({}, x, { deleted: true }) : x));
      storageSet(key, list);
    }

    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

    function toast(message, type) {
      let el = document.getElementById("sws-toast");
      if (!el) {
        el = document.createElement("div");
        el.id = "sws-toast";
        document.body.appendChild(el);
      }
      el.className = "";
      if (type === "success") el.classList.add("toast-success");
      else if (type === "error") el.classList.add("toast-error");
      else if (type === "warning") el.classList.add("toast-warning");
      el.textContent = message == null ? "" : String(message);
      el.style.display = "block";
      clearTimeout(el._t);
      el._t = setTimeout(function () {
        el.style.display = "none";
      }, 2000);

    function confirmDialog(opts) {
      opts = opts || {};
      const title = opts.title || "确认";
      const content = opts.content || "";
      const onOk = opts.onOk;
      const mask = document.createElement("div");
      mask.className = "confirm-mask";
      mask.innerHTML =
        '<div class="confirm-dialog" role="dialog">' +
        '<div class="confirm-title">' + escapeHtml(title) + "</div>" +

      function close() {
        if (mask.parentNode) mask.parentNode.removeChild(mask);
      }
      mask.addEventListener("click", function (e) {
        if (e.target === mask) close();

      mask.querySelector('[data-act="cancel"]').addEventListener("click", close);
      mask.querySelector('[data-act="ok"]').addEventListener("click", function () {
        let keep = false;

        if (!keep) close();

      opts = opts || {};

      const onSubmit = opts.onSubmit;
      closeDrawer();

      const panel = document.createElement("div");

            let shouldClose = true;

            } catch (err) {

              shouldClose = false;
            }
            if (shouldClose) closeDrawer();

      // view mode: disable form controls in body
      if (mode === "view") {
        const body = panel.querySelector(".drawer-body");
        body.querySelectorAll("input, select, textarea, button").forEach(function (ctrl) {
          if (ctrl.getAttribute("data-act")) return;
          if (ctrl.tagName === "BUTTON") {
            ctrl.disabled = true;
          } else {
            ctrl.disabled = true;
          }
        });

      document.body.appendChild(mask);
      document.body.appendChild(panel);
      _drawerState = { mode: mode, onSubmit: onSubmit };
      return { close: closeDrawer, panel: panel };

    function renderTable(container, options) {
      options = options || {};
      const columns = options.columns || [];
      const rows = options.rows || [];
      const rowActions = options.rowActions;
      if (!container) return;

      let html = '<div class="table-wrap"><table><thead><tr>';
      columns.forEach(function (col) {
        const w = col.width ? ' style="width:' + col.width + '"' : "";
        html += "<th" + w + ">" + escapeHtml(col.title || col.key || "") + "</th>";
      });
      if (rowActions) {
        html += '<th style="width:160px">操作</th>';
      }
      html += "</tr></thead><tbody>";

      if (!rows.length) {
        const colSpan = columns.length + (rowActions ? 1 : 0);
        html +=
          '<tr><td class="table-empty" colspan="' +
          colSpan +
          '">暂无数据</td></tr>';
      } else {
        rows.forEach(function (row, rowIndex) {
          html += '<tr data-row-index="' + rowIndex + '">';
          columns.forEach(function (col) {
            let cell;
            if (typeof col.render === "function") {
              cell = col.render(row, rowIndex);
              if (cell == null) cell = "";
            } else {
              cell = escapeHtml(row[col.key] == null ? "" : row[col.key]);
            }
            html += "<td>" + cell + "</td>";
          });
          if (rowActions) {
            html += '<td class="col-actions">';
            let actions = [];
            try {
              actions = rowActions(row, rowIndex) || [];
            } catch (err) {
              console.error(err);
            }
            actions.forEach(function (act, actIndex) {
              if (!act) return;
              if (act.show === false) return;
              html +=
                '<button type="button" class="link-action" data-row="' +
                rowIndex +
                '" data-act="' +
                actIndex +
                '">' +
                escapeHtml(act.label || "") +
                "</button>";
            });
            html += "</td>";
          }
          html += "</tr>";
        });
      }
      html += "</tbody></table></div>";
      container.innerHTML = html;

      if (rowActions && rows.length) {
        container.querySelectorAll(".link-action").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const ri = parseInt(btn.getAttribute("data-row"), 10);
            const ai = parseInt(btn.getAttribute("data-act"), 10);
            const row = rows[ri];
            const acts = rowActions(row, ri) || [];
            const act = acts[ai];
            if (act && typeof act.onClick === "function") act.onClick(row, ri);
          });
        });
      }
    }

    function formatDateTime(iso) {
      if (!iso) return "-";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return (
        d.getFullYear() +
        "-" +
        pad(d.getMonth() + 1) +
        "-" +
        pad(d.getDate()) +
        " " +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes())
      );
    }

    function isoToDatetimeLocal(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      const pad = function (n) {
        return n < 10 ? "0" + n : String(n);
      };
      return (
        d.getFullYear() +
        "-" +
        pad(d.getMonth() + 1) +
        "-" +
        pad(d.getDate()) +
        "T" +
        pad(d.getHours()) +
        ":" +
        pad(d.getMinutes())
      );
    }

    function datetimeLocalToIso(val) {
      if (!val) return null;
      const d = new Date(val);
      if (isNaN(d.getTime())) return null;
      return d.toISOString();
    }

    function buildFormHtml(fields, record, mode) {

        const required = !!f.required;
        let val = record[f.key];
        if (val == null) val = f.defaultValue != null ? f.defaultValue : "";
        if (f.type === "datetime") val = isoToDatetimeLocal(val);
        if (f.type === "checkbox") {
          /* handled below */
        } else if (f.type === "arrayText" && Array.isArray(val)) {
          val = val.join(",");
        } else if (
          (f.type === "textarea" || f.type === "json") &&
          val != null &&
          typeof val === "object"
        ) {
          try {

          } catch (e) {

          }

        html +=
          '<div class="form-field' +

            '<input type="checkbox" data-field="' +

            '"' +
            (required ? " required" : "") +

    function readFormValues(panel, fields) {
      const values = {};
      (fields || []).forEach(function (f) {
        if (!f || !f.key) return;
        const el = panel.querySelector('[data-field="' + f.key + '"]');
        if (!el) return;
        if (f.type === "checkbox") {
          values[f.key] = !!el.checked;
        } else if (f.type === "datetime" || el.getAttribute("data-dtype") === "datetime") {
          values[f.key] = datetimeLocalToIso(el.value);
        } else if (f.type === "number") {
          const n = el.value === "" ? null : Number(el.value);
          values[f.key] = n;
        } else if (f.type === "arrayText" || el.getAttribute("data-dtype") === "arrayText") {
          const raw = (el.value || "").trim();
          values[f.key] = raw
            ? raw.split(/[,，\s]+/).map(function (s) {
                return s.trim();
              }).filter(Boolean)
            : [];
        } else {
          values[f.key] = el.value == null ? "" : String(el.value).trim();
        }
      });
      return values;
    }

    function validateFormFields(fields, values) {
      for (let i = 0; i < (fields || []).length; i++) {
        const f = fields[i];
        if (!f || !f.required) continue;
        const v = values[f.key];
        if (f.type === "checkbox") continue;
        if (v == null || v === "" || (Array.isArray(v) && !v.length)) {
          return "请填写" + (f.label || f.key);
        }
      }
      return null;
    }

    function exportCsv(filename, headers, rows) {
      const escapeCell = function (c) {
        const s = c == null ? "" : String(c);
        if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const lines = [headers.map(escapeCell).join(",")];
      (rows || []).forEach(function (r) {
        lines.push(r.map(escapeCell).join(","));
      });
      const bom = "\uFEFF";
      const blob = new Blob([bom + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename || "export.csv";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 0);
    }

          });
          refresh();
        });
        filterEl.querySelector('[data-act="reset"]').addEventListener("click", function () {
          filters.forEach(function (f) {
            filterState[f.key] = f.defaultValue != null ? f.defaultValue : "";

            openRecordDrawer("create", null);
          });
        } else {
          toolbarEl.innerHTML = "";

      }

      function applyFilters(list) {
        return list.filter(function (row) {
          for (let i = 0; i < filters.length; i++) {
            const f = filters[i];
            const q = filterState[f.key];
            if (q == null || q === "") continue;
            if (f.type === "select") {
              if (String(row[f.key] == null ? "" : row[f.key]) !== String(q)) return false;
            } else {
              const hay = String(row[f.key] == null ? "" : row[f.key]);
              if (hay.indexOf(q) < 0) return false;
            }
          }
          return true;
        });
      }

      function buildColumns() {
        const cols = (config.columns || []).slice();
        if (levelColumn) {
          const hasLevel = cols.some(function (c) {

          if (!hasLevel) {
            cols.push({
              title: "发布层级",

      function openRecordDrawer(mode, record) {
        const isCreate = mode === "create";
        const isView = mode === "view";
        const bodyHtml = buildFormHtml(formFields, record || {}, mode);
        openDrawer({
          title: (isCreate ? "新增" : isView ? "查看" : "编辑") + " — " + title,
          mode: mode,
          bodyHtml: bodyHtml,
          onSubmit: function () {
            if (isView) return true;
            const panel = document.getElementById("sws-drawer");
            if (!panel) return false;
            const values = readFormValues(panel, formFields);
            const err = validateFormFields(formFields, values);
            if (err) {
              toast(err, "warning");
              return false;
            }
            const ctx = getSessionOrgContext();
            const now = nowISO();
            let saved;
            if (isCreate) {
              saved = Object.assign({}, values, {
                id: uid(idPrefix),
                orgId: ctx.orgId,
                orgLevel: ctx.orgLevel,
                orgName: ctx.orgName,
                status: values.status || "draft",
                createdAt: now,
                updatedAt: now,
                createdBy: ctx.userName,
              });
              if (saved.status === "published" && !saved.publishAt) saved.publishAt = now;
            } else {
              saved = Object.assign({}, record, values, { updatedAt: now });
              if (saved.status === "published" && !saved.publishAt) saved.publishAt = now;
            }
            if (typeof config.onBeforeSave === "function") {
              const r = config.onBeforeSave(saved, { mode: mode, record: record });
              if (r === false) return false;
              if (r && typeof r === "object") saved = r;
            }
            saveRecord(storeKey, saved);
            toast(isCreate ? "新增成功" : "保存成功", "success");
            refresh();
            return true;
          },
        });
      }

      function setStatus(row, nextStatus) {
        if (!canManage(row)) {
          toast("仅可操作本级数据", "warning");
          return;
        }
        const now = nowISO();
        const next = Object.assign({}, row, { status: nextStatus, updatedAt: now });
        if (nextStatus === "published") next.publishAt = now;
        saveRecord(storeKey, next);
        toast(nextStatus === "published" ? "已发布" : nextStatus === "offline" ? "已下架" : "状态已更新", "success");
        refresh();
      }

      function doDelete(row) {
        if (!canManage(row)) {
          toast("仅可删除本级数据", "warning");
          return;
        }
        confirmDialog({
          title: "确认删除",
          content: "删除后列表不再展示，是否继续？",
          onOk: function () {
            removeRecord(storeKey, row.id);
            toast("已删除", "success");
            refresh();
          },
        });
      }

      function defaultRowActions(row) {
        const acts = [
          {
            label: "查看",
            onClick: function () {
              openRecordDrawer("view", row);
            },
          },
        ];
        if (canManage(row)) {
          acts.push({
            label: "编辑",
            onClick: function () {
              openRecordDrawer("edit", row);
            },
          });
          if (statusActions) {
            if (row.status === "draft" || row.status === "offline") {
              acts.push({
                label: "发布",
                onClick: function () {
                  setStatus(row, "published");
                },
              });
            }
            if (row.status === "published") {
              acts.push({
                label: "下架",
                onClick: function () {
                  setStatus(row, "offline");
                },
              });
            }
          }
          acts.push({
            label: "删除",
            onClick: function () {
              doDelete(row);
            },
          });
        }
        if (typeof config.extraRowActions === "function") {
          const extra = config.extraRowActions(row) || [];
          extra.forEach(function (a) {
            if (a) acts.push(a);
          });
        }
        return acts;
      }

      function refresh() {
        const all = listForPc(storeKey);
        const rows = applyFilters(all);
        renderTable(tableEl, {
          columns: buildColumns(),
          rows: rows,
          rowActions: defaultRowActions,
        });
        footerEl.textContent = "共 " + rows.length + " 条";
      }

      renderFilters();
      renderToolbar();
      refresh();
      return { refresh: refresh };
    }

            const acts = [];
            function flow(nextStatus, title, needReason) {
              return {
                label: title,
                onClick: function () {
                  if (needReason) {
                    openReasonDrawer({
                      title: title,
                      label: "办理回复",
                      required: nextStatus === "rejected" || nextStatus === "done",
                      defaultValue: row.handleRemark || row.reply || "",
                      onOk: function (reason) {
                        setRowStatus(
                          KEYS.suggestions,
                          row,
                          nextStatus,
                          { handleRemark: reason, reply: reason },
                          "状态已更新"
                        );
                        api.refresh();
                      },
                    });
                  } else {
                    confirmDialog({
                      title: title,
                      content: "确认将状态变更为「" + title + "」？",
                      onOk: function () {
                        setRowStatus(KEYS.suggestions, row, nextStatus, {}, "状态已更新");
                        api.refresh();
                      },
                    });
                  }
                },
              };
            }
            if (row.status === "submitted") {
              acts.push(flow("accepted", "受理", false));
              acts.push(flow("rejected", "驳回", true));
            }
            if (row.status === "accepted") {
              acts.push(flow("processing", "开始办理", false));
              acts.push(flow("rejected", "驳回", true));
            }
            if (row.status === "processing") {
              acts.push(flow("done", "办结", true));
              acts.push(flow("rejected", "驳回", true));
            }
            if (row.status === "accepted" || row.status === "processing") {
              acts.push({
                label: "写回复",
                onClick: function () {
                  openReasonDrawer({
                    title: "办理回复",
                    label: "回复内容",
                    required: true,
                    defaultValue: row.handleRemark || row.reply || "",
                    onOk: function (reason) {
                      setRowStatus(
                        KEYS.suggestions,
                        row,
                        row.status,
                        { handleRemark: reason, reply: reason },
                        "回复已保存"
                      );
                      api.refresh();
                    },
                  });
                },
              });
            }
            return acts;
          },
        });
      };

        const all = getAll(KEYS.surveyAnswers).filter(function (a) {

        });
        const qLabels = {};
        (survey.questions || []).forEach(function (q) {
          if (q && q.id) qLabels[q.id] = q.label || q.id;
        });
        const body =
          '<div class="form-section-title">答卷明细（' +
          all.length +
          "）</div>" +
          '<div class="toolbar"><button type="button" class="btn btn-primary btn-sm" data-act="export-csv">导出 CSV</button></div>' +
          '<div data-role="ans-table"></div>';

          bodyHtml: body,

                  return (qLabels[k] || k) + ":" + ans[k];
                });
                const t = parts.join("；");
                return escapeHtml(t.length > 48 ? t.slice(0, 48) + "…" : t || "-");

            },
            {
              title: "提交时间",
              key: "createdAt",

          expBtn.addEventListener("click", function () {
            const qIds = (survey.questions || []).map(function (q) {
              return q.id;
            });
            const headers = ["姓名", "所属组织", "提交时间"].concat(
              qIds.map(function (id) {
                return qLabels[id] || id;

            exportCsv(
              "survey_answers_" + (survey.id || "") + ".csv",
              headers,
              all.map(function (r) {
                const ans = r.answers || {};
                return [r.userName || "", r.orgName || "", formatDateTime(r.createdAt)].concat(
                  qIds.map(function (id) {
                    return ans[id] != null ? ans[id] : "";

                );
              })
            );

          });
        }

      Pages["topic-discuss"] = function (container) {
        let filterTopicId = "";
        let filterKeyword = "";
        container.innerHTML =
          '<div class="page-title">讨论协商管理</div>' +
          '<div class="filter-card" data-role="filters"></div>' +
          '<div class="toolbar" data-role="toolbar"></div>' +
          '<div data-role="table"></div>' +
          '<div class="table-footer" data-role="footer"></div>';
        const filterEl = container.querySelector('[data-role="filters"]');
        const toolbarEl = container.querySelector('[data-role="toolbar"]');
        const tableEl = container.querySelector('[data-role="table"]');
        const footerEl = container.querySelector('[data-role="footer"]');

        function topicsOpts() {
          return listForPc(KEYS.topics)
            .filter(function (t) {
              return t.status !== "draft";
            })
            .map(function (t) {
              return { value: t.id, label: t.title };
            });
        }

        function renderFilters() {
          const opts = topicsOpts();
          let html =
            '<div class="filter-row">' +
            '<div class="filter-item"><label>议题</label><select class="form-control" data-filter="topicId"><option value="">全部议题</option>';
          opts.forEach(function (o) {
            html +=
              '<option value="' +
              escapeHtml(o.value) +
              '"' +
              (filterTopicId === o.value ? " selected" : "") +
              ">" +
              escapeHtml(o.label) +
              "</option>";
          });
          html +=
            "</select></div>" +
            '<div class="filter-item"><label>内容</label><input type="text" class="form-control" data-filter="kw" value="' +
            escapeHtml(filterKeyword) +
            '" placeholder="评论关键词" /></div>' +
            '<div class="filter-actions">' +
            '<button type="button" class="btn btn-primary" data-act="query">查询</button>' +
            '<button type="button" class="btn btn-default" data-act="reset">重置</button>' +
            "</div></div>";
          filterEl.innerHTML = html;
          filterEl.querySelector('[data-act="query"]').addEventListener("click", function () {
            filterTopicId = filterEl.querySelector('[data-filter="topicId"]').value;
            filterKeyword = filterEl.querySelector('[data-filter="kw"]').value || "";
            refresh();
          });
          filterEl.querySelector('[data-act="reset"]').addEventListener("click", function () {
            filterTopicId = "";
            filterKeyword = "";
            renderFilters();
            refresh();
          });
        }

        toolbarEl.innerHTML =
          '<button type="button" class="btn btn-success" data-act="admin-reply"><i class="ri-reply-line"></i> 管理员发言</button>';
        toolbarEl.querySelector('[data-act="admin-reply"]').addEventListener("click", function () {
          const topics = listForPc(KEYS.topics).filter(function (t) {
            return t.status === "discussing" || t.status === "voting";
          });
          if (!topics.length) {
            toast("暂无可讨论议题", "warning");
            return;
          }
          const fields = [
            {
              key: "topicId",
              label: "议题",
              type: "select",
              required: true,
              options: topics.map(function (t) {
                return { value: t.id, label: t.title };
              }),
              defaultValue: filterTopicId || topics[0].id,
            },
            {
              key: "content",
              label: "回复内容",
              type: "textarea",
              required: true,
              full: true,
              rows: 4,
            },
          ];
          openDrawer({
            title: "管理员回复",
            mode: "create",
            bodyHtml: buildFormHtml(fields, {}, "create"),
            onSubmit: function () {
              const panel = document.getElementById("sws-drawer");
              const values = readFormValues(panel, fields);
              const err = validateFormFields(fields, values);
              if (err) {
                toast(err, "warning");
                return false;
              }
              const topic = getById(KEYS.topics, values.topicId);
              if (!topic) {
                toast("议题不存在", "error");
                return false;
              }
              if (!canManage(topic)) {
                toast("仅可对本级议题回复", "warning");
                return false;
              }
              const ctx = getSessionOrgContext();
              const now = nowISO();
              saveRecord(KEYS.topicComments, {
                id: uid("tcm"),
                topicId: values.topicId,
                userId: "admin",
                userName: ctx.userName || "管理员",
                content: values.content,
                orgId: topic.orgId,
                orgLevel: topic.orgLevel,
                orgName: topic.orgName,
                status: "active",
                isAdmin: true,
                createdAt: now,
                updatedAt: now,
              });
              toast("回复已发布", "success");
              refresh();
              return true;
            },
          });
        });

        function refresh() {
          const topicIds = new Set(
            listForPc(KEYS.topics).map(function (t) {
              return t.id;
            })
          );
          let rows = getAll(KEYS.topicComments).filter(function (c) {
            return !c.deleted && topicIds.has(c.topicId);
          });
          if (filterTopicId) {
            rows = rows.filter(function (c) {
              return c.topicId === filterTopicId;
            });
          }
          if (filterKeyword) {
            rows = rows.filter(function (c) {
              return String(c.content || "").indexOf(filterKeyword) >= 0;
            });
          }
          rows = rows.slice().sort(function (a, b) {
            return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
          });
          renderTable(tableEl, {
            columns: [
              {
                title: "议题",
                key: "topicId",
                width: "160px",
                render: function (r) {
                  const t = getById(KEYS.topics, r.topicId);
                  return escapeHtml((t && t.title) || r.topicId);
                },
              },
              { title: "发言人", key: "userName", width: "90px" },
              {
                title: "内容",
                key: "content",
                render: function (r) {
                  const prefix = r.isAdmin ? "[管理员] " : "";
                  return escapeHtml(prefix + (r.content || ""));
                },
              },
              {
                title: "时间",
                key: "createdAt",
                width: "140px",
                render: function (r) {
                  return escapeHtml(formatDateTime(r.createdAt));
                },
              },
            ],
            rows: rows,
            rowActions: function (row) {
              const topic = getById(KEYS.topics, row.topicId);
              if (!topic || !canManage(topic)) return [];
              return [
                {
                  label: "回复",
                  onClick: function () {
                    openReasonDrawer({
                      title: "回复评论",
                      label: "回复内容",
                      required: true,
                      placeholder: "回复 @" + (row.userName || ""),
                      onOk: function (reason) {
                        const ctx = getSessionOrgContext();
                        const now = nowISO();

        container.innerHTML =

          '<div class="filter-card" data-role="filters"></div>' +
          '<div data-role="table"></div>' +
          '<div class="table-footer" data-role="footer"></div>';
        const filterEl = container.querySelector('[data-role="filters"]');
        const tableEl = container.querySelector('[data-role="table"]');
        const footerEl = container.querySelector('[data-role="footer"]');
        let statusFilter = "";

        filterEl.innerHTML =
          '<div class="filter-row">' +
          '<div class="filter-item"><label>状态</label><select class="form-control" data-filter="status">' +
          '<option value="">全部</option>' +
          '<option value="voting">表决中</option>' +
          '<option value="closed">已关闭</option>' +
          '<option value="discussing">讨论中</option>' +
          "</select></div>" +
          '<div class="filter-actions">' +
          '<button type="button" class="btn btn-primary" data-act="query">查询</button>' +
          '<button type="button" class="btn btn-default" data-act="reset">重置</button>' +
          "</div></div>";
        filterEl.querySelector('[data-act="query"]').addEventListener("click", function () {
          statusFilter = filterEl.querySelector('[data-filter="status"]').value;
          refresh();
        });
        filterEl.querySelector('[data-act="reset"]').addEventListener("click", function () {
          statusFilter = "";
          filterEl.querySelector('[data-filter="status"]').value = "";
          refresh();
        });

        function aggregateVotes(topic) {
          const votes = getAll(KEYS.topicVotes).filter(function (v) {
            return v.topicId === topic.id && !v.deleted;
          });
          const options = topic.options || [];
          const counts = {};
          options.forEach(function (o) {
            counts[o.id] = 0;
          });
          votes.forEach(function (v) {
            if (counts[v.optionId] == null) counts[v.optionId] = 0;
            counts[v.optionId]++;
          });
          let agree = 0;
          let oppose = 0;
          let abstain = 0;
          options.forEach(function (o) {
            const n = counts[o.id] || 0;
            const lb = o.label || o.id;
            if (/弃权/.test(lb)) abstain += n;
            else if (/反对|不同意|不设置|暂不|延期/.test(lb)) oppose += n;
            else if (/同意|赞成|支持|设置|按期|改建/.test(lb) && !/不/.test(lb.replace(/不同意|不设置/g, ""))) {
              // 正向选项（含「同意改建」等）；排除纯否定词已在上一分支
              if (/不[同设]|反对/.test(lb)) oppose += n;
              else agree += n;
            } else if (o.id === "opt_a") agree += n;
            else if (o.id === "opt_b") oppose += n;
            else if (o.id === "opt_c") abstain += n;
          });
          return {
            total: votes.length,
            agree: agree,
            oppose: oppose,
            abstain: abstain,
            counts: counts,
            options: options,
          };
        }

        if (!isAssistCenter(session) || !row) return false;

      Pages["assist-stats"] = function (container) {
        const rows = listForPc(KEYS.assistApplications);
        const total = rows.length;
        const pending = rows.filter(function (r) {
          return r.status === "submitted" || r.status === "returned";
        }).length;
        const processing = rows.filter(function (r) {
          return r.status === "assigned";
        }).length;
        const done = rows.filter(function (r) {
          return r.status === "completed";
        }).length;
        const rejected = rows.filter(function (r) {
          return r.status === "rejected";
        }).length;
        const rejectRate = total ? Math.round((rejected / total) * 1000) / 10 : 0;

        function countBy(keyFn) {
          const map = {};
          rows.forEach(function (r) {
            const k = keyFn(r) || "未分类";
            map[k] = (map[k] || 0) + 1;
          });
          return map;
        }
        function barsHtml(map) {
          const max = Math.max.apply(
            null,
            Object.keys(map)
              .map(function (k) {
                return map[k];
              })
              .concat([1])
          );
          return Object.keys(map)
            .map(function (k) {
              const n = map[k];
              const pct = Math.round((n / max) * 100);
              return (
                '<div class="bar-row"><div class="bar-label">' +
                escapeHtml(k) +
                '</div><div class="bar-track"><div class="bar-fill" style="width:' +
                pct +
                '%"></div></div><div class="bar-val">' +
                n +
                "</div></div>"
              );
            })
            .join("");
        }
        const byStatus = countBy(function (r) {
          return ASSIST_STATUS_LABEL[r.status] || r.status || "未知";
        });
        const byType = countBy(function (r) {
          return r.type || "未分类";
        });

        container.innerHTML =
          '<div class="page-title">帮扶数据统计</div>' +
          '<div class="stats-cards">' +
          '<div class="stats-card"><div class="stats-num">' +
          total +
          '</div><div class="stats-label">申请总量</div></div>' +
          '<div class="stats-card"><div class="stats-num warning">' +
          pending +
          '</div><div class="stats-label">待受理</div></div>' +
          '<div class="stats-card"><div class="stats-num">' +
          processing +
          '</div><div class="stats-label">办理中</div></div>' +
          '<div class="stats-card"><div class="stats-num success">' +
          done +
          '</div><div class="stats-label">已办结</div></div>' +
          '<div class="stats-card"><div class="stats-num danger">' +
          rejectRate +
          '%</div><div class="stats-label">驳回率</div></div>' +
          "</div>" +
          '<div class="stats-panel"><div class="stats-panel-title">按状态分布</div>' +
          (total ? barsHtml(byStatus) : '<div style="color:rgba(0,0,0,0.45)">暂无数据</div>') +
          "</div>" +
          '<div class="stats-panel"><div class="stats-panel-title">按类型分布</div>' +
          (total ? barsHtml(byType) : '<div style="color:rgba(0,0,0,0.45)">暂无数据</div>') +
          "</div>";
      };

      /* ---- Step4 省级只读 7 页 ---- */
      function mountReadOnlyPage(container, config) {
        config = config || {};
        const title = config.title || "";
        const storeKey = config.storeKey;
        const filters = config.filters || [];
        const columns = config.columns || [];
        const formFields = config.formFields || [];
        let filterState = {};
        filters.forEach(function (f) {
          filterState[f.key] = "";
        });

        container.innerHTML =
          '<div class="page-title-row"><div class="page-title">' +
          escapeHtml(title) +
          '</div><button type="button" class="btn btn-primary" data-act="sync"><i class="ri-refresh-line"></i> 同步刷新</button></div>' +
          '<div class="filter-card" data-role="filters"></div>' +
          '<div data-role="table"></div>' +
          '<div class="table-footer" data-role="footer"></div>';

        const filterEl = container.querySelector('[data-role="filters"]');
        const tableEl = container.querySelector('[data-role="table"]');
        const footerEl = container.querySelector('[data-role="footer"]');

        function renderFilters() {
          let html = '<div class="filter-row">';
          filters.forEach(function (f) {
            html +=
              '<div class="filter-item"><label>' +
              escapeHtml(f.label || f.key) +
              "</label>";
            if (f.type === "select") {
              html +=
                '<select class="form-control" data-filter="' +
                escapeHtml(f.key) +
                '"><option value="">全部</option>';
              (f.options || []).forEach(function (opt) {
                const ov = typeof opt === "object" ? opt.value : opt;
                const ol = typeof opt === "object" ? opt.label : opt;
                html +=
                  '<option value="' +
                  escapeHtml(ov) +
                  '"' +
                  (String(filterState[f.key]) === String(ov) ? " selected" : "") +
                  ">" +
                  escapeHtml(ol) +
                  "</option>";
              });
              html += "</select>";
            } else {
              html +=
                '<input type="text" class="form-control" data-filter="' +
                escapeHtml(f.key) +
                '" value="' +
                escapeHtml(filterState[f.key] || "") +
                '" placeholder="' +
                escapeHtml(f.placeholder || "请输入") +
                '" />';
            }
            html += "</div>";
          });
          html +=
            '<div class="filter-actions">' +
            '<button type="button" class="btn btn-primary" data-act="query">查询</button>' +
            '<button type="button" class="btn btn-default" data-act="reset">重置</button>' +
            "</div></div>";
          filterEl.innerHTML = html;
          filterEl.querySelector('[data-act="query"]').addEventListener("click", function () {
            filters.forEach(function (f) {
              const el = filterEl.querySelector('[data-filter="' + f.key + '"]');
              filterState[f.key] = el ? el.value : "";
            });
            refresh();
          });
          filterEl.querySelector('[data-act="reset"]').addEventListener("click", function () {
            filters.forEach(function (f) {
              filterState[f.key] = "";
            });
            renderFilters();
            refresh();
          });
        }

        function doSync() {
          const now = nowISO();
          const list = getAll(storeKey).map(function (r) {
            return Object.assign({}, r, { syncedAt: now, updatedAt: now });
          });
          storageSet(storeKey, list);
          toast("已同步刷新省级回流数据", "success");
          refresh();
        }

        container.querySelector('[data-act="sync"]').addEventListener("click", doSync);

        function openView(row) {
          openDrawer({
            title: "查看 — " + (row.name || row.title || title),
            mode: "view",
            bodyHtml: buildFormHtml(formFields, row, "view"),
          });
        }

        function refresh() {
          let rows = listForPc(storeKey);
          rows = rows.filter(function (row) {
            for (let i = 0; i < filters.length; i++) {
              const f = filters[i];
              const q = filterState[f.key];
              if (q == null || q === "") continue;
              if (f.type === "select") {
                if (String(row[f.key] == null ? "" : row[f.key]) !== String(q)) return false;
              } else {
                const hay = String(row[f.key] == null ? "" : row[f.key]);
                if (hay.indexOf(q) < 0) return false;
              }
            }
            return true;
          });
          const cols = columns.slice();
          cols.push({
            title: "数据来源",
            key: "source",
            width: "120px",
            render: function (r) {
              return escapeHtml(r.source || "省级统建回流");
            },
          });
          cols.push({
            title: "同步时间",
            key: "syncedAt",
            width: "140px",
            render: function (r) {
              return escapeHtml(formatDateTime(r.syncedAt));
            },
          });
          renderTable(tableEl, {
            columns: cols,
            rows: rows,
            rowActions: function (row) {
              return [
                {
                  label: "查看",
                  onClick: function () {
                    openView(row);
                  },
                },
              ];
            },
          });
          footerEl.textContent = "共 " + rows.length + " 条（省级回流只读）";
        }

        renderFilters();
        refresh();
      }
