      }
      html +=
        '<div class="rte-body" data-rte-field="' +
        escapeHtml(key) +
        '"' +
        (required ? ' data-required="1"' : "") +
        (placeholder ? ' data-placeholder="' + escapeHtml(placeholder) + '"' : "") +
        ' contenteditable="' +
        (readonly ? "false" : "true") +
        '">' +
        htmlVal +
        "</div></div>";
      return html;
    }

    function bindRichTextEditors(panel) {
      if (!panel) return;
      panel.querySelectorAll("[data-rte]").forEach(function (rte) {
        const body = rte.querySelector(".rte-body");
        if (!body) return;
        rte.querySelectorAll("[data-rte-cmd]").forEach(function (btn) {
          btn.addEventListener("mousedown", function (e) {
            e.preventDefault();
          });
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            const cmd = btn.getAttribute("data-rte-cmd");
            body.focus();
            if (cmd === "bold" || cmd === "italic" || cmd === "underline" || cmd === "undo") {
              document.execCommand(cmd, false, null);
            } else if (cmd === "h2") {
              document.execCommand("formatBlock", false, "h2");
            } else if (cmd === "p") {
              document.execCommand("formatBlock", false, "p");
            } else if (cmd === "ul") {
              document.execCommand("insertUnorderedList", false, null);
            } else if (cmd === "ol") {
              document.execCommand("insertOrderedList", false, null);
            } else if (cmd === "link") {
              const url = window.prompt("请输入链接地址", "https://");
              if (url) document.execCommand("createLink", false, url);
            } else if (cmd === "image") {
              const fileInput = rte.querySelector("[data-rte-file]");
              if (fileInput) fileInput.click();
            }
          });
        });
        const fileInput = rte.querySelector("[data-rte-file]");
        if (fileInput) {
          fileInput.addEventListener("change", function () {
            const file = fileInput.files && fileInput.files[0];
            fileInput.value = "";
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function () {
              body.focus();
              document.execCommand("insertImage", false, reader.result);
            };
            reader.readAsDataURL(file);
          });
        }
      });
    }

    function readFormValues(panel, fields) {
      const values = {};
      (fields || []).forEach(function (f) {
        if (!f || !f.key) return;
        if (f.type === "formSchema") {
          const arr = readFormSchemaEditor(panel, f.key);
          if (arr) values[f.key] = arr;
          return;
        }
        if (f.type === "questionList") {
          const qs = readQuestionListEditor(panel);
          if (qs) values[f.key] = qs;
          return;
        }
        if (f.type === "voteOptionList") {
          const opts = readVoteOptionListEditor(panel);
          if (opts) values[f.key] = opts;
          return;
        }
        if (f.type === "richtext") {
          const rte = panel.querySelector('[data-rte-field="' + f.key + '"]');
          values[f.key] = rte ? sanitizeRichHtml(rte.innerHTML) : "";
          return;
        }
        if (f.type === "radio") {
          const checked = panel.querySelector(
            '[data-field="' + f.key + '"]:checked'
          );
          values[f.key] = checked
            ? String(checked.value)
            : f.defaultValue != null
              ? String(f.defaultValue)
              : "";
          return;
        }
        if (f.type === "org") {
          const wrap = panel.querySelector('[data-org-filter="' + f.key + '"]');
          values[f.key] = wrap ? String(wrap.getAttribute("data-value") || "").trim() : "";
          return;
        }
        if (f.type === "attachments") {
          const wrap = panel.querySelector('[data-attach="' + f.key + '"]');
          values[f.key] = wrap && Array.isArray(wrap._files) ? wrap._files.slice() : [];
          return;
        }
        const el = panel.querySelector('[data-field="' + f.key + '"]');
        if (!el) return;
        if (f.type === "checkbox") {
          values[f.key] = !!el.checked;
        } else if (f.type === "datetime" || el.getAttribute("data-dtype") === "datetime") {
          values[f.key] = datetimeLocalToIso(el.value);
        } else if (f.type === "date" || el.getAttribute("data-dtype") === "date") {
          values[f.key] = dateInputToValue(el.value);
        } else if (f.type === "number") {
          const n = el.value === "" ? null : Number(el.value);
          values[f.key] = n;
        } else if (f.type === "arrayText" || el.getAttribute("data-dtype") === "arrayText") {
          const raw = (el.value || "").trim();
          values[f.key] = raw
            ? raw.split(/[,，\s]+/).map(function (s) {
                return s.trim();
              }).filter(Boolean)
            : [];
        } else {
          values[f.key] = el.value == null ? "" : String(el.value).trim();
        }
      });
      return values;
    }

    function fieldMatchesShowWhen(field, values) {
      if (!field || !field.showWhen) return true;
      const cond = field.showWhen;
      const vals = values || {};
      for (const k in cond) {
        if (!Object.prototype.hasOwnProperty.call(cond, k)) continue;
        if (String(vals[k]) !== String(cond[k])) return false;
      }
      return true;
    }

    function bindFormFieldVisibility(panel) {
      if (!panel) return;
      const wraps = panel.querySelectorAll("[data-show-when]");
      if (!wraps.length) return;
      const apply = function () {
        const vals = {};
        panel.querySelectorAll("[data-field]").forEach(function (el) {
          const k = el.getAttribute("data-field");
          if (!k) return;
          if (el.type === "checkbox") {
            vals[k] = el.checked ? "true" : "false";
          } else if (el.type === "radio") {
            if (el.checked) vals[k] = el.value;
          } else {
            vals[k] = el.value;
          }
        });
        wraps.forEach(function (wrap) {
          let cond = {};
          try {
            cond = JSON.parse(wrap.getAttribute("data-show-when") || "{}");
          } catch (e) {
            cond = {};
          }
          let vis = true;
          Object.keys(cond).forEach(function (k) {
            if (String(vals[k]) !== String(cond[k])) vis = false;
          });
          wrap.style.display = vis ? "" : "none";
        });
      };
      panel.addEventListener("change", apply);
      apply();
    }

    function validateFormFields(fields, values) {
      for (let i = 0; i < (fields || []).length; i++) {
        const f = fields[i];
        if (!f || !f.required) continue;
        if (!fieldMatchesShowWhen(f, values)) continue;
        const v = values[f.key];
        if (f.type === "checkbox") continue;
        if (f.type === "richtext") {
          if (!plainTextFromHtml(v)) return "请填写" + (f.label || f.key);
          continue;
        }
        if (v == null || v === "" || (Array.isArray(v) && !v.length)) {
          return "请填写" + (f.label || f.key);
        }
      }
      return null;
    }

    function exportCsv(filename, headers, rows) {
      const escapeCell = function (c) {
        const s = c == null ? "" : String(c);
        if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
        return s;
      };
      const lines = [headers.map(escapeCell).join(",")];
      (rows || []).forEach(function (r) {
        lines.push(r.map(escapeCell).join(","));
      });
      const bom = "\uFEFF";
      const blob = new Blob([bom + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = filename || "export.csv";
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 0);
    }

    /**
     * Generic list + filter + drawer CRUD page factory.
     * config: {
     *   title, storeKey, columns, filters, formFields, statusActions,
     *   levelColumn: 是否展示组织列（默认 true）,
     *   orgColumnTitle: 组织列文案（发布组织/所在组织/所属组织）,
     *   allowCreate, idPrefix, extraRowActions, onBeforeSave
     * }
     */
    function mountCrudPage(container, config) {
      if (!container || !config) return;
      const title = config.title || "";
      const storeKey = config.storeKey;
      const allowCreate = config.allowCreate !== false;
      const allowEdit = config.allowEdit !== false;
      const allowDelete = config.allowDelete !== false;
      const levelColumn = config.levelColumn !== false;
      const orgColumnTitle = config.orgColumnTitle || "所属组织";
      // 筛选项文案可与列表列不同（如列表「发布部门」、筛选仍为「发布组织」）
      const orgFilterTitle = config.orgFilterTitle || orgColumnTitle;
      const idPrefix = config.idPrefix || "rec";
      const statusActions = config.statusActions !== false;
      // 内容发布模块需显式 schedulePublish: true
      const schedulePublish = config.schedulePublish === true;
      const typeManage = config.typeManage || null;
      const defaultStatus =
        config.defaultStatus != null
          ? config.defaultStatus
          : schedulePublish
            ? "unpublished"
            : "active";
      // 发布状态只走操作列；定时上架模块注入「上架时间」立即/定时 + 条件显示计划时间
      let formFields = (config.formFields || []).slice();
      if (schedulePublish) {
        formFields = formFields.filter(function (f) {
          return f && f.key !== "status" && f.key !== "publishMode";
        });
        const publishModeField = {
          key: "publishMode",
          label: "上架时间",
          type: "radio",
          required: true,
          options: [
            { value: "now", label: "立即上架" },
            { value: "schedule", label: "定时上架" },
          ],
          defaultValue: "now",
        };
        const scheduledAtField = {
          key: "publishAt",
          label: "计划上架时间",
          type: "datetime",
          required: true,
          showWhen: { publishMode: "schedule" },
          placeholder: "到点自动上架",
        };
        const atIdx = formFields.findIndex(function (f) {
          return f && f.key === "publishAt";
        });
        if (atIdx >= 0) {
          formFields.splice(atIdx, 1, publishModeField, scheduledAtField);
        } else {
          formFields.push(publishModeField, scheduledAtField);
        }
      }
      // 首项统一为所属组织/发布组织/所在组织，与列表列文案一致
      let filters = (config.filters || []).slice();
      const hasOrgFilter = filters.some(function (f) {
        return f && (f.type === "org" || f.key === "orgId");
      });
      if (config.orgFilter !== false && !hasOrgFilter) {
        filters = [orgFilterDef(orgFilterTitle)].concat(filters);
      }
      let filterState = {};
      const orgFilterApis = {};
      filters.forEach(function (f) {
        if (f.type === "org") {
          filterState[f.key] =
            f.defaultValue != null && f.defaultValue !== ""
              ? f.defaultValue
              : currentSessionOrgId();
        } else if (f.type === "daterange") {
          filterState[f.key] = { start: "", end: "" };
        } else {
          filterState[f.key] = f.defaultValue != null ? f.defaultValue : "";
        }
      });
      if (_pendingPageFilters) {
        const incoming = _pendingPageFilters;
        _pendingPageFilters = null;
        Object.keys(incoming).forEach(function (k) {
          const f = filters.find(function (x) {
            return x && x.key === k;
          });
          if (!f || f.type === "daterange" || f.type === "org") return;
          filterState[k] = incoming[k] == null ? "" : String(incoming[k]);
        });
      }
      const pager = createPager(10);

      container.innerHTML =
        '<div class="page-title">' +
        escapeHtml(title) +
        "</div>" +
        (config.subtitle
          ? '<div class="page-desc">' + escapeHtml(config.subtitle) + "</div>"
          : "") +
        '<div class="filter-card" data-role="filters"></div>' +
        '<div class="toolbar" data-role="toolbar"></div>' +
        '<div data-role="table"></div>' +
        '<div class="table-footer" data-role="footer"></div>';

      const toolbarEl = container.querySelector('[data-role="toolbar"]');
      const tableEl = container.querySelector('[data-role="table"]');
      const footerEl = container.querySelector('[data-role="footer"]');

      function collectFilterState() {
        filters.forEach(function (f) {
          if (f.type === "org") {
            const api = orgFilterApis[f.key];

            return;

            const endEl = filterEl.querySelector('[data-filter="' + f.key + '-end"]');

              escapeHtml(f.key) +
              '" value="' +
              escapeHtml(filterState[f.key] || "") +
              '" placeholder="' +
              escapeHtml(f.placeholder || "请输入") +
              '" />';
          }
          html += "</div>";
        });
        html +=
          '<div class="filter-actions">' +
          '<button type="button" class="btn btn-primary" data-act="query">查询</button>' +
          '<button type="button" class="btn btn-default" data-act="reset">重置</button>' +
          "</div></div>";
        filterEl.innerHTML = html;
        Object.keys(orgFilterApis).forEach(function (k) {
          delete orgFilterApis[k];
        });
        filters.forEach(function (f) {
          if (f.type !== "org") return;
          const wrap = filterEl.querySelector('[data-org-filter="' + f.key + '"]');
          if (!wrap) return;
          orgFilterApis[f.key] = bindOrgFilterControl(wrap, {
            placeholder: f.placeholder || "请选择",
            onChange: function (v) {
              filterState[f.key] = v || "";
            },
          });
        });
        filterEl.querySelector('[data-act="query"]').addEventListener("click", function () {
          collectFilterState();
          pager.page = 1;
          refresh();
        });
        filterEl.querySelector('[data-act="reset"]').addEventListener("click", function () {
          filters.forEach(function (f) {
            if (f.type === "org") {
              filterState[f.key] =
                f.defaultValue != null && f.defaultValue !== ""
                  ? f.defaultValue
                  : currentSessionOrgId();
            } else if (f.type === "daterange") {
              filterState[f.key] = { start: "", end: "" };
            } else {
              filterState[f.key] = f.defaultValue != null ? f.defaultValue : "";
            }
          });
          pager.page = 1;
          renderFilters();
          refresh();
        });
      }

      function renderToolbar() {
        let html = "";
        if (allowCreate) {
          html +=
            '<button type="button" class="btn btn-success" data-act="create"><i class="ri-add-line"></i> 新增</button>';
        }
        if (typeManage) {
          html +=
            '<button type="button" class="btn btn-primary" data-act="type-manage"><i class="ri-price-tag-3-line"></i> 类型管理</button>';
        }
        toolbarEl.innerHTML = html;
        const createBtn = toolbarEl.querySelector('[data-act="create"]');
        if (createBtn) {
          createBtn.addEventListener("click", function () {
            openRecordDrawer("create", null);
          });
        }
        const typeBtn = toolbarEl.querySelector('[data-act="type-manage"]');
        if (typeBtn) {
          typeBtn.addEventListener("click", function () {
            openTypeManageDrawer({
              storeKey: typeManage.storeKey,
              dataStoreKey: storeKey,
              fieldKey: typeManage.fieldKey,
              label: typeManage.label || "类型",
              onSaved: function () {
                renderFilters();
                refresh();
              },
            });
          });
        }
      }

      function applyFilters(list) {
        return list.filter(function (row) {
          for (let i = 0; i < filters.length; i++) {
            const f = filters[i];
            const q = filterState[f.key];
            if (f.type === "daterange") {
              const range = q || {};
              if (!range.start && !range.end) continue;
              if (typeof config.matchFilter === "function") {
                const custom = config.matchFilter(row, f.key, range, f);
                if (custom === true) continue;
                if (custom === false) return false;
              }
              const ts = Date.parse(row[f.key]);
              if (range.start) {
                const s = Date.parse(range.start);
                if (!isNaN(s) && (isNaN(ts) || ts < s)) return false;
              }
              if (range.end) {
                const e = Date.parse(range.end + "T23:59:59");
                if (!isNaN(e) && (isNaN(ts) || ts > e)) return false;
              }
              continue;
            }
            if (q == null || q === "") continue;
            if (typeof config.matchFilter === "function") {
              const custom = config.matchFilter(row, f.key, q, f);
              if (custom === true) continue;
              if (custom === false) return false;
            }
            if (f.key === "progress") {
              if (getProgressStatus(row) !== String(q)) return false;
              continue;
            }
            if (schedulePublish && f.key === "status") {
              if (normalizeContentStatus(row.status, row) !== String(q)) return false;
              continue;
            }
            if (f.type === "org") {
              if (!matchOrgFilter(row, q)) return false;
            } else if (
              f.type === "select" ||
              (typeManage && f.key === typeManage.fieldKey)
            ) {
              if (String(row[f.key] == null ? "" : row[f.key]) !== String(q)) return false;
            } else {
              const hay = String(row[f.key] == null ? "" : row[f.key]);
              if (hay.indexOf(q) < 0) return false;
            }
          }
          return true;
        });
      }

      function buildColumns() {
        const cols = (config.columns || []).slice();
        let creatorCol = null;
        for (let i = cols.length - 1; i >= 0; i--) {
          if (cols[i] && cols[i].key === "createdBy") {
            creatorCol = cols.splice(i, 1)[0];
            break;
          }
        }
        if (levelColumn) {
          // 去掉旧的简略组织列，统一换成完整层级路径
          for (let i = cols.length - 1; i >= 0; i--) {
            const k = cols[i] && cols[i].key;
            if (k === "orgName" || k === "_level" || k === "_orgPath") cols.splice(i, 1);
          }
          cols.push(orgPathColumn(orgColumnTitle, "200px"));
        }
        if (creatorCol) cols.push(creatorCol);
        return cols;
      }

      function openRecordDrawer(mode, record) {
        let useMode = mode;
        // 已上架不可编辑，强制查看
        if (
          schedulePublish &&
          useMode === "edit" &&
          record &&
          isPublishedStatus(record.status, record)
        ) {
          toast("已上架内容不可编辑，请先下架", "warning");
          useMode = "view";
        }
        const isCreate = useMode === "create";
        const isView = useMode === "view";
        const viewRecord = record
          ? Object.assign({}, record, {
              status: schedulePublish
                ? normalizeContentStatus(record.status)
                : record.status,
            })
          : {};
        if (schedulePublish && record) {
          viewRecord.publishMode =
            isUnpublishedStatus(record.status) && record.publishAt ? "schedule" : "now";
        }
        if (record && viewRecord.onlineSignup == null) {
          const hasOnlineField = formFields.some(function (f) {
            return f && f.key === "onlineSignup";
          });
          if (hasOnlineField) viewRecord.onlineSignup = "true";
        }
        if (typeof config.prepareRecord === "function" && record) {
          config.prepareRecord(viewRecord, useMode, record);
        }
        let drawerTitle =
          (isCreate ? "新增" : isView ? "查看" : "编辑") + " — " + title;
        if (schedulePublish && isView && record && isPublishedStatus(record.status, record)) {
          drawerTitle = "查看（只读·已上架）— " + title;
        }
        const useFields = applyTypeSelectToFields(
          formFields,
          isCreate ? "" : viewRecord[typeManage && typeManage.fieldKey],
          false,
          true
        );
        let bodyHtml = buildFormHtml(
          useFields,
          isCreate ? { orgId: currentSessionOrgId() } : viewRecord,
          useMode
        );
        if (typeof config.extraDrawerHtml === "function") {
          bodyHtml +=
            config.extraDrawerHtml(isCreate ? null : record, useMode, viewRecord) || "";
        }
        openDrawer({
          title: drawerTitle,
          mode: useMode,
          bodyHtml: bodyHtml,
          onSubmit: function () {
            if (isView) return true;
            const panel = document.getElementById("sws-drawer");
            if (!panel) return false;
            const values = readFormValues(panel, useFields);
            const err = validateFormFields(useFields, values);
            if (err) {
              toast(err, "warning");
              return false;
            }
            // 报名表单/题目：下拉/单选至少 2 选项（关闭在线报名时不校验表单模块）
            const onlineSignupOn =
              values.onlineSignup !== false &&
              values.onlineSignup !== "false" &&
              values.onlineSignup !== 0 &&
              values.onlineSignup !== "0";
            if (onlineSignupOn && values.formFields && Array.isArray(values.formFields)) {
              for (let i = 0; i < values.formFields.length; i++) {
                const ff = values.formFields[i];
                if (ff.type === "select" && (!ff.options || ff.options.length < 2)) {
                  toast("下拉单选「" + (ff.label || "") + "」请至少配置 2 个选项", "warning");
                  return false;
                }
              }
            }
            if (values.questions && Array.isArray(values.questions)) {
              for (let j = 0; j < values.questions.length; j++) {
                const q = values.questions[j];
                if (
                  (q.type === "single" || q.type === "multi") &&
                  (!q.options || q.options.length < 2)
                ) {
                  toast(
                    (q.type === "multi" ? "多选题" : "单选题") +
                      "「" +
                      (q.label || "") +
                      "」请至少配置 2 个选项",
                    "warning"
                  );
                  return false;
                }
              }
            }
            const ctx = getSessionOrgContext();
            const now = nowISO();
            let saved;
            if (isCreate) {
              const belong = getOrg(values.orgId) || {};
              saved = Object.assign({}, values, {
                id: uid(idPrefix),
                orgId: belong.id || ctx.orgId,
                orgLevel: belong.level || ctx.orgLevel,
                orgName: belong.name || ctx.orgName,
                deptId: (belong.level === "village" ? "" : ctx.deptId) || "",
                deptName: (belong.level === "village" ? "" : ctx.deptName) || "",
                status: schedulePublish ? "unpublished" : values.status || defaultStatus,
                createdAt: now,
                updatedAt: now,
                createdBy: ctx.creatorName || demoCreatorName(ctx),
              });
            } else {
              if (record && schedulePublish && isPublishedStatus(record.status, record)) {
                toast("已上架内容不可编辑，请先下架", "warning");
                return false;
              }
              // 状态不由表单改写
              saved = Object.assign({}, record, values, {
                updatedAt: now,
                status: record.status,
              });
            }
            if (schedulePublish) {
              const norm = normalizeSchedulePublish(saved, { fromSave: true });
              if (norm === false) return false;
              saved = norm;
              applyDefaultPublishScope(saved);
            } else if (isContentPublishStoreKey(storeKey)) {
              applyDefaultPublishScope(saved);
            }
            if (typeof config.onBeforeSave === "function") {
              const r = config.onBeforeSave(saved, { mode: useMode, record: record });
              if (r === false) return false;
              if (r && typeof r === "object") saved = r;
            }
            let okMsg = isCreate ? "新增成功" : "保存成功";
            if (schedulePublish && isUnpublishedStatus(saved.status, saved) && saved.publishAt) {
              okMsg = "已保存，将于计划时间自动上架";
            } else if (schedulePublish && saved._endedPublishWarn) {
              okMsg = "已上架，当前已过结束时间，群众端仅可查看";
            }
            if (saved && saved._endedPublishWarn) delete saved._endedPublishWarn;
            saveRecord(storeKey, saved);
            refresh();
            setTimeout(function () {
              toast(okMsg, "success");
            }, 0);
            return true;
          },
        });
      }

      function setStatus(row, nextStatus) {
        if (!canManage(row)) {
          toast("仅可操作本级及下级数据", "warning");
          return;
        }
        const now = nowISO();
        let next = Object.assign({}, row, {
          status: nextStatus,
        });
        if (schedulePublish) {
          next.status = normalizeContentStatus(nextStatus);
          if (next.status === "published") {
            // 保留原计划时间到 plannedPublishAt，实际上架时间写入 actualPublishAt / publishAt
            if (row.publishAt && new Date(row.publishAt).getTime() > Date.now()) {
              next.plannedPublishAt = row.publishAt;
            } else if (row.plannedPublishAt) {
              next.plannedPublishAt = row.plannedPublishAt;
            }
            next.actualPublishAt = now;
            next.publishAt = now;
          }
          if (next.status === "offline") {
            next.actualOfflineAt = now;
            delete next.offlineAt; // 已取消定时下架，不再保留计划下架时间
          }
          // 下架/回到定时：不改 updatedAt，更新时间只反映创建/编辑
          applyDefaultPublishScope(next);
        } else {
          next.updatedAt = now;
        }
        saveRecord(storeKey, next);
        toast(
          next.status === "published"
            ? isProgressEnded(next)
              ? "已上架，当前已过结束时间，群众端仅可查看"
              : "已上架"
            : next.status === "offline"
              ? "已下架"
              : next.status === "unpublished"
                ? "已设为定时上架"
                : "状态已更新",
          "success"
        );
        refresh();
      }

      function confirmSetStatus(row, nextStatus) {
        const goingOn = nextStatus === "published";
        confirmDialog({
          title: goingOn ? "确认上架" : "确认下架",
          content: goingOn
            ? "上架后将对可见范围内群众端展示，是否继续？"
            : "下架后群众端将不再展示，是否继续？",
          onOk: function () {
            setStatus(row, nextStatus);
          },
        });
      }

      function doDelete(row) {
        if (!canManage(row)) {
          toast("仅可操作本级及下级数据", "warning");
          return;
        }
        if (
          schedulePublish &&
          !isOfflineStatus(row.status, row) &&
          !isUnpublishedStatus(row.status, row)
        ) {
          toast("已上架内容请先下架后再删除", "warning");
          return;
        }
        confirmDialog({
          title: "确认删除",
          content: "删除后列表不再展示，是否继续？",
          onOk: function () {
            removeRecord(storeKey, row.id);
            toast("已删除", "success");
            refresh();
          },
        });
      }

      function defaultRowActions(row) {
        const acts = [
          {
            label: "查看",
            onClick: function () {
              openRecordDrawer("view", row);
            },
          },
        ];
        if (canManage(row)) {
          const st = schedulePublish
            ? normalizeContentStatus(row.status, row)
            : row.status;
          if (schedulePublish) {
            // 定时上架/已下架：可编辑、上架、删除；已上架：仅下架。与进行状态无关。
            if (st === "unpublished" || st === "offline") {
              acts.push({
                label: "编辑",
                onClick: function () {
                  openRecordDrawer("edit", row);
                },
              });
            }
            if (statusActions) {
              if (st === "unpublished" || st === "offline") {
                acts.push({
                  label: "上架",
                  onClick: function () {
                    confirmSetStatus(row, "published");
                  },
                });
              }
              if (st === "published") {
                acts.push({
                  label: "下架",
                  onClick: function () {
                    confirmSetStatus(row, "offline");
                  },
                });
              }
            }
            if (st === "unpublished" || st === "offline") {
              acts.push({
                label: "删除",
                onClick: function () {
                  doDelete(row);
                },
              });
            }
          } else {
            if (allowEdit) {
              acts.push({
                label: "编辑",
                onClick: function () {
                  openRecordDrawer("edit", row);
                },
              });
            }
            if (statusActions) {
              if (st === "unpublished" || st === "offline" || st === "draft") {
                acts.push({
                  label: "上架",
                  onClick: function () {
                    confirmSetStatus(row, "published");
                  },
                });
              }
              if (st === "published") {
                acts.push({
                  label: "下架",
                  onClick: function () {
                    confirmSetStatus(row, "offline");
                  },
                });
              }
            }
            if (allowDelete) {
              acts.push({
                label: "删除",
                onClick: function () {
                  doDelete(row);
                },
              });
            }
          }
        }
        if (typeof config.extraRowActions === "function") {
          const extra = (config.extraRowActions(row, { refresh: refresh }) || []).filter(
            function (a) {
              return !!a;
            }
          );
          const delIdx = acts.findIndex(function (a) {
            return a && a.label === "删除";
          });
          if (delIdx >= 0) {
            extra
              .slice()
              .reverse()
              .forEach(function (a) {
                acts.splice(delIdx, 0, a);
              });
          } else {
            extra.forEach(function (a) {
              acts.push(a);
            });
          }
        }
        return acts;
      }

      function refresh() {
        if (schedulePublish) processScheduledPublishes();
        const all = listForPc(storeKey);
        const filtered = applyFilters(all);
        const pageInfo = applyPager(filtered, pager);
        renderTable(tableEl, {
          columns: buildColumns(),
          rows: pageInfo.rows,
          rowActions: defaultRowActions,
        });
        renderPagination(footerEl, pageInfo, function (next) {
          pager.page = next.page;
          pager.pageSize = next.pageSize;
          refresh();
        });
      }

      renderFilters();
      renderToolbar();
      refresh();
      return { refresh: refresh };
    }

    /* ========== 信息公开四模块 ========== */
    function openActivitySignupsDrawer(activity) {
      if (!isOnlineSignupEnabled(activity)) {
        toast("该活动未开启在线报名", "warning");
        return;
      }
      if (!canViewPublishSideData(activity.status)) {
        toast("活动上架后才可查看报名数据", "warning");
        return;
      }
      const all = getAll(KEYS.activitySignups).filter(function (s) {
        return s.activityId === activity.id && !s.deleted;
      });
      const schema = activity.formFields && activity.formFields.length
        ? activity.formFields
        : DEFAULT_SIGNUP_FIELDS;
      let body =
        '<div class="form-section-title">报名名单（' +
        all.length +
        "）</div>" +
        '<div class="toolbar"><button type="button" class="btn btn-primary btn-sm" data-act="export-csv">导出 CSV</button></div>' +
        '<div data-role="signup-table"></div>';
      const drawer = openDrawer({
        title: "报名名单 — " + (activity.title || ""),
        mode: "view",
        bodyHtml: body,
      });
      const tableHost = drawer.panel.querySelector('[data-role="signup-table"]');
      const cols = schema.map(function (f) {
        return {
          title: f.label || f.id,
          key: f.id,
          width: f.type === "textarea" ? undefined : "110px",
          render: function (r) {
            const ans = (r.formData && r.formData[f.id] != null)
              ? r.formData[f.id]
              : r[f.id];
            return escapeHtml(ans == null || ans === "" ? "-" : String(ans));
          },
        };
      });
      cols.push(orgPathColumn("所在组织", "160px"));
      cols.push({
        title: "报名时间",
        key: "createdAt",
        width: "140px",
        render: function (r) {
          return escapeHtml(formatDateTime(r.createdAt));
        },
      });
      renderTable(tableHost, { columns: cols, rows: all });
      const expBtn = drawer.panel.querySelector('[data-act="export-csv"]');
      if (expBtn) {
        expBtn.disabled = false;
        expBtn.addEventListener("click", function () {
          const headers = schema.map(function (f) {
            return f.label || f.id;
          }).concat(["所属组织", "报名时间"]);
          exportCsv(
            "activity_signups_" + (activity.id || "") + ".csv",
            headers,
            all.map(function (r) {
              return schema
                .map(function (f) {
                  const ans =
                    r.formData && r.formData[f.id] != null
                      ? r.formData[f.id]
                      : r[f.id];
                  return ans == null ? "" : String(ans);
                })
                .concat([r.orgName || "", formatDateTime(r.createdAt)]);
            })
          );
          toast("已导出 CSV", "success");
        });
      }
    }

    function openReasonDrawer(opts) {
      opts = opts || {};
      const fields = [
        {
          key: "reason",
          label: opts.label || "原因/说明",
          type: "textarea",
          required: !!opts.required,
          full: true,
          rows: opts.rows || 4,
          placeholder: opts.placeholder || "请输入",
        },
      ];
      const initial = { reason: opts.defaultValue || "" };
      openDrawer({
        title: opts.title || "填写说明",
        mode: "edit",
        bodyHtml: buildFormHtml(fields, initial, "edit"),
        onSubmit: function () {
          const panel = document.getElementById("sws-drawer");
          if (!panel) return false;
          const values = readFormValues(panel, fields);
          const err = validateFormFields(fields, values);
          if (err) {
            toast(err, "warning");
            return false;
          }
          if (typeof opts.onOk === "function") {
            const r = opts.onOk(values.reason || "");
            if (r === false) return false;
          }
          return true;
        },
      });
    }

      function aggregateSurveyAnswers(survey, answers) {
        const all = answers || [];
        const questions = survey.questions || [];
        return questions.map(function (q) {
          if (!q) return null;
          if (q.type === "score") {
            const nums = all
              .map(function (a) {
                return Number((a.answers || {})[q.id]);
              })
              .filter(function (n) {
                return !isNaN(n);
              });
            const sum = nums.reduce(function (s, n) {
              return s + n;
            }, 0);
            return {
              label: q.label || q.id,
              text:
                nums.length
                  ? "均分 " + (Math.round((sum / nums.length) * 10) / 10) + "（" + nums.length + " 人）"
                  : "暂无评分",
            };
          }
          if (q.type === "single" || q.type === "multi") {
            const counts = {};
            all.forEach(function (a) {
              let v = (a.answers || {})[q.id];
              const arr = Array.isArray(v) ? v : v ? [v] : [];
              arr.forEach(function (x) {
                const k = String(x);
                counts[k] = (counts[k] || 0) + 1;
              });
            });
            const parts = Object.keys(counts)
              .sort(function (a, b) {
                return counts[b] - counts[a];
              })
              .map(function (k) {
                return k + " " + counts[k] + " 票";
              });
            return {
              label: q.label || q.id,
              text: parts.length ? parts.join("；") : "暂无选项统计",
            };
          }
          return { label: q.label || q.id, text: "开放题见明细" };
        }).filter(Boolean);
      }

        (survey.questions || []).forEach(function (q) {
          if (q && q.id) qLabels[q.id] = q.label || q.id;
        });

        let statsHtml = '<div class="form-section-title">结果统计（' + all.length + " 份）</div>";

          statsHtml += '<div class="page-card" style="padding:12px">暂无答卷</div>';

      /* ---- Step5 议事 ---- */
      function aggregateTopicVotes(topic) {
        const votes = getAll(KEYS.topicVotes).filter(function (v) {
          return v.topicId === topic.id && !v.deleted;
        });
        const options = topic.options || [];
        const counts = {};
        options.forEach(function (o) {
          counts[o.id] = 0;
        });
        votes.forEach(function (v) {
          if (counts[v.optionId] == null) counts[v.optionId] = 0;
          counts[v.optionId]++;
        });
        return {
          total: votes.length,
          counts: counts,
          options: options,
          votes: votes,
        };
      }

            }
            const ts = Date.parse(saved.startAt);
            const te = Date.parse(saved.endAt);
            if (isNaN(ts) || isNaN(te)) {
              toast("议题时间格式不正确", "warning");
              return false;
            }
            if (ts >= te) {
              toast("结束时间须晚于开始时间", "warning");
              return false;
            }
            saved.villageOnly = !!saved.villageOnly;
            if (saved.type === "vote") {
              const opts = normalizeVoteOptions(saved.options);
              if (opts.length < 2) {
                toast("表决议题请至少配置 2 个选项", "warning");
                return false;
              }
              saved.options = opts;
              saved.resultPublic =
                saved.resultPublic !== false &&
                saved.resultPublic !== "false" &&
                saved.resultPublic !== 0 &&
                saved.resultPublic !== "0";
              // 兼容旧字段：表决时间合一
              saved.discussStart = saved.startAt;
              saved.voteStart = saved.startAt;
              saved.voteEnd = saved.endAt;
            } else {
              saved.options = [];
              saved.resultPublic = false;
              saved.discussStart = saved.startAt;
              saved.voteStart = null;
              saved.voteEnd = saved.endAt;
            }
            return saved;
          },
          extraRowActions: function (row) {
            const p = getProgressStatus(row);
            const kind =
              row.type ||
              (row.status === "voting" ? "vote" : row.status === "discussing" ? "discuss" : "");
            const acts = [];
            if (canViewPublishSideData(row.status)) {
              acts.push({
                label: "讨论协商记录",
                onClick: function () {
                  openTopicDiscussDrawer(row);
                },
              });
            }
            if (kind === "vote" && canViewPublishSideData(row.status) && p !== "not_started") {
              acts.push({
                label: "表决结果",
                onClick: function () {
                  openTopicVoteResultDrawer(row);
                },
              });
            }
            return acts;
          },
        });
      };

      function topicCommentDisplayName(c) {
        if (!c) return "-";

          return (raw ? raw.charAt(0) + "**" : "匿**") + "（匿名）";
        }
        if (c.isAdmin) return (c.userName || "管理员") + "（管理员）";
        return c.userName || "-";

      function topicCommentPhone(c) {
        if (c && c.phone) return String(c.phone);

      function listTopicComments(topicId) {

          .slice()
          .sort(function (a, b) {

      function openTopicDiscussDrawer(topic) {
        const phase = topicPhaseOf(topic);
        const phaseLabel = (topicStatusMeta(topic) || {}).label || "-";
        const kind =
          topic.type ||
          (topic.status === "voting" ? "vote" : topic.status === "discussing" ? "discuss" : "");
        const start = topic.startAt || topic.discussStart || topic.voteStart;
        const end = topic.endAt || topic.voteEnd;
        const canReply =
          canManage(topic) && (phase === "discussing" || phase === "voting");
        let comments = listTopicComments(topic.id);

        function buildBody() {
          comments = listTopicComments(topic.id);
          let html =
            '<div class="form-section-title">议题基本信息</div>' +
            '<div class="form-grid" style="margin-bottom:12px">' +
            '<div class="form-field full"><label>议题标题</label><div>' +
            escapeHtml(topic.title || "-") +

            '<div class="form-field"><label>类型</label><div>' +
            escapeHtml(TOPIC_TYPE_LABEL[kind] || kind || "-") +
            "</div></div>" +

            escapeHtml(phaseLabel) +
            "</div></div>" +
            '<div class="form-field full"><label>议题范围</label><div>' +

            escapeHtml(formatOrgPathLabel(topic) || topic.orgName || "-") +

          html +=
            '<div class="form-section-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap">' +
            "<span>讨论明细（" +

      };
      const pubStatusFilter = {
        key: "status",
        label: "状态",
        type: "select",
        options: CONTENT_STATUS_OPTIONS,
      };
      // 与群众端进度语义对齐：受理中 / 审核中 / 已退回 / 已办结 / 不予受理
      const ASSIST_STATUS_LABEL = {
        submitted: "受理中",
        rejected: "不予受理",
        assigned: "审核中",
        returned: "已退回",
        completed: "已办结",
      };

      function formatAssistAreaPc(row) {
        return formatOrgPathLabel(row);
      }

      function getAssistContentPc(row) {
        if (!row) return "";
        return row.content || row.reason || "";
      }

      /** 受理中、审核中不展示进度说明（与 H5 一致） */
      function shouldShowAssistProgressTextPc(row) {
        var st = (row && row.status) || "";
        return st !== "submitted" && st !== "assigned";
      }

      function assistDisplayTitle(row) {
        if (!row) return "帮扶申请";
        if (row.type) return row.type;
        return row.title || "帮扶申请";
      }

      function centerOrgDisplayName(session) {
        const org = getOrg(session && session.orgId);
        return (org ? org.name : "乡镇") + "综合信息指挥室";
      }

      function isAssistCenter(session) {
        if (!session) return false;
        if (session.role === "center") return true;
        if (session.deptId) {
          const d = getAll(KEYS.depts).find(function (x) {
            return x.id === session.deptId;
          });
          return !!(d && d.role === "center");
        }
        return false;
      }

      function isAssistDepartment(session) {
        return !!(session && session.role === "department");
      }

      function canCenterHandleAssist(session, row) {
        if (!isAssistCenter(session) || !row) return false;
        if (row.centerOrgId) return row.centerOrgId === session.orgId;
        return isAncestorOrg(session.orgId, row.orgId) || session.orgId === row.orgId;
      }

      function canDeptHandleAssist(session, row) {
        if (!isAssistDepartment(session) || !row) return false;
        if (row.status !== "assigned") return false;
        return row.deptId === session.deptId;
      }

      function assistHandleOrg(row) {
        if (!row) return "-";
        if (row.handleOrgName) return row.handleOrgName;
        if (row.status === "assigned" && row.deptName) return row.deptName;
        if ((row.status === "completed" || row.status === "returned") && row.deptName) return row.deptName;
        if (row.status === "submitted" || row.status === "rejected") {
          return "综合信息指挥室";
        }
        return row.deptName || "-";
      }

      function appendTimeline(row, step, label, by, remark, at) {
        const list = (row.timeline || []).slice();
        list.push({ step: step, label: label, at: at, by: by, remark: remark || "" });
        return list;
      }

      function saveAssistApp(next, msg) {
        saveRecord(KEYS.assistApplications, next);
        toast(msg || "已更新", "success");
      }

      /* ---- Step1 数据仓 / 政策 / 基金会 / 帮扶记录 ---- */
      function clipText(s, n) {
        const t = String(s == null ? "" : s).replace(/\s+/g, " ").trim();
        if (!t) return "-";
        const max = n || 18;
        if (t.length <= max) return t;
        return t.slice(0, max) + "…";
      }
      function assistSourceDisplay(row) {
        if (row && row.source === "api") {
          return row.sourceSystem || "系统推送";
        }
        return "手动录入";
      }
      function assistSourceTagHtml(row) {
        if (row && row.source === "api") {
          return (
            '<span class="tag tag-blue">' +
            escapeHtml(row.sourceSystem || "系统推送") +
            "</span>"
          );
        }
        return '<span class="tag">手动录入</span>';
      }
      function assistSourceFilterOpts() {
        const opts = [{ value: "manual", label: "手动录入" }];
        const seen = {};
        getAll(KEYS.assistRecords).forEach(function (r) {
          const name = r && r.source === "api" ? String(r.sourceSystem || "").trim() : "";
          if (!name || seen[name]) return;
          seen[name] = true;
          opts.push({ value: name, label: name });
        });
        return opts;
      }
      function assistEffectLabel(v) {
        const m = {
          good: "效果良好",
          normal: "效果一般",
          poor: "效果较差",
          pending: "待评估",
        };
        return m[v] || "待评估";
      }
      function assistEffectTagHtml(v) {
        if (v === "good") return '<span class="tag tag-green">效果良好</span>';
        if (v === "normal") return '<span class="tag tag-orange">效果一般</span>';
        if (v === "poor") return '<span class="tag tag-red">效果较差</span>';
        return '<span class="tag">待评估</span>';
      }
      function assistFollowEntries(row) {
        return ((row && row.timeline) || [])
          .filter(function (x) {
            if (!x) return false;
            if (x.step === "follow" || x.label === "跟进") return true;
            if (x.step === "done" || x.label === "办结") return true;
            return false;
          })
          .slice()
          .sort(function (a, b) {
            return Date.parse(a.at || 0) - Date.parse(b.at || 0);
          });
      }
      function assistLatestFollow(row) {
        const follows = assistFollowEntries(row);

      Pages["assist-stats"] = function (container) {
        var rangeKey = "all";
        var rangeStart = "";
        var rangeEnd = "";
        var scopeOrgId = currentSessionOrgId();
        var DONUT_COLORS = ["#1677FF", "#52C41A", "#FAAD14", "#FF4D4F", "#722ED1", "#13C2C2", "#EB2F96", "#2F54EB"];
        var CHILD_LEVEL_TITLE = {
          city: "区县",
          district: "乡镇",
          town: "村社",
        };

        function parseTs(v) {
          if (!v) return 0;
          var t = Date.parse(v);
          return isNaN(t) ? 0 : t;
        }
        function inRange(iso, key) {
          if (key === "all" || !iso) return true;
          var ts = parseTs(iso);
          if (!ts) return true;
          var now = Date.now();
          if (key === "7d") return ts >= now - 7 * 86400000;
          if (key === "30d") return ts >= now - 30 * 86400000;
          if (key === "month") {
            var d = new Date();
            var start = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
            return ts >= start;
          }
          if (key === "custom") {
            if (!rangeStart && !rangeEnd) return true;
            if (rangeStart) {
              var s = Date.parse(rangeStart);
              if (!isNaN(s) && ts < s) return false;
            }
            if (rangeEnd) {
              var e = Date.parse(rangeEnd + "T23:59:59");
              if (!isNaN(e) && ts > e) return false;
            }
            return true;
          }
          return true;
        }
        function countBy(list, keyFn) {
          var map = {};
          (list || []).forEach(function (r) {
            var k = keyFn(r) || "未分类";
            map[k] = (map[k] || 0) + 1;
          });
          return map;
        }
        function sortedEntries(map, limit) {
          return Object.keys(map)
            .map(function (k) {
              return { key: k, n: map[k] };
            })
            .sort(function (a, b) {
              return b.n - a.n;
            })
            .slice(0, limit || 99);
        }
        function pct(n, total) {
          if (!total) return 0;
          return Math.round((n / total) * 1000) / 10;
        }
        function barsHtml(map, color) {
          var entries = sortedEntries(map);
          if (!entries.length) return '<div class="stats-empty">暂无数据</div>';
          var max = Math.max.apply(
            null,
            entries
              .map(function (e) {
                return e.n;
              })
              .concat([1])
          );
          return entries
            .map(function (e) {
              var w = Math.max(6, Math.round((e.n / max) * 100));
              return (
                '<div class="bar-row"><div class="bar-label" title="' +
                escapeHtml(e.key) +
                '">' +
                escapeHtml(e.key) +
                '</div><div class="bar-track"><div class="bar-fill" style="width:' +
                w +
                "%;background:" +
                (color || "linear-gradient(90deg,#3b8dff,#1677FF)") +
                '"></div></div><div class="bar-val">' +
                e.n +
                "</div></div>"
              );
            })
            .join("");
        }
        function donutHtml(map, totalLabel) {
          var entries = sortedEntries(map);
          if (!entries.length) return '<div class="stats-empty">暂无数据</div>';
          var total = 0;
          entries.forEach(function (e) {
            total += e.n;
          });
          var deg = 0;
          var parts = [];
          entries.forEach(function (e, i) {
            var span = total ? (e.n / total) * 360 : 0;
            var c = DONUT_COLORS[i % DONUT_COLORS.length];
            parts.push(c + " " + deg + "deg " + (deg + span) + "deg");
            deg += span;
          });
          if (!parts.length) parts.push("#eef2f7 0deg 360deg");
          var legend = entries
            .map(function (e, i) {
              return (
                '<div class="donut-legend-row"><span class="donut-dot" style="background:' +
                DONUT_COLORS[i % DONUT_COLORS.length] +
                '"></span><span class="dl-name" title="' +
                escapeHtml(e.key) +
                '">' +
                escapeHtml(e.key) +
                '</span><span class="dl-val">' +
                e.n +
                '</span><span class="dl-pct">' +
                pct(e.n, total) +
                "%</span></div>"
              );
            })
            .join("");
          return (
            '<div class="donut-wrap"><div class="donut" style="background:conic-gradient(' +
            parts.join(",") +
            ')"><div class="donut-center"><div class="dc-num">' +
            total +
            '</div><div class="dc-lab">' +
            escapeHtml(totalLabel || "合计") +
            "</div></div></div><div class=\"donut-legend\">" +
            legend +
            "</div></div>"
          );
        }
        function orgSituationTableHtml(rows, recTotal, orgColTitle) {
          if (!rows.length) {
            return '<div class="stats-empty">当前组织无下级，无法继续下钻</div>';
          }
          var max = 1;
          rows.forEach(function (r) {
            if (r.n > max) max = r.n;
          });
          return (
            '<table class="rank-table"><thead><tr><th style="width:40px">#</th><th>' +
            escapeHtml(orgColTitle || "组织") +
            '</th><th style="width:72px">记录数</th><th style="width:80px">帮扶人数</th><th style="width:110px">占比</th></tr></thead><tbody>' +
            rows
              .map(function (r, idx) {
                var cls = idx === 0 ? "top1" : idx === 1 ? "top2" : idx === 2 ? "top3" : "";
                var w = Math.max(6, Math.round((r.n / max) * 100));
                var nameHtml = r.canDrill
                  ? '<button type="button" class="count-link" data-drill-org="' +
                    escapeHtml(r.id) +
                    '">' +
                    escapeHtml(r.key) +
                    "</button>"
                  : escapeHtml(r.key);
                return (
                  "<tr><td><span class=\"rank-idx " +
                  cls +
                  '">' +
                  (idx + 1) +
                  "</span></td><td>" +
                  nameHtml +
                  "</td><td><b>" +
                  r.n +
                  "</b></td><td>" +
                  r.people +
                  '</td><td><div class="rank-bar-mini"><i style="width:' +
                  w +
                  '%"></i></div><span style="margin-left:6px;font-size:12px;color:rgba(0,0,0,0.45)">' +
                  pct(r.n, recTotal) +
                  "%</span></td></tr>"
                );
              })
              .join("") +
            "</tbody></table>"
          );
        }
        function bindDrill(root) {
          root.querySelectorAll("[data-drill-org]").forEach(function (el) {
            el.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              var id = el.getAttribute("data-drill-org");
              if (!id) return;
              var sessId = currentSessionOrgId();
              if (sessId && id !== sessId && !isAncestorOrg(sessId, id)) {
                toast("只能查看本级及下级组织", "warning");
                return;
              }
              scopeOrgId = id;
              render();
            });
          });
        }
        function freqTableHtml(rows, peopleTotal) {
          if (!rows.length) return '<div class="stats-empty">暂无帮扶对象</div>';
          var max = 1;
          rows.forEach(function (r) {
            if (r.n > max) max = r.n;
          });
          return (
            '<table class="rank-table"><thead><tr><th>帮扶次数</th><th style="width:80px">人数</th><th style="width:140px">占比</th></tr></thead><tbody>' +
            rows
              .map(function (r) {
                var w = Math.max(6, Math.round((r.n / max) * 100));
                return (
                  "<tr><td>帮扶 <b>" +
                  r.times +
                  "</b> 次</td><td><b>" +
                  r.n +
                  "</b> 人</td><td><div class=\"rank-bar-mini\"><i style=\"width:" +
                  w +
                  '%"></i></div><span style="margin-left:6px;font-size:12px;color:rgba(0,0,0,0.45)">' +
                  pct(r.n, peopleTotal) +
                  "%</span></td></tr>"
                );
              })
              .join("") +
            "</tbody></table>"
          );
        }
        function bindJumps(root) {
          root.querySelectorAll("[data-jump-route]").forEach(function (el) {
            el.addEventListener("click", function (e) {
              e.preventDefault();
              e.stopPropagation();
              var route = el.getAttribute("data-jump-route");
              var fk = el.getAttribute("data-jump-filter");
              var fv = el.getAttribute("data-jump-value") || "";
              var q = {};
              if (fk) q[fk] = fv;
              navigate(route, q);
            });
          });
        }

        function render() {
          var recsAll = listForPc(KEYS.assistRecords);
          var scopeId = scopeOrgId || currentSessionOrgId();
          var recs = recsAll.filter(function (r) {
            if (!inRange(r.assistAt || r.createdAt, rangeKey)) return false;
            return matchOrgFilter(r, scopeId);
          });

          var total = recs.length;
          var nFollowed = recs.filter(function (r) {
            return recHasAssistFollow(r);
          }).length;
          var nUnfollowed = total - nFollowed;
          var nManual = recs.filter(function (r) {
            return r.source !== "api";
          }).length;
          var nApi = total - nManual;
          var followRate = pct(nFollowed, total);
          var nGood = recs.filter(function (r) {
            return r.effect === "good";
          }).length;
          var nNormal = recs.filter(function (r) {
            return r.effect === "normal";
          }).length;
          var nPoor = recs.filter(function (r) {
            return r.effect === "poor";
          }).length;
          var nPending = recs.filter(function (r) {
            return !r.effect || r.effect === "pending";
          }).length;
          var goodRate = pct(nGood, total);

          var countByPerson = {};
          recs.forEach(function (r) {
            var id = r.personId || r.personName || "";
            if (!id) return;
            countByPerson[id] = (countByPerson[id] || 0) + 1;
          });
          var nPeople = Object.keys(countByPerson).length;
          var avgTimes = nPeople ? Math.round((total / nPeople) * 10) / 10 : 0;

          var byType = countBy(recs, function (r) {
            return r.personType || "未分类";
          });
          var byEffect = {};
          if (nGood) byEffect["效果良好"] = nGood;
          if (nNormal) byEffect["效果一般"] = nNormal;
          if (nPoor) byEffect["效果较差"] = nPoor;
          if (nPending) byEffect["待评估"] = nPending;
          var bySource = countBy(recs, function (r) {

            return Object.keys(m).length;

              return matchOrgFilter(r, ch.id);

            return {
              id: ch.id,
              key: ch.name,
              n: childRecs.length,
              people: peopleCount(childRecs),
              canDrill: getOrgChildren(ch.id).length > 0,
            };
          });
          orgRows.sort(function (a, b) {
            return b.n - a.n;

          var selfRecs = recs.filter(function (r) {
            return r.orgId === scopeId;

      /* ---- Step4 省级只读 7 页 ---- */
      function mountReadOnlyPage(container, config) {
        config = config || {};
        const title = config.title || "";
        const storeKey = config.storeKey;
        const orgColumnTitle = config.orgColumnTitle || "所属组织";
        const orgFilterTitle = config.orgFilterTitle || orgColumnTitle;
        const columns = config.columns || [];
        const formFields = config.formFields || [];
        let filters = (config.filters || []).slice();
        const hasOrgFilter = filters.some(function (f) {
          return f && (f.type === "org" || f.key === "orgId");
        });
        if (config.orgFilter !== false && !hasOrgFilter) {
          filters = [orgFilterDef(orgFilterTitle)].concat(filters);
        }
        let filterState = {};
        const orgFilterApis = {};
        filters.forEach(function (f) {
          filterState[f.key] = f.type === "org" ? currentSessionOrgId() : "";
        });
        const pager = createPager(10);

        container.innerHTML =
          '<div class="page-title-row"><div class="page-title">' +
          escapeHtml(title) +
          '</div><button type="button" class="btn btn-primary" data-act="sync"><i class="ri-refresh-line"></i> 同步刷新</button></div>' +
          '<div class="filter-card" data-role="filters"></div>' +
          '<div data-role="table"></div>' +
          '<div class="table-footer" data-role="footer"></div>';

        const filterEl = container.querySelector('[data-role="filters"]');
        const tableEl = container.querySelector('[data-role="table"]');
        const footerEl = container.querySelector('[data-role="footer"]');

        function collectFilterState() {
          filters.forEach(function (f) {
            if (f.type === "org") {
              const api = orgFilterApis[f.key];
              filterState[f.key] = api ? api.getValue() : filterState[f.key] || "";
              return;
            }
            const el = filterEl.querySelector('[data-filter="' + f.key + '"]');
            filterState[f.key] = el ? el.value : "";
          });
        }

        function renderFilters() {
          let html = '<div class="filter-row">';
          filters.forEach(function (f) {
            const itemClass =
              "filter-item" + (f.type === "org" ? " filter-item-org" : "");
            html +=
              '<div class="' +
              itemClass +
              '"><label>' +
              escapeHtml(f.label || f.key) +
              "</label>";
            if (f.type === "org") {
              html += orgFilterControlHtml(
                f.key,
                filterState[f.key] || "",
                f.placeholder || "请选择"
              );
            } else if (f.type === "select") {
              html +=
                '<select class="form-control" data-filter="' +
                escapeHtml(f.key) +
                '"><option value="">全部</option>';
              (f.options || []).forEach(function (opt) {
                const ov = typeof opt === "object" ? opt.value : opt;
                const ol = typeof opt === "object" ? opt.label : opt;
                html +=
                  '<option value="' +
                  escapeHtml(ov) +
                  '"' +
                  (String(filterState[f.key]) === String(ov) ? " selected" : "") +
                  ">" +
                  escapeHtml(ol) +
                  "</option>";
              });
              html += "</select>";
            } else {
              html +=
                '<input type="text" class="form-control" data-filter="' +
                escapeHtml(f.key) +
                '" value="' +
                escapeHtml(filterState[f.key] || "") +
                '" placeholder="' +
                escapeHtml(f.placeholder || "请输入") +
                '" />';
            }
            html += "</div>";
          });
          html +=
            '<div class="filter-actions">' +
            '<button type="button" class="btn btn-primary" data-act="query">查询</button>' +
            '<button type="button" class="btn btn-default" data-act="reset">重置</button>' +
            "</div></div>";
          filterEl.innerHTML = html;
          Object.keys(orgFilterApis).forEach(function (k) {
            delete orgFilterApis[k];
          });
          filters.forEach(function (f) {
            if (f.type !== "org") return;
            const wrap = filterEl.querySelector('[data-org-filter="' + f.key + '"]');
            if (!wrap) return;
            orgFilterApis[f.key] = bindOrgFilterControl(wrap, {
              placeholder: f.placeholder || "请选择",
              onChange: function (v) {
                filterState[f.key] = v || "";
              },
            });
          });
          filterEl.querySelector('[data-act="query"]').addEventListener("click", function () {
            collectFilterState();
            pager.page = 1;
            refresh();
          });
          filterEl.querySelector('[data-act="reset"]').addEventListener("click", function () {
            filters.forEach(function (f) {
              filterState[f.key] = f.type === "org" ? currentSessionOrgId() : "";
            });
            pager.page = 1;
            renderFilters();
            refresh();
          });
        }

        function doSync() {
          const now = nowISO();
          const list = getAll(storeKey).map(function (r) {
            return Object.assign({}, r, { syncedAt: now, updatedAt: now });
          });
          storageSet(storeKey, list);
          toast("已同步刷新省级回流数据", "success");
          refresh();
        }

        container.querySelector('[data-act="sync"]').addEventListener("click", doSync);

        function openView(row) {
          const viewRow = Object.assign({}, row, {
            _orgPath: formatOrgPathLabel(row),
            orgName: formatOrgPathLabel(row),
          });
          openDrawer({
            title: "查看 — " + (row.name || row.title || title),
            mode: "view",
            bodyHtml: buildFormHtml(formFields, viewRow, "view"),
          });
        }

        function refresh() {
          let rows = listForPc(storeKey);
          rows = rows.filter(function (row) {
            for (let i = 0; i < filters.length; i++) {
              const f = filters[i];
              const q = filterState[f.key];
              if (q == null || q === "") continue;
              if (f.type === "org") {
                if (!matchOrgFilter(row, q)) return false;
              } else if (f.type === "select") {
                if (String(row[f.key] == null ? "" : row[f.key]) !== String(q)) return false;
              } else {
                const hay = String(row[f.key] == null ? "" : row[f.key]);
                if (hay.indexOf(q) < 0) return false;
              }
            }
            return true;
          });
          const cols = columns.slice().filter(function (c) {
            return c && c.key !== "orgName" && c.key !== "_orgPath";
          });
          cols.push(orgPathColumn(orgColumnTitle, "200px"));
          cols.push({
            title: "数据来源",
            key: "source",
            width: "120px",
            render: function (r) {
              return escapeHtml(r.source || "省级统建回流");
            },
          });
          cols.push({
            title: "同步时间",
            key: "syncedAt",
            width: "140px",
            render: function (r) {
              return escapeHtml(formatDateTime(r.syncedAt));
            },
          });
          const pageInfo = applyPager(rows, pager);
          renderTable(tableEl, {
            columns: cols,
            rows: pageInfo.rows,
            rowActions: function (row) {
              return [
                {
                  label: "查看",
                  onClick: function () {
                    openView(row);
                  },
                },
              ];
            },
          });
          renderPagination(footerEl, pageInfo, function (next) {
            pager.page = next.page;
            pager.pageSize = next.pageSize;
            refresh();
          });
        }

        renderFilters();
        refresh();
      }

    const DEFAULT_ROUTE = "notice-list";
