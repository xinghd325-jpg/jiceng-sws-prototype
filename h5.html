<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="robots" content="noindex, nofollow, noarchive">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>社会工作服务 - 群众端</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1677FF;
      --color-success: #52C41A;
      --color-danger: #FF4D4F;
      --color-border: #E8EEF5;
      --color-bg: #F5F7FB;
      --color-bg-elevated: #FFFFFF;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow-soft: 0 4px 14px rgba(22,119,255,0.07);
      --phone-width: 375px;
      --phone-height: 812px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
      background: #e4e9f0;
      color: rgba(0,0,0,0.88);
      line-height: 1.5;
    }
    #app { min-height: 100vh; padding: 8px 0 24px; }
    a { color: var(--color-primary); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ---- Phone shell ---- */
    .phone {
      width: var(--phone-width);
      height: var(--phone-height);
      margin: 16px auto;
      background: var(--color-bg);
      border: 1px solid #dce3ec;
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(15, 40, 80, 0.12);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .phone-body { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--color-bg); }
    .tabbar {
      height: 52px;
      border-top: 1px solid var(--color-border);
      display: flex;
      background: rgba(255,255,255,0.96);
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }
    .tabbar-item {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: rgba(0,0,0,0.45);
      padding-top: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      user-select: none;
    }
    .tabbar-item i { font-size: 20px; line-height: 1; }
    .tabbar-item.active { color: var(--color-primary); font-weight: 600; }
    .tabbar.hidden { display: none; }

    /* ---- Sub page nav ---- */
    .h5-nav {
      height: 44px;
      background: rgba(255,255,255,0.96);
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(8px);
    }
    .h5-nav-back {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(0,0,0,0.88);
      font-size: 20px;
      flex-shrink: 0;
    }
    .h5-nav-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      margin-right: 36px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- Home layouts A/B/C · visual base = 清新悬浮(风格5) ---- */
    /* 首页：顶部承接 banner 深蓝，向下平滑过渡到页面灰 */
    .home-wrap {
      padding-bottom: 20px;
      min-height: 100%;
      box-sizing: border-box;
      background: linear-gradient(
        180deg,
        #d8e9fc 0%,
        #e2eefc 18%,
        #eef3f9 48%,
        #f5f7fb 72%,
        #f5f7fb 100%
      );
    }
    /* 首页时 phone-body 用同色底，防止内容高度不足时露出硬边灰 */
    .phone-body:has(.home-wrap) {
      background: #f5f7fb;
    }
    .home-hero {
      position: relative;
      overflow: hidden;
      margin: 0;
      min-height: 132px;
      height: 148px;
      padding: 0 0 28px;
      color: #0b3d7a;
      /* 兜底：深蓝 #428CF5 → 浅蓝 #D8E9FC（合成图未加载时） */
      background: linear-gradient(180deg, #428CF5 0%, #D8E9FC 100%);
      isolation: isolate;
    }
    /* 合成 JPG：蓝渐变 + 白色城景线框，直接 background-image，不用 mask */
    .home-hero-banners {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }
    .home-hero-banner {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.55s ease;
      background-color: transparent;
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }
    .home-hero-banner.active {
      opacity: 1;
    }
    .home-hero-mask {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        180deg,
        transparent 0%,
        transparent 78%,
        rgba(216, 233, 252, 0.35) 90%,
        #d8e9fc 100%
      );
      pointer-events: none;
    }

    .home-banner-dots span { background: rgba(255,255,255,0.45); }
    .home-banner-dots span.active { background: #fff; }
    .home-hero-content {
      position: relative;
      z-index: 4;
      padding: 10px 14px 0;
      min-height: 36px;
    }
    /* 仿浙里办：纯文字组织切换，无白底胶囊；右侧预留定位获取 */
    .home-org-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
    }
    .home-org-select {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      max-width: calc(100% - 40px);
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 2px 0;
      box-shadow: none;
      cursor: pointer;
      user-select: none;
    }
    .home-org-select:active { opacity: 0.85; }
    .home-org-select .org-label {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 230px;
      letter-spacing: 0.2px;
      text-shadow: 0 1px 2px rgba(15, 70, 140, 0.25);
    }
    .home-org-select i {
      color: rgba(255, 255, 255, 0.95);
      font-size: 16px;
      flex-shrink: 0;
      text-shadow: 0 1px 2px rgba(15, 70, 140, 0.25);
    }
    .home-org-locate {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      margin: 0;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: none;
      -webkit-tap-highlight-color: transparent;
    }
    .home-org-locate i {
      font-size: 16px;
      line-height: 1;
      text-shadow: 0 1px 2px rgba(15, 70, 140, 0.25);
    }
    .home-org-locate:active { opacity: 0.85; }
    .home-org-locate.locating i {
      animation: org-locate-spin 0.8s linear infinite;
    }
    @keyframes org-locate-spin {
      to { transform: rotate(360deg); }
    }
    .home-banner-dots {
      position: absolute;
      left: 0; right: 0;
      bottom: 32px;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 5px;
      pointer-events: none;
    }
    .home-banner-dots span {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.45);
    }
    .home-banner-dots span.active {
      width: 14px;
      border-radius: 3px;
      background: #fff;
    }
    .home-banner-pick {
      margin: 0 12px 10px;
      padding: 10px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(22,119,255,0.06);
    }
    .home-banner-pick-title {
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      margin-bottom: 8px;
      text-align: center;
    }
    .home-banner-pick-row {
      display: flex;
      gap: 6px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .home-banner-chip {
      min-width: 44px;
      height: 30px;
      padding: 0 10px;
      border-radius: 15px;
      border: 1px solid #d9d9d9;
      background: #fafafa;
      font-size: 12px;
      color: rgba(0,0,0,0.65);
      line-height: 28px;
      text-align: center;
      cursor: pointer;
    }
    .home-banner-chip.active {
      border-color: #1677FF;
      background: #e6f4ff;
      color: #1677FF;
      font-weight: 600;
    }
    .org-picker-mask {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 200;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .org-picker-sheet {
      width: 100%;
      max-width: 375px;
      background: #fff;
      border-radius: 14px 14px 0 0;
      max-height: 72vh;
      overflow: hidden;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    .org-picker-sheet .ops {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #F0F5FF;
      font-size: 14px;
      flex-shrink: 0;
    }
    .org-picker-sheet .ops .cancel { color: rgba(0,0,0,0.45); cursor: pointer; }
    .org-picker-sheet .ops .title { font-weight: 600; }
    .org-picker-sheet .ops .confirm {
      color: #1677FF;
      font-weight: 600;
      cursor: pointer;
    }
    .org-picker-path {
      padding: 8px 16px 10px;
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      border-bottom: 1px solid #F0F5FF;
      flex-shrink: 0;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .org-picker-path strong { color: #1677FF; font-weight: 600; }
    /* 多级列表面板（类似级联下拉） */
    .org-cascade-cols {
      display: flex;
      flex: 1;
      min-height: 300px;
      max-height: 52vh;
      overflow: hidden;
      background: #fff;
    }
    .org-cascade-col {
      flex: 1;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border-right: 1px solid #F0F5FF;
      background: #fafbfc;
    }
    .org-cascade-col:nth-child(2) { background: #fff; }
    .org-cascade-col:nth-child(3) { background: #f7f9fc; }
    .org-cascade-col:nth-child(4) { background: #fff; }
    .org-cascade-col:last-child { border-right: none; }
    .org-cascade-item {
      padding: 12px 10px;
      font-size: 13px;
      line-height: 1.35;
      color: rgba(0,0,0,0.75);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      user-select: none;
    }
    .org-cascade-item .oci-name {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .org-cascade-item i {
      flex-shrink: 0;
      font-size: 16px;
      color: rgba(0,0,0,0.25);
    }
    /* 已选：仅文字变蓝，不用蓝底（避免过于抢眼） */
    .org-cascade-item.active {
      color: #1677FF;
      background: transparent;
      font-weight: 600;
    }
    .org-cascade-item.active i { color: #1677FF; }
    .org-cascade-item:active { background: rgba(0, 0, 0, 0.03); }
    .org-cascade-empty {
      padding: 20px 10px;
      font-size: 12px;
      color: rgba(0,0,0,0.35);
      text-align: center;
    }
    /* 兼容旧扁平列表（若仍有引用） */
    .org-picker-item {
      padding: 13px 16px;
      font-size: 14px;
      border-bottom: 1px solid #F0F5FF;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .org-picker-item.active { color: #1677FF; font-weight: 600; }
    .org-picker-item:active { background: #fafcff; }

    .home-layout-dock {
      margin: 14px 12px 6px;
      padding: 12px;
      background: #fff;
      border-radius: 14px;
      border: 1px dashed #91caff;
    }
    .home-layout-dock-title {
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      margin-bottom: 10px;
      text-align: center;
    }
    .home-layout-dock-title strong { color: #1677FF; }
    .home-layout-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .home-layout-chip {
      min-height: 56px;
      padding: 8px 6px;
      border-radius: 10px;
      border: 1px solid #d9d9d9;
      background: #fafafa;
      font-size: 12px;
      color: rgba(0,0,0,0.65);
      cursor: pointer;
      text-align: center;
      line-height: 1.3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .home-layout-chip .n {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #e6f4ff;
      color: #1677FF;
      font-size: 12px;
      font-weight: 700;
      line-height: 22px;
    }
    .home-layout-chip.active {
      background: #e6f4ff;
      border-color: #1677FF;
      color: #1677FF;
      font-weight: 600;
    }
    .home-layout-chip.active .n { background: #1677FF; color: #fff; }

    .section-card {
      background: #fff;
      margin: 10px 12px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(22,119,255,0.06);
    }
    .section-title {
      padding: 12px 14px 4px;
      font-size: 15px;
      font-weight: 600;
      color: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-title .more {
      font-size: 12px;
      font-weight: 400;
      color: #1677FF;
    }
    .section-sub {
      padding: 0 14px 6px;
      font-size: 12px;
      color: rgba(0,0,0,0.45);
    }

    .grid-menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 4px 8px 14px;
      gap: 2px 0;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px 6px;
      cursor: pointer;
      user-select: none;
    }
    .grid-item:active { opacity: 0.85; }
    .grid-item .grid-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 6px;
    }
    .grid-item .grid-label {
      font-size: 12px;
      text-align: center;
      line-height: 1.3;
      color: rgba(0,0,0,0.75);
    }

    .ic-blue { background: #e8f3ff; color: #1677FF; }
    .ic-cyan { background: #e6fffb; color: #13c2c2; }
    .ic-green { background: #f6ffed; color: #52c41a; }
    .ic-orange { background: #fff7e6; color: #fa8c16; }
    .ic-gold { background: #fffbe6; color: #d48806; }
    .ic-purple { background: #f9f0ff; color: #722ed1; }
    .ic-pink { background: #fff0f6; color: #eb2f96; }
    .ic-red { background: #fff1f0; color: #f5222d; }
    .ic-teal { background: #e6fffb; color: #08979c; }
    .ic-indigo { background: #f0f5ff; color: #2f54eb; }
    .ic-volcano { background: #fff2e8; color: #fa541c; }
    .ic-geek { background: #f0f5ff; color: #1d39c4; }

    .service-hint {
      margin: 2px 16px 6px;
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      text-align: center;
    }
    .service-hint a { color: #1677FF; }

    .home-float {
      /* 入口卡片上探叠在 banner 下沿；叠在同色蓝底上，避免灰/蓝断层 */
      margin: -24px 12px 10px;
      background: #fff;
      border-radius: 16px;
      padding: 10px 8px 8px;
      box-shadow: 0 6px 18px rgba(22, 119, 255, 0.08);
      position: relative;
      z-index: 2;
    }
    /* 首页区块卡片在渐变底上更轻，底部区域自然落到灰底 */
    .home-wrap .section-card {
      box-shadow: 0 2px 12px rgba(22, 119, 255, 0.05);
    }
    .home-float .section-title {
      padding: 4px 8px 0;
    }
    .home-float .grid-menu { padding-bottom: 6px; }

    .hot-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 8px 12px 12px;
    }
    .hot-card {
      border-radius: 10px;
      padding: 12px 10px;
      cursor: pointer;
      min-height: 64px;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
    }
    .hot-card:active { opacity: 0.9; }
    .hot-card .hc-icon {
      width: 34px; height: 34px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
      background: rgba(255,255,255,0.75);
      margin-bottom: 0;
      flex-shrink: 0;
    }
    .hot-card .hc-text { min-width: 0; flex: 1; }
    .hot-card .hc-title { font-size: 13px; font-weight: 600; color: rgba(0,0,0,0.88); line-height: 1.3; }
    .hot-card .hc-desc { display: none; }

    /* 更多服务：一行 5 入口 */
    .grid-menu.grid-5 {
      grid-template-columns: repeat(5, 1fr);
      padding: 6px 4px 12px;
    }
    .grid-menu.grid-5 .grid-item { padding: 8px 2px 4px; }
    .grid-menu.grid-5 .grid-icon {
      width: 42px;
      height: 42px;
      font-size: 20px;
      margin-bottom: 4px;
    }
    .grid-menu.grid-5 .grid-label {
      font-size: 11px;
      transform: scale(0.96);
    }
    .hot-card.hc-blue { background: linear-gradient(145deg, #e8f3ff, #f5faff); }
    .hot-card.hc-blue .hc-icon { color: #1677FF; }
    .hot-card.hc-purple { background: linear-gradient(145deg, #f5edff, #fbf7ff); }
    .hot-card.hc-purple .hc-icon { color: #722ed1; }
    .hot-card.hc-green { background: linear-gradient(145deg, #f0ffeb, #f8fff5); }
    .hot-card.hc-green .hc-icon { color: #52c41a; }
    .hot-card.hc-orange { background: linear-gradient(145deg, #fff7e8, #fffaf2); }
    .hot-card.hc-orange .hc-icon { color: #fa8c16; }
    .hot-card.hc-red { background: linear-gradient(145deg, #fff1f0, #fff8f7); }
    .hot-card.hc-red .hc-icon { color: #f5222d; }
    .hot-card.hc-cyan { background: linear-gradient(145deg, #e6fffb, #f2fffd); }
    .hot-card.hc-cyan .hc-icon { color: #13c2c2; }

    .duo-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: -22px 12px 10px;
      position: relative;
      z-index: 2;
    }
    .duo-card {
      border-radius: 14px;
      padding: 14px 12px 16px;
      min-height: 110px;
      box-shadow: 0 8px 22px rgba(22,119,255,0.12);
      cursor: pointer;
      color: #fff;
    }
    .duo-card:active { opacity: 0.92; }
    .duo-card .dc-icon { font-size: 24px; margin-bottom: 10px; opacity: 0.95; }
    .duo-card .dc-title { font-size: 16px; font-weight: 700; }
    .duo-card .dc-desc { font-size: 11px; opacity: 0.9; margin-top: 6px; line-height: 1.4; }
    .duo-card.dc-assist { background: linear-gradient(145deg, #ff7875, #f5222d); }
    .duo-card.dc-suggest { background: linear-gradient(145deg, #9254de, #722ed1); }

    .act-scroll {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 8px 12px 14px;
      -webkit-overflow-scrolling: touch;
    }
    .act-scroll::-webkit-scrollbar { display: none; }
    .act-card {
      flex: 0 0 72%;
      max-width: 260px;
      background: linear-gradient(145deg, #f0f7ff, #fff);
      border: 1px solid #e6f0ff;
      border-radius: 12px;
      padding: 12px;
      cursor: pointer;
    }
    .act-card:active { opacity: 0.9; }
    .act-card .ac-tag {
      display: inline-block;
      font-size: 11px;
      color: #1677FF;
      background: #e6f4ff;
      border-radius: 4px;
      padding: 1px 6px;
      margin-bottom: 8px;
    }
    .act-card .ac-title {
      font-size: 14px;
      font-weight: 600;
      color: rgba(0,0,0,0.88);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 38px;
    }
    .act-card .ac-meta {
      margin-top: 8px;
      font-size: 11px;
      color: rgba(0,0,0,0.45);
    }

    .notice-list { padding: 0 0 8px; }
    .notice-row {

    /* ---- Toast ---- */

    function isH5PublicContentStatus(status, moduleKey, record) {
      const s = status || "";
      // 议题：已结束仍可见（结果公示/讨论记录）；未上架或未到期就下架的不展示
      if (moduleKey === KEYS.topics) {
        if (s === "draft" || s === "unpublished" || s === "scheduled") return false;
        if (
          s === "published" ||
          s === "open" ||
          s === "discussing" ||
          s === "voting" ||
          s === "closed" ||
          s === "ended"
        ) {
          return true;
        }
        if (s === "offline") {
          const end = record && (record.endAt || record.voteEnd);
          if (end) {
            const t = Date.parse(end);
            if (!isNaN(t) && t <= Date.now()) return true;
          }
          return false;
        }
        return false;
      }
      if (
        s === "draft" ||
        s === "unpublished" ||
        s === "scheduled" ||
        s === "offline"
      ) {
        return false;
      }
      if (moduleKey === KEYS.activities) {
        return s === "published" || s === "ended" || s === "open";
      }
      return s === "published" || s === "open";
    }

    let _h5LastPromoteAt = 0;
    function promoteDuePublishes() {
      const now = Date.now();
      if (now - _h5LastPromoteAt < 3000) return;
      _h5LastPromoteAt = now;
      const nowIso = nowISO();
      const keys = [
        KEYS.notices,
        KEYS.activities,
        KEYS.affairs,
        KEYS.serviceItems,
        KEYS.facilities,
        KEYS.forces,
        KEYS.aidPolicies,
        KEYS.foundations,
        KEYS.surveys,
        KEYS.collectCampaigns,
        KEYS.topics,
      ];
      keys.forEach(function (fullKey) {
        const list = getAll(fullKey);
        if (!list || !list.length) return;
        let dirty = false;
        list.forEach(function (r) {
          if (!r || r.deleted) return;
          if (r.status === "ended" || r.status === "closed") {
            if (fullKey === KEYS.topics) return;
            r.status = "offline";
            dirty = true;
            return;
          }
          if (r.status === "draft" || r.status === "scheduled") {
            r.status = "unpublished";
            dirty = true;
          }
          if (r.status === "open") {
            r.status = "published";
            dirty = true;
          }
          const endRaw = r.endAt || r.voteEnd;
          const ended =
            !!endRaw && !isNaN(Date.parse(endRaw)) && Date.parse(endRaw) <= now;
          if (r.status === "unpublished" && r.publishAt) {
            const t = new Date(r.publishAt).getTime();
            if (!isNaN(t) && t <= now) {
              if (ended) {
                r.status = fullKey === KEYS.topics ? "closed" : "offline";
                if (r.status === "offline") r.actualOfflineAt = nowIso;
              } else {
                r.status = "published";
                if (!r.actualPublishAt) r.actualPublishAt = nowIso;
              }
              dirty = true;
            }
          }
          if (
            fullKey === KEYS.topics &&
            (r.status === "published" ||
              r.status === "discussing" ||
              r.status === "voting" ||
              r.status === "open") &&
            ended
          ) {
            r.status = "closed";
            dirty = true;
          }
        });
        if (dirty) storageSet(fullKey, list);
      });
    }

    function listForH5(moduleKey) {
      promoteDuePublishes();
      const session = getH5Session();
      if (!session) return [];
      const orgId = session.orgId;
      const userId = session.userId;
      const userOrg = getOrg(orgId);
      const path = userOrg ? (userOrg.path || []) : [];
      const all = getAll(moduleKey).filter((r) => !r.deleted);
      const rule = VISIBILITY[moduleKey];
      const cityWide = isH5CityWideView(session);

      // 我的提交类：仍看自己的全部状态（含处理中），不按公开状态过滤
      if (rule === "self") {
        return all.filter((r) => r.userId === userId);
      }

      // 公开内容：统一过滤草稿 / 定时上架 / 已下架
      const publicAll = all.filter(function (r) {
        return isH5PublicContentStatus(r.status, moduleKey, r);
      });

      if (rule === "upward") {
        // 市级：全市已发布；区/街道/社区：本级及上级发布
        if (cityWide) return publicAll;
        return publicAll.filter((r) => path.includes(r.orgId));
      }
      if (rule === "village") {
        if (cityWide) return publicAll;
        var villageIds = villageScopeOrgIds(orgId);
        return publicAll.filter((r) => villageIds.indexOf(r.orgId) >= 0);
      }
      if (rule === "scope") {
        if (cityWide) return publicAll;
        return publicAll.filter((r) => scopeMatchesUser(r, orgId, path));
      }
      if (cityWide) return publicAll;
      return publicAll;
    }

          h5Route = prev.route;

          for (let i = 0; i < fields.length; i++) {

    function sanitizeRichHtml(html) {
      var wrap = document.createElement("div");
      wrap.innerHTML = String(html || "");
      var allowed = {
        P: 1, BR: 1, DIV: 1, SPAN: 1, B: 1, STRONG: 1, I: 1, EM: 1, U: 1,
        UL: 1, OL: 1, LI: 1, H2: 1, H3: 1, H4: 1, BLOCKQUOTE: 1, A: 1, IMG: 1,
      };
      function walk(node) {
        Array.prototype.slice.call(node.childNodes).forEach(function (child) {
          if (child.nodeType !== 1) return;
          if (!allowed[child.tagName]) {
            while (child.firstChild) node.insertBefore(child.firstChild, child);
            node.removeChild(child);
            return;
          }
          Array.prototype.slice.call(child.attributes || []).forEach(function (attr) {
            var n = String(attr.name || "").toLowerCase();
            if (n === "href" || n === "src" || n === "alt" || n === "target") {
              if (/^\s*javascript:/i.test(attr.value || "")) child.removeAttribute(attr.name);
              return;
            }
            child.removeAttribute(attr.name);
          });
          walk(child);
        });
      }
      walk(wrap);
      return wrap.innerHTML;
    }

    function clipText(s, maxLen) {
      var t = String(s || "");
      if (looksLikeHtml(t)) {
        var d = document.createElement("div");
        d.innerHTML = t;

      }
      t = t.replace(/\s+/g, " ").trim();
      if (maxLen && t.length > maxLen) t = t.slice(0, maxLen) + "…";
      return t;
    }

      if (item.status === "closed" || item.status === "ended" || item.status === "offline") return true;
      if (item.endAt) {
        var t = Date.parse(item.endAt);
        if (!isNaN(t) && t < Date.now()) return true;

    /** 征集 / 问卷当前是否可填报（已开始且未结束） */
    function isPeriodOpen(item) {
      if (!item || isPeriodEnded(item)) return false;

        if (!isNaN(s) && Date.now() < s) return false;

    function topicPhaseOf(topic) {
      if (!topic) return "";
      const st = String(topic.status || "");
      if (st === "closed" || st === "offline" || st === "ended") return "closed";
      if (st === "unpublished" || st === "draft" || st === "scheduled") return "";
      const end = topic.endAt || topic.voteEnd;
      if (end) {
        const t = Date.parse(end);
        if (!isNaN(t) && t <= Date.now()) return "closed";
      }
      if (st === "discussing") return "discussing";
      if (st === "voting") return "voting";
      if (st === "published" || st === "open") {
        return topic.type === "vote" ? "voting" : "discussing";

    function compressImageFile(file, cb) {
      if (!file || !file.type || file.type.indexOf("image/") !== 0) {
        cb(null);
        return;
      }
      var reader = new FileReader();
      reader.onload = function (e) {
        var img = new Image();
        img.onload = function () {
          try {
            var maxW = 1280;
            var w = img.width;
            var h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            var canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            var ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            cb(canvas.toDataURL("image/jpeg", 0.72));
          } catch (err) {
            cb(e.target.result);
          }
        };
        img.onerror = function () { cb(null); };
        img.src = e.target.result;
      };
      reader.onerror = function () { cb(null); };
      reader.readAsDataURL(file);
    }

      var district = def.district === "all" ? "" : def.district || "";
      var town = def.town === "all" ? "" : def.town || "";
      var village = def.village === "all" ? "" : def.village || "";
      // 会话未到村社时，若居民档案村社属于当前街道，则补全
      if (!village) {
        var session = getH5Session() || {};
        var resident = getAll(KEYS.residents).find(function (r) {
          return r.id === session.userId;

        if (resident && resident.orgId) {

          if (v && v.level === "village") {
            var t = getOrg(v.parentId);
            if (t && t.level === "town" && (!town || town === t.id)) {
              village = v.id;
              town = t.id;
              if (!district && t.parentId) district = t.parentId;

      return { district: district, town: town, village: village };
    }

        else if (_assistFormOrg.district && t.parentId !== _assistFormOrg.district) {

    /** 展示用：11 位手机号中间四位打码，如 138****1001 */
    function maskPhone(phone) {
      var p = String(phone || "").replace(/[\s\-]/g, "");
      if (!p) return "-";
      if (/^1\d{10}$/.test(p)) return p.slice(0, 3) + "****" + p.slice(7);
      if (p.length >= 7) return p.slice(0, 3) + "****" + p.slice(-4);
      return p;
    }

    /** 演示脱敏号还原为完整手机号（帮扶申请联系方式不脱敏） */
    function toPlainPhone(phone) {
      var p = String(phone || "").replace(/[\s\-]/g, "");
      if (!p) return "";
      if (/^1\d{10}$/.test(p)) return p;
      // 兼容旧演示数据：138****1001 → 13805781001（中间补 0578 风格样例号）
      var m = p.match(/^(1\d{2})\*{4}(\d{4})$/);
      if (m) return m[1] + "0578" + m[2];
      return p.replace(/\*/g, "0");
    }

        escapeHtml(title) +
        '</div><div class="detail-imgs">';
      images.forEach(function (img, idx) {
        var src = typeof img === "string" ? img : img.dataUrl || img.url || "";
        if (!src) return;
        html +=
          '<img src="' +
          src +
          '" alt="图片' +
          (idx + 1) +
          '" data-preview-img="' +
          idx +
          '" data-preview-list="1" />';
      });
      html += "</div></div>";
      return html;
    }

    /** 所在地区展示：区县 / 街道 / 村社（与申请表一致） */
    function formatAssistArea(app) {
      if (!app) return "";
      var parts = [app.districtName, app.townName, app.orgName].filter(Boolean);
      if (parts.length) return parts.join(" / ");
      return displayOrgLabel(app) || "";
    }

    /** 列表主标题：优先申请类型（表单字段），兼容旧数据 title */
    function getAssistListTitle(app) {
      if (!app) return "帮扶申请";
      if (app.type) return app.type;
      return app.title || "帮扶申请";
    }

    function getAssistContent(app) {
      if (!app) return "";
      return app.content || app.reason || "";
    }

    function renderSuggestionTimeline(s) {
      var finished = isSuggestFinished(s);
      var handled = isSuggestHandled(s);
      var handleTime = s.handleAt || (handled ? s.updatedAt : "");
      var handleDept = s.handleDept || s.handleOrg || "";
      var handleReply = s.handleReply || s.handleRemark || "";

      var html =
        '<div class="h5-section"><div class="h5-section-title">办理节点</div><div class="sug-timeline">';

      // 节点1：提交
      html +=
        '<div class="sug-node done">' +
        '<div class="sug-dot"></div>' +
        '<div class="sug-node-body">' +
        '<div class="sug-node-title">提交</div>' +
        '<div class="sug-node-fields">' +
        '<div><span class="k">提交时间</span>' +
        escapeHtml(formatDate(s.createdAt) || "-") +
        "</div></div></div></div>";

      // 节点2：办理
      if (finished || handled) {
        html +=
          '<div class="sug-node ' +
          (finished ? "done" : "current") +
          '">' +
          '<div class="sug-dot"></div>' +
          '<div class="sug-node-body">' +
          '<div class="sug-node-title">办理</div>' +
          '<div class="sug-node-fields">' +
          '<div><span class="k">办理时间</span>' +
          escapeHtml(formatDate(handleTime) || "-") +
          "</div>" +
          '<div><span class="k">办理部门</span>' +
          escapeHtml(handleDept || "-") +
          "</div>" +
          '<div class="reply"><span class="k">办理回复</span><br/>' +
          escapeHtml(handleReply || "暂无回复内容") +
          "</div></div></div></div>";
      } else {
        html +=
          '<div class="sug-node pending">' +
          '<div class="sug-dot"></div>' +
          '<div class="sug-node-body">' +
          '<div class="sug-node-title">办理</div>' +
          '<div class="sug-node-fields">' +
          '<div><span class="k">办理时间</span>待办理</div>' +
          '<div><span class="k">办理部门</span>-</div>' +
          '<div class="reply"><span class="k">办理回复</span><br/>暂无</div>' +
          "</div></div></div>";
      }

      html += "</div></div>";
      return html;
    }

    function suggestListTitle(s) {
      var t = ((s && (s.content || s.title)) || "建议").replace(/\s+/g, " ").trim();
      if (!t) t = "建议";
      return t.length > 28 ? t.slice(0, 28) + "…" : t;
    }

    function renderSuggestionDetail(s) {
      if (!s) return emptyList("记录不存在");
      const session = getH5Session() || {};
      if (s.userId && s.userId !== session.userId) return emptyList("无权查看");
      h5NavTitle = "建议线索详情";
      const st = SUGGEST_STATUS(s.status);
      const camp = s.campaignId ? getById(KEYS.collectCampaigns, s.campaignId) : null;
      let meta =
        statusTag(st[0], st[1]) +
        " · " +
        escapeHtml(displayOrgLabel(s));
      if (camp) meta += "<br/>关联征集：" + escapeHtml(camp.title || "");
      const extra = renderSuggestionImages(s.images) + renderSuggestionTimeline(s);
      return detailShell("建议线索", meta, s.content || "", extra, "");
    }

    function getAssistProgressText(app) {
      if (app.progressText) return app.progressText;
      const st = app.status;
      var town = app.townName || "乡镇";
      if (st === "submitted") return "已提交，待" + town + "综合信息指挥室受理";
      if (st === "rejected") return "中心不予受理" + (app.rejectReason ? "：" + app.rejectReason : "");
      if (st === "assigned") return "已受理并指派" + (app.deptName || "部门") + "，待部门审核";
      if (st === "returned")
        return "已退回申请人" + (app.returnReason ? "：" + app.returnReason : "") + "（已结束）";
      if (st === "completed") return "部门审核通过，已办结";
      return "";
    }

    /** 受理中、审核中不展示进度说明（节点文案已足够） */
    function shouldShowAssistProgressText(app) {
      var st = (app && app.status) || "";
      return st !== "submitted" && st !== "assigned";
    }

    function getAssistHandleOrg(app) {
      if (app.handleOrgName) return app.handleOrgName;
      var prefix = (app.districtName || "") + (app.townName || "");
      if (!prefix) prefix = app.townName || "乡镇";
      if ((app.status === "assigned" || app.status === "completed" || app.status === "returned") && app.deptName) {
        return prefix + app.deptName;
      }
      return prefix + "综合信息指挥室";
    }

    /**
     * 进度节点：提交 → 受理 → 审核 → 办结
     * 退回申请：提交 → 受理 → 已退回 → 办结（办结节点为空/未点亮）
     */
    function renderAssistStepsHtml(app) {
      const st = app.status || "submitted";
      const steps = [
        { key: "submit", label: "提交" },
        { key: "accept", label: "受理" },
        { key: "audit", label: "审核" },
        { key: "finish", label: "办结" },
      ];
      let states = ["done", "pending", "pending", "pending"];
      if (st === "submitted") {
        states = ["done", "current", "pending", "pending"];
        steps[1].label = "受理中";
      } else if (st === "rejected") {
        // 中心不予受理：停在受理节点
        states = ["done", "fail", "pending", "pending"];
        steps[1].label = "不予受理";
      } else if (st === "assigned") {
        // 已受理并进入部门审核
        states = ["done", "done", "current", "pending"];
        steps[2].label = "审核中";
      } else if (st === "returned") {
        // 退回申请人：提交、受理、已退回、办结（办结节点为空/不点亮）
        states = ["done", "done", "fail", "empty"];
        steps[2].label = "已退回";
        steps[3].label = "办结";
      } else if (st === "completed") {
        states = ["done", "done", "done", "done"];
      }
      let stepsHtml = '<div class="assist-steps">';
      steps.forEach(function (s, i) {
        var stCls = states[i] || "pending";
        stepsHtml +=
          '<div class="assist-step ' +
          stCls +
          '">' +
          '<div class="assist-dot"></div>' +
          "<div>" +
          escapeHtml(s.label || "") +
          "</div>" +
          "</div>";
      });
      stepsHtml += "</div>";
      return stepsHtml;
    }

    /**
     * 列表卡：主信息对齐申请表字段（类型/说明/地区/联系方式）+ 四步进度摘要
     */
    function renderAssistProgressCard(app) {
      const progressText = getAssistProgressText(app);
      const showProgress = shouldShowAssistProgressText(app) && !!progressText;
      const handleOrg = getAssistHandleOrg(app);
      const area = formatAssistArea(app);
      const content = getAssistContent(app);
      const phone = toPlainPhone(app.phone || "");
      return (
        '<div class="assist-card">' +
        '<div class="assist-card-title">' +
        escapeHtml(getAssistListTitle(app)) +
        "</div>" +
        renderAssistStepsHtml(app) +
        '<div class="assist-info">' +
        (area
          ? '<div class="assist-info-row"><span class="label">所在地区：</span><span class="val">' +
            escapeHtml(area) +
            "</span></div>"
          : "") +
        (phone
          ? '<div class="assist-info-row"><span class="label">联系方式：</span><span class="val">' +
            escapeHtml(phone) +
            "</span></div>"
          : "") +
        (content
          ? '<div class="assist-info-row"><span class="label">申请说明：</span><span class="val clamp-2">' +
            escapeHtml(content) +
            "</span></div>"
          : "") +
        (app.images && app.images.length
          ? '<div class="assist-info-row"><span class="label">附件：</span><span class="val">' +
            app.images.length +
            " 张</span></div>"
          : "") +
        '<div class="assist-info-row"><span class="label">办理单位：</span><span class="val">' +
        escapeHtml(handleOrg) +
        "</span></div>" +
        (showProgress
          ? '<div class="assist-info-row"><span class="label">进度说明：</span><span class="val">' +
            escapeHtml(progressText) +
            "</span></div>"
          : "") +
        '<div class="assist-info-row"><span class="label">申报时间：</span><span class="val">' +
        escapeHtml(formatDate(app.createdAt)) +
        "</span></div>" +
        "</div></div>"
      );
    }

    /** 详情：申请信息字段与申请表一一对应 + 办理进度 */
    function renderAssistApplicationDetail(app) {
      const area = formatAssistArea(app);
      const content = getAssistContent(app);
      const phone = toPlainPhone(app.phone || "");
      const progressText = getAssistProgressText(app);
      const showProgress = shouldShowAssistProgressText(app) && !!progressText;
      const handleOrg = getAssistHandleOrg(app);

      let html = '<div class="h5-detail">';

      // 办理进度（步骤条）
      html +=
        '<div class="assist-card" style="margin-bottom:0">' +
        '<div class="assist-card-title">办理进度</div>' +
        renderAssistStepsHtml(app) +
        '<div class="assist-info">' +
        '<div class="assist-info-row"><span class="label">办理单位：</span><span class="val">' +
        escapeHtml(handleOrg) +
        "</span></div>" +
        (showProgress
          ? '<div class="assist-info-row"><span class="label">进度说明：</span><span class="val">' +
            escapeHtml(progressText) +
            "</span></div>"
          : "") +
        '<div class="assist-info-row"><span class="label">申报时间：</span><span class="val">' +
        escapeHtml(formatDate(app.createdAt)) +
        "</span></div>" +
        "</div></div>";

      // 申请信息（与表单字段对齐）
      html +=
        '<div class="h5-section"><div class="h5-section-title">申请信息</div>' +
        '<div class="assist-detail-kv">' +
        '<div class="row"><span class="k">申请人</span><span class="v">' +
        escapeHtml(app.userName || "-") +
        "</span></div>" +
        '<div class="row"><span class="k">联系方式</span><span class="v">' +
        escapeHtml(phone || "-") +
        "</span></div>" +
        '<div class="row"><span class="k">所在地区</span><span class="v">' +
        escapeHtml(area || "-") +
        "</span></div>" +
        '<div class="row"><span class="k">申请类型</span><span class="v">' +
        escapeHtml(app.type || "-") +
        "</span></div>" +
        '<div class="row"><span class="k">申请说明</span><span class="v">' +

      html += renderSuggestionImages(app.images || [], "附件");

    /* ---------- Business pages ---------- */
    function pageNotices() {
      if (h5Params.id) {
        const item = getPublicContentById(KEYS.notices, h5Params.id);
        if (!item) return emptyList("通知不存在");
        h5NavTitle = "通知详情";
        return detailShell(
          item.title,
          escapeHtml(displayOrgLabel(item) || "发布单位") + " · " + escapeHtml(formatDate(item.publishAt || item.updatedAt)),
          item.content || ""
        );
      }
      const route = "home/notices";
      const kw = ((h5UiState[route] && h5UiState[route].kw) || "").trim();
      let list = sortByTimeDesc(listForH5(KEYS.notices), ["publishAt", "updatedAt", "createdAt"]);
      if (kw) {
        list = list.filter(function (n) {
          return (
            String(n.title || "").indexOf(kw) >= 0 ||
            String(n.content || "").replace(/<[^>]+>/g, "").indexOf(kw) >= 0
          );
        });
      }
      let html =
        '<div class="search-box"><i class="ri-search-line"></i><input id="ntc-search" placeholder="搜索标题或内容" value="' +
        escapeHtml(kw) +
        '" /></div>';
      html += '<div class="h5-list">';
      if (!list.length) html += emptyList(kw ? "未找到相关通知" : "暂无通知公告");
      list.forEach(function (n) {
        html += listCard({
          title: n.title,
          desc: n.content,
          path: "home/notices",
          id: n.id,
          metaHtml:
            statusTag(displayOrgLabel(n) || "发布单位", "primary") +
            "<span>" +
            escapeHtml(formatDate(n.publishAt || n.updatedAt)) +
            "</span>",
        });
      });
      html += "</div>";
      return html;
    }

    function isActivityEnded(a) {
      if (!a) return true;
      if (a.status === "ended" || a.status === "offline") return true;
      if (a.endAt) {
        var t = Date.parse(a.endAt);
        if (!isNaN(t) && t < Date.now()) return true;
      }
      return false;
    }

    function isOnlineSignupEnabled(a) {
      if (!a) return false;
      return a.onlineSignup !== false && a.onlineSignup !== "false";
    }

    function activitySignupCount(activityId) {
      return getAll(KEYS.activitySignups).filter(function (x) {
        return x && !x.deleted && x.activityId === activityId;
      }).length;
    }
    function isActivitySignupFull(a) {
      if (!a || a.maxSignups == null || a.maxSignups === "") return false;
      var cap = Number(a.maxSignups);
      if (isNaN(cap) || cap <= 0) return false;
      return activitySignupCount(a.id) >= cap;
    }
    function isActivitySignupOpen(a) {
      if (!a || isActivityEnded(a) || a.status !== "published") return false;
      if (!isOnlineSignupEnabled(a)) return false;
      if (isActivitySignupFull(a)) return false;
      var now = Date.now();
      if (a.signupStart) {
        var s = Date.parse(a.signupStart);
        if (!isNaN(s) && now < s) return false;
      }
      if (a.signupEnd) {
        var e = Date.parse(a.signupEnd);
        if (!isNaN(e) && now > e) return false;
      }
      return true;
    }

    function pageActivities() {
      if (h5Params.id) {
        const item = getPublicContentById(KEYS.activities, h5Params.id);
        if (!item) return emptyList("活动不存在");
        h5NavTitle = "活动详情";
        const signup = getMyActivitySignup(item.id);
        const signed = !!signup;
        const ended = isActivityEnded(item);
        const signupOpen = isActivitySignupOpen(item);
        const onlineSignup = isOnlineSignupEnabled(item);
        const meta =
          escapeHtml(displayOrgLabel(item)) +
          " · " + escapeHtml(item.place || "") +
          (onlineSignup
            ? "<br/>报名 " + escapeHtml(formatDate(item.signupStart)) + " 至 " + escapeHtml(formatDate(item.signupEnd))
            : "") +
          "<br/>活动 " + escapeHtml(formatDate(item.startAt)) + " 至 " + escapeHtml(formatDate(item.endAt));
        let footer = "";
        let extra = signed ? renderMyActivitySignupBlock(item, signup) : "";
        if (signed) {
          footer = '<button type="button" class="btn-primary" disabled>已报名</button>';
        } else if (ended) {
          footer = '<button type="button" class="btn-primary" disabled>活动已结束</button>';
        } else if (!onlineSignup) {
          extra =
            '<div class="h5-section"><div class="h5-section-title">报名信息</div>本活动不支持在线报名，请按活动说明到现场参加。</div>' +
            extra;
        } else if (isActivitySignupFull(item)) {
          footer = '<button type="button" class="btn-primary" disabled>报名人数已满</button>';
        } else if (!signupOpen) {
          footer = '<button type="button" class="btn-primary" disabled>报名已截止</button>';
        } else {
          // 按后台配置的报名表单字段渲染
          var fields = (item.formFields && item.formFields.length)
            ? item.formFields
            : [
                { id: "userName", type: "text", label: "姓名", required: true },
                { id: "phone", type: "phone", label: "手机号", required: true },
              ];
          var formHtml = '<div class="h5-section"><div class="h5-section-title">报名信息</div>';
          var session0 = getH5Session() || {};
          var resident0 = getAll(KEYS.residents).find(function (r) {
            return r.id === session0.userId;
          });
          fields.forEach(function (f) {
            var def = "";
            if (f.id === "userName") def = session0.userName || "";
            if (f.id === "phone") def = (resident0 && resident0.phone) || "";
            formHtml +=
              '<div class="form-item"><label class="form-label">' +
              (f.required ? '<span class="req">*</span>' : "") +
              escapeHtml(f.label || f.id) +
              "</label>";
            if (f.type === "textarea") {
              formHtml +=
                '<textarea class="form-textarea" data-signup-field="' +
                escapeHtml(f.id) +
                '" rows="3" placeholder="请输入' +
                escapeHtml(f.label || "") +
                '"></textarea>';
            } else if (f.type === "select") {
              formHtml +=
                '<select class="form-select" data-signup-field="' +
                escapeHtml(f.id) +
                '"><option value="">请选择</option>';
              (f.options || []).forEach(function (op) {
                formHtml +=
                  '<option value="' +
                  escapeHtml(op) +
                  '">' +
                  escapeHtml(op) +
                  "</option>";
              });
              formHtml += "</select>";
            } else {
              formHtml +=
                '<input class="form-input" data-signup-field="' +
                escapeHtml(f.id) +
                '" type="' +
                (f.type === "phone" ? "tel" : f.type === "number" ? "number" : "text") +
                '" placeholder="请输入' +
                escapeHtml(f.label || "") +
                '" value="' +
                escapeHtml(def) +
                '" />';
            }
            formHtml += "</div>";
          });
          formHtml += "</div>";
          extra = formHtml + extra;
          footer =
            '<button type="button" class="btn-primary" id="btn-activity-signup" data-activity-id="' +
            escapeHtml(item.id) +
            '">立即报名</button>';
        }
        return detailShell(item.title, meta, item.content || "", extra, footer);
      }

      // 活动：E 杂志卡 + 进行中 / 已结束
      const route = "home/activities";
      const tab = getListFilter(route, "tab", "ongoing");
      const all = sortByTimeDesc(listForH5(KEYS.activities), ["startAt", "publishAt", "updatedAt"]);
      const list = all.filter(function (a) {
        return tab === "ended" ? isActivityEnded(a) : !isActivityEnded(a);
      });

      let html = renderSegmentTabs(
        route,
        "tab",
        [
          { k: "ongoing", l: "进行中" },
          { k: "ended", l: "已结束" },
        ],
        tab
      );
      html += '<div class="h5-list-E">';
      if (!list.length) {
        html += emptyList(tab === "ended" ? "暂无已结束活动" : "暂无进行中的活动");
      }
      list.forEach(function (a) {
        const signed = hasSignedActivity(a.id);
        const ended = isActivityEnded(a);
        const signupOpen = isActivitySignupOpen(a);
        const place = a.place || "";
        let statusLabel = "进行中";
        let footHtml = '查看详情 <i class="ri-arrow-right-s-line"></i>';
        let footDone = false;
        if (ended) {
          statusLabel = "已结束";
        } else if (signed) {
          statusLabel = "已报名";
          footHtml = '<i class="ri-checkbox-circle-line"></i> 已报名';
          footDone = true;
        } else if (!isOnlineSignupEnabled(a)) {
          statusLabel = "进行中";
        } else if (signupOpen) {
          statusLabel = "报名中";
          footHtml = '立即报名 <i class="ri-arrow-right-s-line"></i>';
        } else {
          statusLabel = "报名截止";
        }
        html += listCardE({
          title: a.title,
          desc: a.content,
          path: "home/activities",
          id: a.id,
          isTop: false,
          date: formatDate(a.startAt),
          pillHtml: escapeHtml(statusLabel + (place ? " · " + place : "")),
          footHtml: footHtml,
          footDone: footDone,
        });
      });
      html += "</div>";
      return html;
    }

    /** 三务公开列表数据：区县/街道可看下级村社，市级可看全市 */
    function listAffairsForH5() {
      const session = getH5Session();
      if (!session) return [];
      if (isH5CityWideView(session)) {
        return getAll(KEYS.affairs).filter(function (r) {
          return !r.deleted && r.status === "published";
        });
      }
      const org = getOrg(session.orgId);
      if (!org) return listForH5(KEYS.affairs);
      if (org.level === "district" || org.level === "town") {
        const ids = new Set(getOrgDescendants(session.orgId));
        return getAll(KEYS.affairs).filter(function (r) {
          return !r.deleted && r.status === "published" && ids.has(r.orgId);
        });
      }
      return listForH5(KEYS.affairs);
    }

    /** 当前组织层级：city / district / town / village */
    function getSessionOrgLevel() {
      var session = getH5Session() || {};
      var org = getOrg(session.orgId);
      return (org && org.level) || "city";
    }

    /**
     * 可筛维度（按当前组织锁定上级）：
     * - 市级：区县 + 乡镇 + 村社
     * - 区县：乡镇 + 村社（区县锁定）
     * - 乡镇：仅村社（区县/乡镇锁定）
     * - 村社：无组织筛选（三级均锁定）
     */
    function getAffairsFilterAbility() {
      var level = getSessionOrgLevel();
      return {
        level: level,
        canDistrict: level === "city",
        canTown: level === "city" || level === "district",
        canVillage: level === "city" || level === "district" || level === "town",
      };
    }

    /** 根据当前登录组织，解析默认/锁定的区县/乡镇/村社 */
    function getAffairsOrgFilterDefaults() {
      var session = getH5Session() || {};
      var org = getOrg(session.orgId);
      if (!org || org.level === "city") {
        return { district: "all", town: "all", village: "all" };
      }
      if (org.level === "district") {
        return { district: org.id, town: "all", village: "all" };
      }
      if (org.level === "town") {
        return {
          district: org.parentId || "all",
          town: org.id,
          village: "all",
        };
      }
      // village
      var town = getOrg(org.parentId);
      return {
        district: (town && town.parentId) || "all",
        town: org.parentId || "all",
        village: org.id,
      };
    }

    /**
     * 三务筛选与当前组织联动：
     * - 切换组织后自动带入并锁定上级
     * - 不可筛选的层级强制为当前组织对应值
     * - 可筛选层级做级联校验
     */
    function ensureAffairsOrgFilters(route) {
      route = route || "home/affairs";
      h5UiState[route] = h5UiState[route] || {};
      var st = h5UiState[route];
      var session = getH5Session() || {};
      var sid = session.orgId || "";
      var ability = getAffairsFilterAbility();
      var def = getAffairsOrgFilterDefaults();

      if (st._syncedOrgId !== sid) {
        st.district = def.district;
        st.town = def.town;
        st.village = def.village;
        st._syncedOrgId = sid;
      }

      // 不可筛选层级：强制锁定为当前组织路径
      if (!ability.canDistrict) st.district = def.district;
      if (!ability.canTown) st.town = def.town;
      if (!ability.canVillage) st.village = def.village;

      // 可筛层级：级联修正
      var districtId = st.district || "all";
      var townId = st.town || "all";
      var villageId = st.village || "all";

      if (ability.canTown && townId !== "all") {
        var town = getOrg(townId);
        if (!town || town.level !== "town") {
          st.town = "all";
          if (ability.canVillage) st.village = "all";
          townId = "all";
          villageId = ability.canVillage ? "all" : st.village;
        } else if (districtId !== "all" && town.parentId !== districtId) {
          st.town = "all";
          if (ability.canVillage) st.village = "all";
          townId = "all";
          villageId = ability.canVillage ? "all" : st.village;
        } else if (ability.canDistrict && districtId === "all") {
          st.district = town.parentId || "all";
          districtId = st.district;
        }
      }

      if (ability.canVillage && villageId !== "all") {
        var village = getOrg(villageId);
        if (!village || village.level !== "village") {
          st.village = "all";
          villageId = "all";
        } else if (townId !== "all" && village.parentId !== townId) {
          st.village = "all";
          villageId = "all";
        } else if (townId === "all" && ability.canTown) {
          st.town = village.parentId || "all";
          townId = st.town;
          var t2 = getOrg(townId);
          if (t2 && ability.canDistrict && districtId === "all") {
            st.district = t2.parentId || "all";
            districtId = st.district;
          }
        }
      }

      return {
        district: st.district || "all",
        town: st.town || "all",
        village: st.village || "all",
        ability: ability,
      };
    }

    /** 金华市全部区县/乡镇/村社（下拉展示全市组织） */
    function getAffairsFilterOrgsByLevel(level) {
      return getAll(KEYS.orgs)
        .filter(function (o) {
          return o.level === level;
        })
        .slice()
        .sort(function (a, b) {
          return String(a.name || "").localeCompare(String(b.name || ""), "zh");
        });
    }

    function renderOrgCascadeSelects(route, districtId, townId, villageId, ability) {
      ability = ability || getAffairsFilterAbility();
      var fields = [];

      // 选项为金华市全部区县/乡镇/村社；
      // 仅当「上一级筛选项用户可选且已选定」时，才联动收窄下级列表
      if (ability.canDistrict) {
        fields.push({
          label: "区县",
          field: "district",
          active: districtId || "all",
          items: getAffairsFilterOrgsByLevel("district"),
        });
      }
      if (ability.canTown) {
        var towns = getAffairsFilterOrgsByLevel("town");
        if (ability.canDistrict && districtId && districtId !== "all") {
          towns = towns.filter(function (o) { return o.parentId === districtId; });
        }
        fields.push({
          label: "乡镇",
          field: "town",
          active: townId || "all",
          items: towns,
        });
      }
      if (ability.canVillage) {
        var villages = getAffairsFilterOrgsByLevel("village");
        if (ability.canTown && townId && townId !== "all") {
          villages = villages.filter(function (o) { return o.parentId === townId; });
        } else if (ability.canDistrict && districtId && districtId !== "all") {
          villages = villages.filter(function (o) {
            var t = getOrg(o.parentId);
            return t && t.parentId === districtId;
          });
        }
        fields.push({
          label: "村社",
          field: "village",
          active: villageId || "all",
          items: villages,
        });
      }

      if (!fields.length) return "";

      function fieldHtml(item, full) {
        var html =
          '<div class="org-cascade-field' +
          (full ? " full" : "") +
          '">' +
          '<select class="org-cascade-select" data-affairs-org="' +
          escapeHtml(item.field) +
          '" data-list-route="' +
          escapeHtml(route) +
          '">' +
          '<option value="all"' +
          (item.active === "all" ? " selected" : "") +
          ">请选择" +
          escapeHtml(item.label) +
          "</option>";
        item.items.forEach(function (o) {
          html +=
            '<option value="' +
            escapeHtml(o.id) +
            '"' +
            (item.active === o.id ? " selected" : "") +
            ">" +
            escapeHtml(o.name) +
            "</option>";
        });
        html += "</select></div>";
        return html;
      }

      // 两个一行；奇数个时最后一个占满一行
      var html = '<div class="org-cascade list-toolbar"><div class="org-cascade-grid">';
      fields.forEach(function (f, idx) {
        var full = fields.length === 1 || (fields.length % 2 === 1 && idx === fields.length - 1);
        html += fieldHtml(f, full);
      });
      html += "</div></div>";
      return html;
    }

    function affairsMatchOrgFilter(record, districtId, townId, villageId) {
      var org = getOrg(record.orgId);
      if (!org) return false;
      var path = org.path || [];
      if (villageId && villageId !== "all") return record.orgId === villageId;
      if (townId && townId !== "all") {
        return record.orgId === townId || path.indexOf(townId) >= 0;
      }
      if (districtId && districtId !== "all") {
        return record.orgId === districtId || path.indexOf(districtId) >= 0;
      }
      return true;
    }

    function pageTopics() {
      if (h5Params.id) {
        const topic = getPublicContentById(KEYS.topics, h5Params.id);
        if (!topic) return emptyList("议题不存在");
        h5NavTitle = "议题详情";
        const session = getH5Session() || {};
        const comments = getAll(KEYS.topicComments)
          .filter(function (c) { return c.topicId === topic.id && !c.deleted && c.status !== "deleted"; })
          .sort(function (a, b) { return String(b.createdAt || "").localeCompare(String(a.createdAt || "")); });
        const votes = getAll(KEYS.topicVotes).filter(function (v) {
          return v.topicId === topic.id && !v.deleted;
        });
        const myVote = votes.find(function (v) { return v.userId === session.userId; });
        const phase = topicPhaseOf(topic);
        const st = TOPIC_STATUS(topic);
        const allowJoin = canJoinTopic(topic, session);
        let extra = "";
        if (topic.villageOnly && !allowJoin) {
          extra +=
            '<div class="h5-section"><div style="font-size:13px;color:rgba(0,0,0,0.55);line-height:1.6">本议题仅限发布村社居民参与讨论与表决。</div></div>';
        }

        // 上方：表决 + 发表评论
        const options = topic.options || [];
        const showVote = phase === "voting" || phase === "closed" || myVote;
        // 结果公示=是：本人投票后、或议题结束后展示各选项票数
        const showCounts =
          !!topic.resultPublic && (!!myVote || phase === "closed");
        if (showVote && options.length) {
          extra += '<div class="h5-section"><div class="h5-section-title">表决</div>';
          options.forEach(function (opt) {
            const count = votes.filter(function (v) { return v.optionId === opt.id; }).length;
            const selected = myVote && myVote.optionId === opt.id;
            const canVote = phase === "voting" && !myVote && allowJoin;
            extra +=
              '<div class="vote-opt' +
              (selected ? " selected" : "") +
              '"' +
              (canVote
                ? ' data-vote-opt="' +
                  escapeHtml(opt.id) +
                  '" data-topic-id="' +
                  escapeHtml(topic.id) +
                  '" data-vote-label="' +
                  escapeHtml(opt.label || "") +
                  '"'
                : "") +
              ">" +
              '<span>' +
              escapeHtml(opt.label) +
              "</span>" +
              (showCounts ? '<span class="vote-count">' + count + " 票</span>" : "") +
              (selected ? ' <i class="ri-check-line"></i>' : "") +
              "</div>";
          });
          if (myVote) {
            extra += '<div style="font-size:12px;color:rgba(0,0,0,0.45)">您已完成表决</div>';
          } else if (phase === "voting" && !allowJoin) {
            extra += '<div style="font-size:12px;color:rgba(0,0,0,0.45)">您所在村社不在参与范围内</div>';
          }
          extra += "</div>";
        }
        if (phase === "discussing" || phase === "voting") {
          if (allowJoin) {
            extra +=
              '<div class="h5-section"><div class="h5-section-title">发表评论</div>' +
              '<div class="form-item" style="margin-bottom:0">' +
              '<textarea class="form-textarea" id="topic-comment" placeholder="发表看法…" maxlength="300"></textarea>' +
              '<div class="h5-switch-row">' +
              '<div class="h5-switch-label"><span>是否匿名</span></div>' +
              '<button type="button" class="h5-switch" id="topic-comment-anon" aria-pressed="false" title="是否匿名"></button>' +
              "</div>" +
              '<button type="button" class="btn-block" style="margin-top:8px" id="btn-topic-comment" data-topic-id="' +
              escapeHtml(topic.id) +
              '">发表评论</button></div></div>';
          }
        }

        // 下方：讨论（全部评论）
        extra += '<div class="h5-section"><div class="h5-section-title">讨论</div>';
        if (!comments.length) extra += '<div class="empty-tip" style="padding:8px 0">暂无评论</div>';
        comments.forEach(function (c) {
          extra +=
            '<div class="comment-item"><div><span class="comment-user">' +
            escapeHtml(displayCommentUserName(c)) +
            (c.anonymous ? '<span style="margin-left:4px;font-size:11px;color:rgba(0,0,0,0.35)">匿名</span>' : "") +
            '</span><span class="comment-time">' +
            escapeHtml(formatDate(c.createdAt)) +
            "</span></div><div class=\"comment-text\">" +
            escapeHtml(c.content) +
            "</div></div>";
        });
        extra += "</div>";

        return detailShell(
          topic.title,
          statusTag(st[0], st[1]) + " · " + escapeHtml(displayOrgLabel(topic)) + " · " + escapeHtml(formatDate(topic.publishAt || topic.createdAt)),
          topic.content || "",
          extra,
          ""
        );
      }
      const route = "home/topics";
      // 仅状态 Tab：讨论中 / 表决中 / 已结束（无「全部」）
      let tab = getListFilter(route, "status", "discussing");
      if (["discussing", "voting", "closed"].indexOf(tab) < 0) tab = "discussing";
      let list = sortByTimeDesc(listForH5(KEYS.topics), ["publishAt", "updatedAt", "createdAt"]);
      list = list.filter(function (t) { return topicPhaseOf(t) === tab; });
      let html = renderSegmentTabs(
        route,
        "status",
        [
          { k: "discussing", l: "讨论中" },
          { k: "voting", l: "表决中" },
          { k: "closed", l: "已结束" },
        ],
        tab
      );
      html += '<div class="h5-list">';
      if (!list.length) {
        html += emptyList(
          tab === "voting" ? "暂无表决中议题" : tab === "closed" ? "暂无已结束议题" : "暂无讨论中议题"
        );
      }
      list.forEach(function (t) {
        const st = TOPIC_STATUS(t);
        html += listCard({
          title: t.title,
          desc: t.content,
          path: "home/topics",
          id: t.id,
          metaHtml:
            statusTag(st[0], st[1]) +
            "<span>" +
            escapeHtml(formatDate(t.publishAt || t.createdAt)) +
            "</span>",
        });
      });
      html += "</div>";
      return html;
    }

              escapeHtml(formatDate(act.endAt)) +
              "</div>" +
              '<div><span class="k">发布单位：</span>' +
              escapeHtml(displayOrgLabel(act)) +
              "</div></div>" +
              '<button type="button" class="btn-block" style="margin-top:12px" data-nav="home/activities" data-id="' +
              escapeHtml(act.id) +
              '">查看活动详情</button></div>'
            : "");
        return detailShell(title, meta, body, extra, "");
      }
      const signups = sortByTimeDesc(currentUserSignups(), ["createdAt"]);
      let html = '<div class="h5-list">';
      if (!signups.length) html += emptyList("暂无活动报名");
      signups.forEach(function (s) {
        const act = getById(KEYS.activities, s.activityId);
        html += listCard({
          title: (act && act.title) || "活动",
          desc: "报名时间 " + formatDate(s.createdAt) + (act && act.place ? " · " + act.place : ""),
          path: "mine/signups",
          id: s.id,
          metaHtml:
            statusTag("已报名", "success") +
            "<span>" +
            escapeHtml(displayOrgLabel(act || s)) +
            "</span>",
        });
      });
      html += "</div>";
      return html;
    }

    function pageMineSuggestions() {
      // 与办理进度共用详情；列表筛选用 mine/suggestions
      if (h5Params.id) {
        const s = getById(KEYS.suggestions, h5Params.id);
        if (!s) return emptyList("建议不存在");
        return renderSuggestionDetail(s);
      }
      const route = "mine/suggestions";
      const tab = getListFilter(route, "tab", "all");
      let list = sortByTimeDesc(currentUserSuggestions(), ["updatedAt", "createdAt"]);
      if (tab === "doing") list = list.filter(function (s) { return !isSuggestFinished(s); });
      if (tab === "done") list = list.filter(function (s) { return isSuggestFinished(s); });
      let html = renderSegmentTabs(
        route,
        "tab",
        [
          { k: "all", l: "全部" },
          { k: "doing", l: "办理中" },
          { k: "done", l: "已办结" },
        ],
        tab
      );
      html += '<div class="h5-list">';
      if (!list.length) html += emptyList("暂无建议线索记录");
      list.forEach(function (s) {
        const st = SUGGEST_STATUS(s.status);
        html += listCard({
          title: suggestListTitle(s),
          desc: s.content,
          path: "mine/suggestions",
          id: s.id,
          metaHtml:
            statusTag(st[0], st[1]) +
            "<span>" +
            escapeHtml(formatDate(s.updatedAt || s.createdAt)) +
            "</span>",
        });
      });
      html += "</div>";
      return html;
    }

    function pageMineSurveys() {
      // 作答记录详情（按答卷 id）
      if (h5Params.id) {
        const answer = currentUserSurveyAnswers().find(function (x) {
          return x.id === h5Params.id;
        });
        if (!answer) return emptyList("作答记录不存在");
        const survey = getById(KEYS.surveys, answer.surveyId);
        h5NavTitle = "作答详情";
        const title = (survey && survey.title) || "问卷作答";
        const meta =
          statusTag("已提交", "success") +
          " · 提交于 " +
          escapeHtml(formatDate(answer.createdAt)) +
          (survey ? "<br/>" + escapeHtml(displayOrgLabel(survey)) : "");
        const extra =
          renderMySurveyAnswerBlock(survey || { questions: [] }, answer) +
          (survey
            ? '<div style="padding:0 12px 12px">' +
              '<button type="button" class="btn-block" data-nav="home/surveys" data-id="' +
              escapeHtml(survey.id) +
              '">查看问卷详情</button></div>'
            : "");
        return detailShell(title, meta, (survey && survey.desc) || "", extra, "");
      }
      const answers = sortByTimeDesc(currentUserSurveyAnswers(), ["createdAt"]);
      let html = '<div class="h5-list">';
      if (!answers.length) html += emptyList("暂无评议测评记录");
      answers.forEach(function (a) {
        const survey = getById(KEYS.surveys, a.surveyId);
        html += listCard({
          title: (survey && survey.title) || "问卷",
          desc: "提交于 " + formatDate(a.createdAt),
          path: "mine/surveys",
          id: a.id,
          metaHtml:
            statusTag("已提交", "success") +
            "<span>" +
            escapeHtml(displayOrgLabel(survey || a)) +
            "</span>",
        });
      });
      html += "</div>";
      return html;

    function pageMineTopics() {
      const session = getH5Session() || {};
      // 参与详情：打开议题并突出我的记录（议题详情内已含「我的参与记录」）
      if (h5Params.id) {
        // 复用议题详情
        const keepRoute = h5Route;
        const topic = getPublicContentById(KEYS.topics, h5Params.id);
        if (!topic) return emptyList("议题不存在");
        // 直接渲染 topics 详情结构
        const prev = Object.assign({}, h5Params);
        h5Params = { id: topic.id };
        // 临时调用议题页详情逻辑：内联简化
        h5NavTitle = "参与详情";
        const comments = getAll(KEYS.topicComments)
          .filter(function (c) {
            return c.topicId === topic.id && !c.deleted && c.status !== "deleted";
          })
          .sort(function (a, b) {
            return String(b.createdAt || "").localeCompare(String(a.createdAt || ""));
          });
        const votes = getAll(KEYS.topicVotes).filter(function (v) {
          return v.topicId === topic.id && !v.deleted;
        });
        const myVote = votes.find(function (v) { return v.userId === session.userId; });
        const st = TOPIC_STATUS(topic);
        let extra = renderMyTopicParticipationBlock(topic, session);
        extra += '<div class="h5-section"><div class="h5-section-title">议题讨论（摘要）</div>';
        const myComments = comments.filter(function (c) { return c.userId === session.userId; });
        if (!comments.length) extra += '<div class="empty-tip" style="padding:8px 0">暂无评论</div>';
        else {
          comments.slice(0, 5).forEach(function (c) {
            extra +=
              '<div class="comment-item"><div><span class="comment-user">' +
              escapeHtml(displayCommentUserName(c)) +
              (c.userId === session.userId ? "（我）" : "") +
              (c.anonymous ? '<span style="margin-left:4px;font-size:11px;color:rgba(0,0,0,0.35)">匿名</span>' : "") +
              '</span><span class="comment-time">' +
              escapeHtml(formatDate(c.createdAt)) +
              "</span></div><div class=\"comment-text\">" +
              escapeHtml(c.content) +
              "</div></div>";
          });
          if (comments.length > 5) {
            extra +=
              '<div class="record-meta">共 ' +
              comments.length +
              " 条评论，进入议题可查看全部</div>";
          }
        }
        extra +=
          '</div><div style="padding:0 12px 12px">' +
          '<button type="button" class="btn-block" data-nav="home/topics" data-id="' +
          escapeHtml(topic.id) +
          '">进入议题详情</button></div>';
        h5Params = prev;
        return detailShell(
          topic.title,
          statusTag(st[0], st[1]) +
            " · " +
            escapeHtml(displayOrgLabel(topic)) +
            (myVote ? " · 已表决" : "") +
            (myComments.length ? " · 已评论" : ""),
          topic.content || "",
          extra,
          ""
        );
      }
      const comments = getAll(KEYS.topicComments).filter(function (c) {
        return c.userId === session.userId && !c.deleted;
      });
      const votes = getAll(KEYS.topicVotes).filter(function (v) {
        return v.userId === session.userId && !v.deleted;
      });
      const topicIds = {};
      comments.forEach(function (c) { topicIds[c.topicId] = true; });
      votes.forEach(function (v) { topicIds[v.topicId] = true; });
      const ids = Object.keys(topicIds);
      let html = '<div class="h5-list">';
      if (!ids.length) html += emptyList("暂无议事参与记录");
      ids.forEach(function (tid) {
        const t = getById(KEYS.topics, tid);
        if (!t) return;
        const st = TOPIC_STATUS(t);
        const didComment = comments.some(function (c) { return c.topicId === tid; });
        const didVote = votes.some(function (v) { return v.topicId === tid; });
        html += listCard({
          title: t.title,
          path: "mine/topics",
          id: t.id,
          metaHtml:
            statusTag(st[0], st[1]) +
            (didComment ? statusTag("已评论", "primary") : "") +
            (didVote ? statusTag("已表决", "success") : ""),
        });
      });
      html += "</div>";
      return html;
    }

    function haversineKm(lat1, lng1, lat2, lng2) {
      var R = 6371;
      var toRad = function (d) { return (d * Math.PI) / 180; };
      var dLat = toRad(lat2 - lat1);
      var dLng = toRad(lng2 - lng1);

        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

        if (districts[i].name && text.indexOf(districts[i].name) >= 0) return districts[i];
      }
      return null;
    }

    function resolveTownFromLatLng(lat, lng, addressText) {
      var named = matchTownByText(addressText || "");
      if (named) return named;
      var dist = matchDistrictByText(addressText || "");
      var near = nearestTownByCoord(lat, lng, dist ? dist.id : null) || nearestTownByCoord(lat, lng, null);
      if (!near) return null;
      var fromCenter = haversineKm(lat, lng, JINHUA_CENTER.lat, JINHUA_CENTER.lng);
      if (fromCenter > LOCATE_MAX_KM) return null;
      return near.org;
    }

    function reverseGeocode(lat, lng) {
      var url =
        "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" +
        encodeURIComponent(lat) +
        "&lon=" +
        encodeURIComponent(lng) +
        "&zoom=16&addressdetails=1";
      return fetch(url, { headers: { Accept: "application/json" } })
        .then(function (res) {
          if (!res.ok) return "";
          return res.json();
        })
        .then(function (data) {
          if (!data) return "";
          var addr = data.address || {};
          return [
            data.display_name,
            addr.suburb,
            addr.town,
            addr.village,
            addr.city_district,
            addr.county,
            addr.city,
          ]
            .filter(Boolean)
            .join(" ");
        })
        .catch(function () {
          return "";
        });
    }

    function applyLocatedTown(org, source) {
      if (!org) return;
      var sess = getH5Session() || {};
      setH5Session({
        userId: sess.userId || "res_001",

        orgId: org.id,
        orgSource: source || "auto",
      });

    function locateCurrentOrg(opts) {
      opts = opts || {};
      if (_h5Locating) return;
      if (!navigator.geolocation) {
        if (!opts.silent) toast("当前环境不支持定位，请手动选择组织");
        return;
      }
      setLocateButtonState(true);
      if (!opts.silent) toast("正在获取所在街道…");
      navigator.geolocation.getCurrentPosition(
        function (pos) {
          var lat = pos.coords.latitude;
          var lng = pos.coords.longitude;
          var settled = false;
          var finish = function (addrText) {
            if (settled) return;
            settled = true;
            var town = resolveTownFromLatLng(lat, lng, addrText);
            setLocateButtonState(false);
            if (!town) {
              if (!opts.silent) toast("未匹配到金华市街道，请手动选择");
              return;
            }
            applyLocatedTown(town, "auto");
          };
          var timer = setTimeout(function () {
            finish("");
          }, 1200);
          reverseGeocode(lat, lng).then(function (text) {
            clearTimeout(timer);
            finish(text);
          });
        },
        function () {
          setLocateButtonState(false);
          if (!opts.silent) toast("定位失败，请手动选择组织");
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
      );
    }
