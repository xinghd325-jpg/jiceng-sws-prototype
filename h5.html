<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>社会工作服务 - 群众端</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet" />
  <style>
    :root {
      --color-primary: #1677FF;
      --color-success: #52C41A;
      --color-danger: #FF4D4F;
      --color-border: #D9D9D9;
      --color-bg: #F5F5F5;
      --color-bg-elevated: #FFFFFF;
      --radius: 2px;
      --phone-width: 375px;
      --phone-height: 812px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      font-size: 14px;
      background: #e8e8e8;
      color: rgba(0,0,0,0.88);
      line-height: 1.5;
    }
    #app { min-height: 100vh; padding: 8px 0 24px; }
    a { color: var(--color-primary); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    /* ---- Phone shell ---- */
    .phone {
      width: var(--phone-width);
      height: var(--phone-height);
      margin: 16px auto;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .phone-body { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--color-bg); }
    .tabbar {
      height: 50px;
      border-top: 1px solid var(--color-border);
      display: flex;
      background: #fff;
      flex-shrink: 0;
    }
    .tabbar-item {
      flex: 1;
      text-align: center;
      font-size: 11px;
      color: rgba(0,0,0,0.65);
      padding-top: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      user-select: none;
    }
    .tabbar-item i { font-size: 20px; line-height: 1; }
    .tabbar-item.active { color: var(--color-primary); }
    .tabbar.hidden { display: none; }

    /* ---- Sub page nav ---- */
    .h5-nav {
      height: 44px;
      background: #fff;
      border-bottom: 1px solid var(--color-border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .h5-nav-back {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(0,0,0,0.88);
      font-size: 20px;
      flex-shrink: 0;
    }
    .h5-nav-title {
      flex: 1;
      text-align: center;
      font-size: 16px;
      font-weight: 600;
      margin-right: 36px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---- Home ---- */
    .home-hero {
      background: var(--color-primary);
      color: #fff;
      padding: 16px 16px 20px;
    }
    .home-hero .org-name { font-size: 13px; opacity: 0.9; }
    .home-hero .greet { font-size: 18px; font-weight: 600; margin-top: 4px; }
    .home-search {
      margin-top: 12px;
      background: #fff;
      border-radius: 2px;
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
      color: rgba(0,0,0,0.45);
      font-size: 13px;
      cursor: pointer;
    }
    .home-search i { font-size: 16px; color: rgba(0,0,0,0.45); }

    .section-card {
      background: #fff;
      margin: 10px 12px;
      border-radius: 2px;
      border: 1px solid var(--color-border);
      overflow: hidden;
    }
    .section-title {
      padding: 10px 12px 6px;
      font-size: 14px;
      font-weight: 600;
      color: rgba(0,0,0,0.88);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-title::before {
      content: "";
      width: 3px;
      height: 12px;
      background: var(--color-primary);
      border-radius: 1px;
    }
    .grid-menu {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 4px 4px 12px;
      gap: 0;
    }
    .grid-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 4px;
      cursor: pointer;
      color: rgba(0,0,0,0.88);
    }
    .grid-item:active { background: #f5f5f5; }
    .grid-item .grid-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
      font-size: 22px;
      margin-bottom: 4px;
    }
    .grid-item .grid-label {
      font-size: 12px;
      text-align: center;
      line-height: 1.3;
      color: rgba(0,0,0,0.75);
    }
    .service-hint {
      margin: 0 12px 8px;
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      text-align: center;
    }
    .service-hint a { color: var(--color-primary); }

    .news-list { padding: 0 0 8px; }
    .news-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .news-item:active { background: #fafafa; }
    .news-tag {
      flex-shrink: 0;
      font-size: 11px;
      color: var(--color-primary);
      border: 1px solid var(--color-primary);
      border-radius: 2px;
      padding: 0 4px;
      height: 18px;
      line-height: 16px;
      margin-top: 2px;
    }
    .news-body { flex: 1; min-width: 0; }
    .news-title {
      font-size: 13px;
      color: rgba(0,0,0,0.88);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .news-meta { font-size: 11px; color: rgba(0,0,0,0.45); margin-top: 2px; }

    /* ---- Service tab ---- */
    .svc-entry-list { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .svc-entry {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .svc-entry:active { background: #fafafa; }
    .svc-entry .svc-icon {
      width: 44px;
      height: 44px;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--color-primary);
      font-size: 24px;
      flex-shrink: 0;
    }
    .svc-entry .svc-text { flex: 1; min-width: 0; }
    .svc-entry .svc-name { font-size: 15px; font-weight: 600; }
    .svc-entry .svc-desc { font-size: 12px; color: rgba(0,0,0,0.45); margin-top: 2px; }
    .svc-entry .svc-arrow { color: rgba(0,0,0,0.25); font-size: 18px; }

    /* ---- Mine tab ---- */
    .mine-card {
      background: var(--color-primary);
      color: #fff;
      margin: 0;
      padding: 20px 16px 16px;
    }
    .mine-card .mine-name { font-size: 18px; font-weight: 600; }
    .mine-card .mine-meta { font-size: 12px; opacity: 0.9; margin-top: 6px; line-height: 1.6; }
    .mine-switch {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.65);
      border-radius: 2px;
      padding: 4px 10px;
      cursor: pointer;
      background: transparent;
    }
    .mine-switch:active { background: rgba(255,255,255,0.12); }
    .mine-list { margin: 10px 12px; background: #fff; border: 1px solid var(--color-border); border-radius: 2px; }
    .mine-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      font-size: 14px;
    }
    .mine-row:last-child { border-bottom: none; }
    .mine-row:active { background: #fafafa; }
    .mine-row i.row-icon { color: var(--color-primary); font-size: 18px; }
    .mine-row .row-label { flex: 1; }
    .mine-row .row-arrow { color: rgba(0,0,0,0.25); font-size: 16px; }

    /* ---- Stub / empty ---- */
    .stub-page {
      padding: 48px 24px;
      text-align: center;
      color: rgba(0,0,0,0.45);
      font-size: 14px;
    }
    .stub-page i { font-size: 40px; color: rgba(0,0,0,0.2); display: block; margin-bottom: 12px; }
    .empty-tip { padding: 20px; text-align: center; color: rgba(0,0,0,0.45); font-size: 13px; }

    /* ---- Resident picker ---- */
    .picker-mask {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      display: flex;
      align-items: flex-end;
    }
    .picker-panel {
      width: 100%;
      background: #fff;
      border-radius: 2px 2px 0 0;
      max-height: 70%;
      overflow: auto;
    }
    .picker-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid var(--color-border);
      font-weight: 600;
      font-size: 15px;
      position: sticky;
      top: 0;
      background: #fff;
    }
    .picker-head .picker-close { color: rgba(0,0,0,0.45); font-size: 14px; cursor: pointer; font-weight: 400; }
    .picker-item {
      padding: 12px 16px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .picker-item:active { background: #f5f5f5; }
    .picker-item.active { color: var(--color-primary); }
    .picker-item .pi-name { font-size: 14px; font-weight: 600; }
    .picker-item .pi-meta { font-size: 12px; color: rgba(0,0,0,0.45); margin-top: 2px; }
    .picker-item .pi-check { margin-left: auto; font-size: 18px; }

    /* ---- Toast ---- */
    .h5-toast {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 10px 16px;
      border-radius: 2px;
      font-size: 13px;
      z-index: 200;
      max-width: 80%;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .h5-toast.show { opacity: 1; }

    /* ---- List / detail / form ---- */
    .h5-page { min-height: 100%; display: flex; flex-direction: column; }
    .h5-page.with-footer { padding-bottom: 64px; }
    .h5-list { padding: 10px 12px 16px; display: flex; flex-direction: column; gap: 8px; }
    .h5-card {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 12px;
      cursor: pointer;
    }
    .h5-card:active { background: #fafafa; }
    .h5-card.static { cursor: default; }
    .h5-card.static:active { background: #fff; }
    .h5-card-title {
      font-size: 14px;
      font-weight: 600;
      color: rgba(0,0,0,0.88);
      line-height: 1.4;
    }
    .h5-card-meta {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(0,0,0,0.45);
      display: flex;
      flex-wrap: wrap;
      gap: 6px 10px;
      align-items: center;
    }
    .h5-card-desc {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(0,0,0,0.65);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tag {
      display: inline-block;
      font-size: 11px;
      line-height: 16px;
      padding: 0 6px;
      border-radius: 2px;
      border: 1px solid var(--color-border);
      color: rgba(0,0,0,0.65);
      background: #fafafa;
    }
    .tag.primary { color: var(--color-primary); border-color: #91caff; background: #e6f4ff; }
    .tag.success { color: #389e0d; border-color: #b7eb8f; background: #f6ffed; }
    .tag.warning { color: #d48806; border-color: #ffe58f; background: #fffbe6; }
    .tag.danger { color: #cf1322; border-color: #ffa39e; background: #fff1f0; }
    .h5-detail { padding: 12px; }
    .h5-detail-card {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 14px;
    }
    .h5-detail-title { font-size: 17px; font-weight: 600; line-height: 1.4; }
    .h5-detail-meta { margin-top: 8px; font-size: 12px; color: rgba(0,0,0,0.45); line-height: 1.7; }
    .h5-detail-body {
      margin-top: 12px;
      font-size: 14px;
      color: rgba(0,0,0,0.88);
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .h5-section {
      margin-top: 12px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 12px;
    }
    .h5-section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .h5-section-title::before {
      content: "";
      width: 3px;
      height: 12px;
      background: var(--color-primary);
      border-radius: 1px;
    }
    .h5-form { padding: 12px; }
    .form-item { margin-bottom: 12px; }
    .form-label {
      display: block;
      font-size: 13px;
      color: rgba(0,0,0,0.65);
      margin-bottom: 6px;
    }
    .form-label .req { color: var(--color-danger); margin-right: 2px; }
    .form-input, .form-textarea, .form-select {
      width: 100%;
      height: 36px;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 0 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: rgba(0,0,0,0.88);
      outline: none;
    }
    .form-input:focus, .form-textarea:focus, .form-select:focus {
      border-color: var(--color-primary);
    }
    .form-textarea { height: auto; min-height: 96px; padding: 8px 10px; resize: vertical; line-height: 1.5; }
    .form-select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, #999 50%), linear-gradient(135deg, #999 50%, transparent 50%); background-position: calc(100% - 14px) 15px, calc(100% - 9px) 15px; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
    .score-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .score-opt {
      width: 36px;
      height: 32px;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: rgba(0,0,0,0.65);
      cursor: pointer;
      background: #fff;
    }
    .score-opt.active {
      border-color: var(--color-primary);
      color: var(--color-primary);
      background: #e6f4ff;
    }
    .h5-footer {
      position: sticky;
      left: 0;
      right: 0;
      bottom: 0;
      margin-top: auto;
      padding: 10px 12px;
      background: #fff;
      border-top: 1px solid var(--color-border);
      z-index: 20;
      display: flex;
      gap: 8px;
    }
    .phone-body { position: relative; display: flex; flex-direction: column; }
    .h5-page.with-footer { flex: 1; display: flex; flex-direction: column; min-height: calc(100% - 0px); }
    .btn-primary, .btn-default, .btn-danger-ghost {
      height: 40px;
      border-radius: 2px;
      font-size: 15px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-primary {
      background: var(--color-primary);
      color: #fff;
    }
    .btn-primary:active { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-default {
      background: #fff;
      color: rgba(0,0,0,0.88);
      border: 1px solid var(--color-border);
    }
    .btn-block {
      width: 100%;
      height: 40px;
      border-radius: 2px;
      font-size: 15px;
      background: var(--color-primary);
      color: #fff;
    }
    .btn-block:disabled { opacity: 0.5; }
    .comment-item {
      padding: 10px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    .comment-item:last-child { border-bottom: none; }
    .comment-user { font-weight: 600; color: rgba(0,0,0,0.88); }
    .comment-time { font-size: 11px; color: rgba(0,0,0,0.45); margin-left: 8px; font-weight: 400; }
    .comment-text { margin-top: 4px; color: rgba(0,0,0,0.75); line-height: 1.5; }
    .vote-opt {
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
    }
    .vote-opt:active { background: #fafafa; }
    .vote-opt.selected {
      border-color: var(--color-primary);
      background: #e6f4ff;
      color: var(--color-primary);
    }
    .vote-opt .vote-count { margin-left: auto; font-size: 12px; color: rgba(0,0,0,0.45); }
    .filter-bar {
      padding: 10px 12px 0;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-chip {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      font-size: 12px;
      color: rgba(0,0,0,0.65);
      background: #fff;
      display: inline-flex;
      align-items: center;
      cursor: pointer;
    }
    .filter-chip.active {
      color: var(--color-primary);
      border-color: var(--color-primary);
      background: #e6f4ff;
    }
    .search-box {
      margin: 10px 12px 0;
      height: 36px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 6px;
    }
    .search-box i { color: rgba(0,0,0,0.45); font-size: 16px; }
    .search-box input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 13px;
      font-family: inherit;
      background: transparent;
    }
    /* Assist progress card */
    .assist-card {
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 12px;
      margin-bottom: 8px;
    }
    .assist-card-title { font-size: 14px; font-weight: 600; }
    .assist-steps {
      display: flex;
      align-items: flex-start;
      margin: 14px 0 10px;
      padding: 0 4px;
    }
    .assist-step {
      flex: 1;
      text-align: center;
      position: relative;
      font-size: 11px;
      color: rgba(0,0,0,0.45);
    }
    .assist-step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 7px;
      left: calc(50% + 10px);
      right: calc(-50% + 10px);
      height: 2px;
      background: #e8e8e8;
      z-index: 0;
    }
    .assist-step.done:not(:last-child)::after,
    .assist-step.current:not(:last-child)::after { background: var(--color-success); }
    .assist-step.fail:not(:last-child)::after { background: var(--color-danger); }
    .assist-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #d9d9d9;
      background: #fff;
      margin: 0 auto 6px;
      position: relative;
      z-index: 1;
      box-sizing: border-box;
    }
    .assist-step.done .assist-dot {
      border-color: var(--color-success);
      background: var(--color-success);
    }
    .assist-step.current .assist-dot {
      border-color: var(--color-success);
      background: #fff;
      box-shadow: 0 0 0 2px rgba(82,196,26,0.2);
    }
    .assist-step.fail .assist-dot {
      border-color: var(--color-danger);
      background: var(--color-danger);
    }
    .assist-step.warn .assist-dot {
      border-color: #FAAD14;
      background: #FAAD14;
    }
    .assist-step.done, .assist-step.current { color: rgba(0,0,0,0.88); }
    .assist-step.fail { color: var(--color-danger); }
    .assist-step.warn { color: #d48806; }
    .assist-info {
      font-size: 12px;
      color: rgba(0,0,0,0.65);
      line-height: 1.7;
      border-top: 1px solid #f0f0f0;
      padding-top: 8px;
    }
    .assist-info .label { color: rgba(0,0,0,0.45); }
    .about-block {
      margin: 12px;
      background: #fff;
      border: 1px solid var(--color-border);
      border-radius: 2px;
      padding: 14px;
      font-size: 13px;
      line-height: 1.7;
      color: rgba(0,0,0,0.75);
    }
    .about-block h3 { font-size: 14px; margin-bottom: 8px; color: rgba(0,0,0,0.88); }
  </style>
</head>
<body>
  <div id="app">H5 骨架加载中</div>
  <script>
    /* ========== Seed + Storage ========== */
    const STORE_PREFIX = "sws_v1_";
    const KEYS = {
      meta: STORE_PREFIX + "meta",

    VISIBILITY[KEYS.surveys] = "scope";
    VISIBILITY[KEYS.suggestions] = "self";
    VISIBILITY[KEYS.assistApplications] = "self";

    function getAll(key) {
      return storageGet(key) || [];
    }
    function getOrg(id) {
      return getAll(KEYS.orgs).find((o) => o.id === id) || null;
    }
    function getOrgDescendants(orgId) {
      return getAll(KEYS.orgs)
        .filter((o) => (o.path || []).includes(orgId))
        .map((o) => o.id);
    }
    function isAncestorOrg(ancestorId, childId) {
      const child = getOrg(childId);
      return !!(child && (child.path || []).includes(ancestorId));
    }

    function getPcSession() {
      return storageGet(KEYS.pcSession);
    }
    function setPcSession(s) {
      storageSet(KEYS.pcSession, s);
    }
    function getH5Session() {
      return storageGet(KEYS.h5Session);
    }
    function setH5Session(s) {
      storageSet(KEYS.h5Session, s);
    }

    function listForPc(key) {
      const session = getPcSession();
      if (!session || !session.orgId) return [];
      const ids = new Set(getOrgDescendants(session.orgId));
      return getAll(key).filter((r) => ids.has(r.orgId) && !r.deleted);
    }
    function canManage(record) {
      const session = getPcSession();
      return !!(record && session && record.orgId === session.orgId);
    }

    function scopeMatchesUser(record, sessionOrgId, path) {
      const ids = record.scopeOrgIds;
      if (ids && ids.length) return ids.includes(sessionOrgId);
      if (record.scopeType === "org") return record.orgId === sessionOrgId;
      // all_children / default: 发布方为本级或上级
      return (path || []).includes(record.orgId);
    }

    function listForH5(moduleKey) {
      const session = getH5Session();
      if (!session) return [];
      const orgId = session.orgId;
      const userId = session.userId;
      const userOrg = getOrg(orgId);
      const path = userOrg ? (userOrg.path || []) : [];
      const all = getAll(moduleKey).filter((r) => !r.deleted);
      const rule = VISIBILITY[moduleKey];

      if (rule === "upward") {
        return all.filter((r) => r.status === "published" && path.includes(r.orgId));
      }
      if (rule === "village") {
        if (moduleKey === KEYS.topics) {
          return all.filter((r) => r.orgId === orgId && r.status !== "draft");
        }
        return all.filter((r) => r.orgId === orgId && r.status === "published");
      }
      if (rule === "scope") {
        const statusOk =
          moduleKey === KEYS.activities
            ? (s) => s === "published"
            : (s) => s === "open";
        return all.filter((r) => statusOk(r.status) && scopeMatchesUser(r, orgId, path));
      }
      if (rule === "self") {
        return all.filter((r) => r.userId === userId);
      }
      return all.filter((r) => r.status === "published");
    }

    function listVisible(key, opts) {
      opts = opts || {};
      if (opts.side === "h5" || opts.client === "h5") return listForH5(key);
      return listForPc(key);
    }

    function getById(key, id) {
      return getAll(key).find((x) => x.id === id) || null;
    }
    function saveRecord(key, record) {
      const list = getAll(key);
      const idx = list.findIndex((x) => x.id === record.id);
      if (idx >= 0) list[idx] = record;
      else list.unshift(record);
      storageSet(key, list);
      return record;
    }
    function removeRecord(key, id) {
      const list = getAll(key).map((x) => (x.id === id ? Object.assign({}, x, { deleted: true }) : x));
      storageSet(key, list);
    }

    /* ========== H5 UI helpers ========== */
    function escapeHtml(str) {
      if (str == null) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso).slice(0, 10);
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return d.getFullYear() + "-" + m + "-" + day;
    }

    function greetByHour() {
      const h = new Date().getHours();
      if (h < 6) return "夜深了";
      if (h < 11) return "早上好";
      if (h < 13) return "中午好";
      if (h < 18) return "下午好";
      return "晚上好";
    }

    let _toastTimer = null;
    function toast(message) {
      const phone = document.querySelector(".phone");
      if (!phone) return;
      let el = phone.querySelector(".h5-toast");
      if (!el) {
        el = document.createElement("div");
        el.className = "h5-toast";
        phone.appendChild(el);
      }
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1800);
    }

    function isTabRoot(path) {
      return !!TAB_ROOTS[path];
    }

    function h5Navigate(path, opts) {
      opts = opts || {};
      if (!path) return;
      const nextParams = opts.params ? Object.assign({}, opts.params) : {};
      if (isTabRoot(path)) {
        h5History = [];
        h5Route = path;
        h5Params = {};
      } else if (opts.replace) {
        h5Route = path;
        h5Params = nextParams;
      } else if (path !== h5Route || JSON.stringify(nextParams) !== JSON.stringify(h5Params)) {
        h5History.push({ route: h5Route, params: Object.assign({}, h5Params) });
        h5Route = path;
        h5Params = nextParams;
      }
      h5ShowPicker = false;
      h5NavTitle = null;
      renderH5Shell();
    }

    function h5Back() {
      if (h5History.length) {
        const prev = h5History.pop();
        if (typeof prev === "string") {
          h5Route = prev;
          h5Params = {};
        } else {
          h5Route = prev.route;
          h5Params = prev.params || {};
        }
      } else {
        const root = (h5Route || "home").split("/")[0];
        h5Route = TAB_ROOTS[root] ? root : "home";
        h5Params = {};
      }
      h5ShowPicker = false;
      h5NavTitle = null;
      renderH5Shell();
    }

    /* ---------- Shared H5 page helpers ---------- */
    function sortByTimeDesc(arr, fields) {
      fields = fields || ["updatedAt", "createdAt", "publishAt"];
      return (arr || []).slice().sort(function (a, b) {
        function key(x) {
          for (let i = 0; i < fields.length; i++) {
            if (x[fields[i]]) return String(x[fields[i]]);
          }
          return "";
        }
        return key(b).localeCompare(key(a));
      });
    }

    function statusTag(text, tone) {
      return '<span class="tag' + (tone ? " " + tone : "") + '">' + escapeHtml(text) + "</span>";
    }

    function emptyList(msg) {
      return '<div class="empty-tip">' + escapeHtml(msg || "暂无数据") + "</div>";
    }

    function listCard(opts) {
      opts = opts || {};
      const navAttr = opts.path
        ? ' data-nav="' + escapeHtml(opts.path) + '"' + (opts.id ? ' data-id="' + escapeHtml(opts.id) + '"' : "")
        : "";
      return (
        '<div class="h5-card' + (opts.path ? "" : " static") + '"' + navAttr + ">" +
        '<div class="h5-card-title">' + escapeHtml(opts.title || "") + "</div>" +
        (opts.desc ? '<div class="h5-card-desc">' + escapeHtml(opts.desc) + "</div>" : "") +
        '<div class="h5-card-meta">' + (opts.metaHtml || "") + "</div>" +
        "</div>"
      );
    }

    function detailShell(title, metaHtml, bodyHtml, extraHtml, footerHtml) {
      h5NavTitle = title || h5NavTitle;
      let html = '<div class="h5-page' + (footerHtml ? " with-footer" : "") + '">';
      html += '<div class="h5-detail">';
      html += '<div class="h5-detail-card">';
      html += '<div class="h5-detail-title">' + escapeHtml(title || "") + "</div>";
      if (metaHtml) html += '<div class="h5-detail-meta">' + metaHtml + "</div>";
      if (bodyHtml) html += '<div class="h5-detail-body">' + escapeHtml(bodyHtml) + "</div>";
      html += "</div>";
      if (extraHtml) html += extraHtml;
      html += "</div>";
      if (footerHtml) html += '<div class="h5-footer">' + footerHtml + "</div>";
      html += "</div>";
      return html;

    function getAssistProgressText(app) {
      if (app.progressText) return app.progressText;
      const st = app.status;
      if (st === "submitted") return "已提交，待乡镇中心受理";
      if (st === "rejected") return "中心不予受理" + (app.rejectReason ? "：" + app.rejectReason : "");
      if (st === "assigned") return "已受理并指派" + (app.deptName || "部门") + "，待部门审核";
      if (st === "returned") return "部门退回" + (app.returnReason ? "：" + app.returnReason : "");
      if (st === "completed") return "部门审核通过，办结";
      return "";
    }

    function getAssistHandleOrg(app) {
      if (app.handleOrgName) return app.handleOrgName;
      if (app.status === "assigned" && app.deptName) return "城西街道" + app.deptName;
      if (app.status === "completed" && app.deptName) return "城西街道" + app.deptName;
      return "城西街道综合信息指挥室";
    }

    /** 四步：提交 / 受理 / 指派 / 审核；禁止咨询电话 */
    function renderAssistProgressCard(app) {
      const st = app.status || "submitted";
      // step states: pending | done | current | fail | warn
      const steps = [
        { key: "submit", label: "提交" },
        { key: "accept", label: "受理" },
        { key: "assign", label: "指派" },
        { key: "audit", label: "审核" },
      ];
      let states = ["done", "pending", "pending", "pending"];
      if (st === "submitted") {
        states = ["done", "current", "pending", "pending"];
        steps[1].label = "受理中";
      } else if (st === "rejected") {
        states = ["done", "fail", "pending", "pending"];
        steps[1].label = "不予受理";
      } else if (st === "assigned") {
        states = ["done", "done", "done", "current"];
        steps[3].label = "审核中";
      } else if (st === "returned") {
        states = ["done", "done", "warn", "pending"];
        steps[2].label = "已退回";
      } else if (st === "completed") {
        states = ["done", "done", "done", "done"];
        steps[3].label = "完成";
      }
      let stepsHtml = '<div class="assist-steps">';
      steps.forEach(function (s, i) {
        stepsHtml +=
          '<div class="assist-step ' + states[i] + '">' +
          '<div class="assist-dot"></div>' +
          "<div>" + escapeHtml(s.label) + "</div>" +
          "</div>";
      });
      stepsHtml += "</div>";
      const progressText = getAssistProgressText(app);
      const handleOrg = getAssistHandleOrg(app);
      return (
        '<div class="assist-card">' +
        '<div class="assist-card-title">' + escapeHtml(app.title || "帮扶申请") + "</div>" +
        stepsHtml +
        '<div class="assist-info">' +
        '<div><span class="label">办理单位：</span>' + escapeHtml(handleOrg) + "</div>" +
        '<div><span class="label">进度说明：</span>' + escapeHtml(progressText) + "</div>" +
        '<div><span class="label">申报时间：</span>' + escapeHtml(formatDate(app.createdAt)) + "</div>" +
        (app.type ? '<div><span class="label">申请类型：</span>' + escapeHtml(app.type) + "</div>" : "") +
        "</div></div>"
      );
    }

    function pageTopics() {
      if (h5Params.id) {
        const topic = getById(KEYS.topics, h5Params.id);
        if (!topic) return emptyList("议题不存在");
        h5NavTitle = "议题详情";
        const session = getH5Session() || {};
        const comments = getAll(KEYS.topicComments)
          .filter(function (c) { return c.topicId === topic.id && !c.deleted && c.status !== "deleted"; })
          .sort(function (a, b) { return String(a.createdAt || "").localeCompare(String(b.createdAt || "")); });
        const votes = getAll(KEYS.topicVotes).filter(function (v) {
          return v.topicId === topic.id && !v.deleted;
        });
        const myVote = votes.find(function (v) { return v.userId === session.userId; });
        const st = TOPIC_STATUS(topic.status);
        let extra = "";
        extra += '<div class="h5-section"><div class="h5-section-title">讨论</div>';
        if (!comments.length) extra += '<div class="empty-tip" style="padding:8px 0">暂无评论</div>';
        comments.forEach(function (c) {
          extra +=
            '<div class="comment-item"><div><span class="comment-user">' +
            escapeHtml(c.userName || "居民") +
            '</span><span class="comment-time">' +
            escapeHtml(formatDate(c.createdAt)) +
            "</span></div><div class=\"comment-text\">" +
            escapeHtml(c.content) +
            "</div></div>";
        });
        if (topic.status === "discussing" || topic.status === "voting") {
          extra +=
            '<div class="form-item" style="margin-top:10px;margin-bottom:0">' +
            '<textarea class="form-textarea" id="topic-comment" placeholder="发表看法…" maxlength="300"></textarea>' +
            '<button type="button" class="btn-block" style="margin-top:8px" id="btn-topic-comment" data-topic-id="' +
            escapeHtml(topic.id) +
            '">发表评论</button></div>';
        }
        extra += "</div>";

        const options = topic.options || [];
        const showVote = topic.status === "voting" || topic.status === "closed" || myVote;
        if (showVote && options.length) {
          extra += '<div class="h5-section"><div class="h5-section-title">表决</div>';
          options.forEach(function (opt) {
            const count = votes.filter(function (v) { return v.optionId === opt.id; }).length;
            const selected = myVote && myVote.optionId === opt.id;
            const canVote = topic.status === "voting" && !myVote;
            extra +=
              '<div class="vote-opt' +
              (selected ? " selected" : "") +
              '"' +
              (canVote
                ? ' data-vote-opt="' + escapeHtml(opt.id) + '" data-topic-id="' + escapeHtml(topic.id) + '"'
                : "") +
              ">" +
              '<span>' +
              escapeHtml(opt.label) +
              "</span>" +
              (myVote || topic.status === "closed"
                ? '<span class="vote-count">' + count + " 票</span>"
                : "") +
              (selected ? ' <i class="ri-check-line"></i>' : "") +
              "</div>";
          });
          if (topic.status === "voting" && !myVote) {
            extra += '<div style="font-size:12px;color:rgba(0,0,0,0.45)">点击选项完成表决（一人一票）</div>';
          } else if (myVote) {
            extra += '<div style="font-size:12px;color:rgba(0,0,0,0.45)">您已完成表决</div>';
          }
          extra += "</div>";
        }

        return detailShell(
          topic.title,
          statusTag(st[0], st[1]) + " · " + escapeHtml(topic.orgName || "") + " · " + escapeHtml(formatDate(topic.publishAt || topic.createdAt)),
          topic.content || "",
          extra,
          ""
        );

      const list = sortByTimeDesc(listForH5(KEYS.topics), ["publishAt", "updatedAt", "createdAt"]);
      let html = '<div class="h5-list">';

        html += listCard({
          title: t.title,
          desc: t.content,
          path: "home/topics",
          id: t.id,
          metaHtml: statusTag(st[0], st[1]) + "<span>" + escapeHtml(formatDate(t.publishAt || t.createdAt)) + "</span>",
        });
      });
      html += "</div>";
      return html;
    }

      votes.forEach(function (v) { topicIds[v.topicId] = true; });
      const ids = Object.keys(topicIds);

        const st = TOPIC_STATUS(t.status);
        const didComment = comments.some(function (c) { return c.topicId === tid; });
        const didVote = votes.some(function (v) { return v.topicId === tid; });
        html += listCard({
          title: t.title,
          path: "home/topics",
          id: t.id,
          metaHtml:
            statusTag(st[0], st[1]) +
            (didComment ? statusTag("已评论", "primary") : "") +
            (didVote ? statusTag("已表决", "success") : ""),

      });
      html += "</div>";

        bodyHtml +=
          '<div class="h5-nav">' +
          '<div class="h5-nav-back" id="h5-back"><i class="ri-arrow-left-s-line"></i></div>' +
          '<div class="h5-nav-title">' + escapeHtml(title) + "</div>" +

        tabHtml +=
          '<div class="tabbar-item' + (isActive ? " active" : "") + '" data-tab="' + t.key + '">' +
          '<i class="' + t.icon + '"></i>' +

    function bindShellEvents() {
      const body = document.getElementById("phone-body");
      if (body) {
        body.querySelectorAll("[data-nav]").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            const path = el.getAttribute("data-nav");
            const id = el.getAttribute("data-id");
            if (!path) return;
            if (id) h5Navigate(path, { params: { id: id } });
            else h5Navigate(path);
          });
        });
      }

      document.querySelectorAll(".tabbar-item[data-tab]").forEach(function (el) {
        el.addEventListener("click", function () {
          const tab = el.getAttribute("data-tab");
          if (tab) h5Navigate(tab, { replace: true });
        });
      });

      const back = document.getElementById("h5-back");
      if (back) {
        back.addEventListener("click", function () { h5Back(); });
      }

      const sw = document.getElementById("btn-switch-resident");
      if (sw) {
        sw.addEventListener("click", function () {
          h5ShowPicker = true;
          renderH5Shell();
        });
      }

      const pickerClose = document.getElementById("picker-close");
      if (pickerClose) {
        pickerClose.addEventListener("click", function () {
          h5ShowPicker = false;
          renderH5Shell();
        });
      }
      const mask = document.getElementById("resident-picker");
      if (mask) {
        mask.addEventListener("click", function (e) {
          if (e.target === mask) {
            h5ShowPicker = false;
            renderH5Shell();
          }
        });
        mask.querySelectorAll("[data-res-id]").forEach(function (el) {
          el.addEventListener("click", function () {
            const id = el.getAttribute("data-res-id");
            const r = getAll(KEYS.residents).find(function (x) { return x.id === id; });
            if (!r) return;
            setH5Session({
              userId: r.id,
              userName: r.name,
              orgId: r.orgId,
            });
            h5ShowPicker = false;
            toast("已切换为 " + r.name);
            renderH5Shell();
          });
        });
      }

      /* filters */
      if (body) {
        body.querySelectorAll("[data-filter-type]").forEach(function (el) {
          el.addEventListener("click", function () {
            const t = el.getAttribute("data-filter-type");
            h5UiState["home/affairs"] = { type: t };
            renderH5Shell();
          });
        });
      }

      function bindSearchInput(inputId, stateKey, field) {
        const input = document.getElementById(inputId);
        if (!input) return;
        let timer = null;
        input.addEventListener("input", function () {
          clearTimeout(timer);
          const val = input.value;
          timer = setTimeout(function () {
            h5UiState[stateKey] = h5UiState[stateKey] || {};
            h5UiState[stateKey][field || "kw"] = val;
            renderH5Shell();
            const again = document.getElementById(inputId);
            if (again) {
              again.focus();
              const len = again.value.length;
              try { again.setSelectionRange(len, len); } catch (e) { /* ignore */ }
            }
          }, 280);
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            h5UiState[stateKey] = h5UiState[stateKey] || {};
            h5UiState[stateKey][field || "kw"] = input.value;
            renderH5Shell();
          }
        });
      }
      bindSearchInput("fac-search", "service/facilities", "kw");
      bindSearchInput("frc-search", "service/forces", "kw");
      bindSearchInput("global-search", "home/search", "kw");

      /* activity signup */
      const btnSignup = document.getElementById("btn-activity-signup");
      if (btnSignup) {
        btnSignup.addEventListener("click", function () {
          const activityId = btnSignup.getAttribute("data-activity-id");

            userId: session.userId,
            userName: session.userName,
            title: title.trim(),
            content: content.trim(),
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            status: "submitted",
            createdAt: nowISO(),
            updatedAt: nowISO(),
          });
          toast("提交成功");
          h5Navigate("home/progress", { replace: true });
        });
      }

      /* survey answer */
      if (body) {
        body.querySelectorAll(".score-opt").forEach(function (el) {
          el.addEventListener("click", function () {
            const qid = el.getAttribute("data-for");

            el.classList.add("active");

        btnGoAnswer.addEventListener("click", function () {
          const sid = btnGoAnswer.getAttribute("data-survey-id");
          const route = btnGoAnswer.getAttribute("data-route") || "home/surveys";
          h5Navigate(route, { params: { id: sid, mode: "answer" } });
        });
      }
      const btnSubmitSurvey = document.getElementById("btn-submit-survey");
      if (btnSubmitSurvey) {
        btnSubmitSurvey.addEventListener("click", function () {
          const surveyId = btnSubmitSurvey.getAttribute("data-survey-id");
          const survey = getById(KEYS.surveys, surveyId);
          if (!survey) return;
          if (hasAnsweredSurvey(surveyId)) {
            toast("您已提交过该问卷");
            return;
          }
          const answers = {};
          const questions = survey.questions || [];
          for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            if (q.type === "score") {
              const active = body.querySelector('.score-opt.active[data-for="' + q.id + '"]');
              if (!active) {
                toast("请完成第 " + (i + 1) + " 题");
                return;
              }
              answers[q.id] = Number(active.getAttribute("data-score"));
            } else {
              const ta = body.querySelector('.ans-text[data-for="' + q.id + '"]');
              const val = ta ? ta.value.trim() : "";
              if (!val) {
                toast("请完成第 " + (i + 1) + " 题");
                return;
              }
              answers[q.id] = val;
            }
          }
          const session = getH5Session() || {};
          const org = getOrg(session.orgId);
          saveRecord(KEYS.surveyAnswers, {
            id: uid("ans"),
            surveyId: surveyId,
            userId: session.userId,
            userName: session.userName,
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            answers: answers,
            status: "submitted",
            createdAt: nowISO(),
            updatedAt: nowISO(),
          });
          toast("提交成功");
          h5Navigate(h5Route, { replace: true, params: { id: surveyId } });

          const topicId = btnTopicComment.getAttribute("data-topic-id");
          const ta = document.getElementById("topic-comment");
          const content = ta ? ta.value.trim() : "";
          if (!content) {
            toast("请输入评论内容");
            return;
          }
          const session = getH5Session() || {};
          const org = getOrg(session.orgId);
          saveRecord(KEYS.topicComments, {
            id: uid("tcm"),
            topicId: topicId,
            userId: session.userId,
            userName: session.userName,
            content: content,
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            status: "active",
            createdAt: nowISO(),
            updatedAt: nowISO(),
          });
          toast("评论已发布");
          renderH5Shell();
        });
      }
      if (body) {
        body.querySelectorAll("[data-vote-opt]").forEach(function (el) {
          el.addEventListener("click", function () {
            const topicId = el.getAttribute("data-topic-id");
            const optionId = el.getAttribute("data-vote-opt");
            const session = getH5Session() || {};
            const exists = getAll(KEYS.topicVotes).some(function (v) {
              return v.topicId === topicId && v.userId === session.userId && !v.deleted;
            });
            if (exists) {
              toast("您已投过票");
              return;
            }
            const org = getOrg(session.orgId);
            saveRecord(KEYS.topicVotes, {
              id: uid("tvt"),
              topicId: topicId,
              userId: session.userId,
              userName: session.userName,
              optionId: optionId,
              orgId: session.orgId,
              orgLevel: (org && org.level) || "village",
              orgName: (org && org.name) || "",
              status: "submitted",
              createdAt: nowISO(),
              updatedAt: nowISO(),
            });
            toast("表决成功");
            renderH5Shell();
          });
        });
      }

      /* assist apply */
      const btnAssist = document.getElementById("btn-submit-assist");
      if (btnAssist) {
        btnAssist.addEventListener("click", function () {
          const title = ((document.getElementById("apl-title") || {}).value || "").trim();
          const type = ((document.getElementById("apl-type") || {}).value || "").trim();
          const content = ((document.getElementById("apl-content") || {}).value || "").trim();
          if (!title || !type || !content) {
            toast("请完整填写申请信息");
            return;
          }
          const session = getH5Session() || {};
          const org = getOrg(session.orgId);
          const resident = getAll(KEYS.residents).find(function (r) { return r.id === session.userId; });
          const ts = nowISO();
          saveRecord(KEYS.assistApplications, {
            id: uid("apl"),
            title: title,
            type: type,
            content: content,
            reason: content,
            userId: session.userId,
            userName: session.userName,
            phone: (resident && resident.phone) || "",
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            status: "submitted",
            centerOrgId: "org_cx",
            deptId: null,
            deptName: null,
            assignRemark: null,
            rejectReason: null,
            returnReason: null,
            handleOrgName: "城西街道综合信息指挥室",
            progressText: "已提交，待乡镇中心受理",
            timeline: [{ step: "submit", label: "提交", at: ts, by: session.userName || "群众", remark: "群众提交申请" }],
            createdAt: ts,
            updatedAt: ts,
          });
          toast("申请已提交");
          h5Navigate("home/assist-mine", { replace: true });
        });
      }
    }

    /* ========== Boot ========== */
    ensureSeed(false);
    renderH5Shell();
  </script>
</body>
</html>
