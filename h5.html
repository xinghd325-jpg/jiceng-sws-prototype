    function formatOrgDisplayName(org) {
      if (!org) return "请选择组织";
      if (org.level === "city") return org.name;
      if (org.level === "town" && org.parentId) {
        var parent = getOrg(org.parentId);
        return (parent ? parent.name : "") + org.name;
      }
      if (org.level === "village" && org.parentId) {
        var town = getOrg(org.parentId);
        var dist = town && town.parentId ? getOrg(town.parentId) : null;
        if (town && dist) return dist.name + town.name;
        if (town) return town.name + org.name;
      }
      return org.name;
    }

    function getOrgChildren(parentId) {
      return getAll(KEYS.orgs)
        .filter(function (o) {
          return o.parentId === parentId;
        })
        .slice()
        .sort(function (a, b) {
          return String(a.name || "").localeCompare(String(b.name || ""), "zh");
        });
    }

    function getSelectableOrgs() {
      // 首页区域切换：仅到乡镇（市 / 区县 / 乡镇）
      var levelOrder = { city: 0, district: 1, town: 2 };
      return getAll(KEYS.orgs)
        .filter(function (o) {
          return o.level === "city" || o.level === "district" || o.level === "town";
        })
        .slice()
        .sort(function (a, b) {
          var la = levelOrder[a.level] != null ? levelOrder[a.level] : 9;
          var lb = levelOrder[b.level] != null ? levelOrder[b.level] : 9;
          if (la !== lb) return la - lb;
          return String(a.name || "").localeCompare(String(b.name || ""), "zh");
        });
    }

    /** 根据当前会话组织，初始化级联草稿（仅到乡镇） */
    function initOrgPickerDraft() {
      var session = getH5Session() || {};
      var org = getOrg(session.orgId);
      var draft = { city: "", district: "", town: "" };
      if (!org) {
        var cities = getAll(KEYS.orgs).filter(function (o) {
          return o.level === "city";
        });
        draft.city = cities[0] ? cities[0].id : "";
        return draft;
      }
      // 若会话落在村社，回退到所属乡镇
      if (org.level === "village") {
        org = getOrg(org.parentId) || org;
      }
      if (org.level === "city") {
        draft.city = org.id;
      } else if (org.level === "district") {
        draft.city = org.parentId || "";
        draft.district = org.id;
      } else if (org.level === "town") {
        draft.town = org.id;
        draft.district = org.parentId || "";
        var d = getOrg(draft.district);
        draft.city = (d && d.parentId) || "";
      }
      return draft;
    }

    function ensureOrgPickerDraft() {
      if (!_orgPickerDraft) _orgPickerDraft = initOrgPickerDraft();
      return _orgPickerDraft;
    }

    /** 草稿中最深一级：乡镇 > 区县 > 市（不到村社） */
    function getOrgPickerDeepestId(draft) {
      draft = draft || ensureOrgPickerDraft();
      return draft.town || draft.district || draft.city || "";
    }

    function formatOrgPickerPathText(draft) {
      draft = draft || ensureOrgPickerDraft();
      var names = [];
      ["city", "district", "town"].forEach(function (k) {
        if (!draft[k]) return;
        var o = getOrg(draft[k]);
        if (o && o.name) names.push(o.name);
      });
      return names.length ? names.join(" / ") : "请选择区域";
    }

    /** 某层级全部组织 */
    function getOrgsByLevel(level) {
      return getAll(KEYS.orgs)
        .filter(function (o) {
          return o.level === level;
        })
        .slice()
        .sort(function (a, b) {
          return String(a.name || "").localeCompare(String(b.name || ""), "zh");
        });
    }

    /** 区县列表：有市则该市下区县，否则全市区县 */
    function getPickerDistricts(draft) {
      var list = draft && draft.city ? getOrgChildren(draft.city) : getOrgsByLevel("district");
      return list.filter(function (o) {
        return o.level === "district";
      });
    }

    /** 乡镇列表：必须先选区县，仅展示该区县下乡镇 */
    function getPickerTowns(draft) {
      if (!draft || !draft.district) return [];
      return getOrgChildren(draft.district).filter(function (o) {
        return o.level === "town";
      });
    }

    /** 村社列表：有街道则其下全部；有区县/市则范围内全部村社；否则全市村社 */
    function getPickerVillages(draft) {
      if (draft && draft.town) return getOrgChildren(draft.town);
      if (draft && draft.district) {
        var list = [];
        getOrgChildren(draft.district).forEach(function (t) {
          list = list.concat(getOrgChildren(t.id));
        });
        return list.sort(function (a, b) {
          return String(a.name || "").localeCompare(String(b.name || ""), "zh");
        });
      }
      if (draft && draft.city) {
        var all = [];
        getOrgChildren(draft.city).forEach(function (d) {
          getOrgChildren(d.id).forEach(function (t) {
            all = all.concat(getOrgChildren(t.id));
          });
        });
        return all.sort(function (a, b) {
          return String(a.name || "").localeCompare(String(b.name || ""), "zh");
        });
      }
      return getOrgsByLevel("village");
    }

    function renderOrgPicker() {
      if (!h5ShowOrgPicker) return "";
      var draft = ensureOrgPickerDraft();
      // 三级联动：市 → 该市下区县 → 该区县下乡镇
      var cities = getOrgsByLevel("city");
      var districts = getPickerDistricts(draft);
      var towns = draft.district ? getPickerTowns(draft) : [];

      function col(items, activeId, level, showArrow, emptyText) {
        var html = '<div class="org-cascade-col" data-org-col="' + escapeHtml(level) + '">';
        if (!items.length) {
          html +=
            '<div class="org-cascade-empty">' +
            escapeHtml(emptyText || "暂无数据") +
            "</div>";
        } else {
          items.forEach(function (o) {
            // 末级乡镇不再看村社子节点
            var hasChild =
              level === "town"
                ? false
                : getOrgChildren(o.id).some(function (c) {
                    return c.level === "district" || c.level === "town";
                  });
            if (level === "district") {
              hasChild = getOrgChildren(o.id).some(function (c) {
                return c.level === "town";
              });
            }
            var active = activeId === o.id;
            html +=
              '<div class="org-cascade-item' +
              (active ? " active" : "") +
              '" data-org-pick-level="' +
              escapeHtml(level) +
              '" data-org-id="' +
              escapeHtml(o.id) +
              '">' +
              '<span class="oci-name">' +
              escapeHtml(o.name) +
              "</span>" +
              (showArrow && hasChild
                ? '<i class="ri-arrow-right-s-line"></i>'
                : active
                  ? '<i class="ri-check-line"></i>'
                  : "") +
              "</div>";
          });
        }
        html += "</div>";
        return html;
      }

      var colsHtml =
        col(cities, draft.city, "city", true, "暂无市级") +
        col(
          districts,
          draft.district,
          "district",
          true,
          draft.city ? "该市暂无区县" : "请先选择市级"
        ) +

          towns,
          draft.town,
          "town",
          false,
          draft.district ? "该区县暂无乡镇" : "请先选择区县"
        );

      return (
        '<div class="org-picker-mask" id="org-picker-mask">' +

        '<div class="ops">' +
        '<span class="cancel" id="org-picker-cancel">取消</span>' +

        '<span class="confirm" id="org-picker-confirm">确定</span>' +

        escapeHtml(formatOrgPickerPathText(draft)) +
        "</strong></div>" +
        '<div class="org-cascade-cols">' +
        colsHtml +
        "</div>" +
        "</div></div>"
      );
    }

    /* ========== Shell ========== */
    function renderH5Shell() {
      promoteDuePublishes();

      // 未登录：展示登录页
      if (!isH5LoggedIn()) {
        app.innerHTML =
          '<div class="phone">' +
          '<div class="phone-body" id="phone-body">' +
          renderLoginPage() +
          "</div></div>";
        bindShellEvents();
        flushPendingToast();
        return;
      }

      const showTab = isTabRoot(h5Route);
      const pageFn = PagesH5[h5Route];

      let pageHtml = "";
      if (typeof pageFn === "function") {
        pageHtml = pageFn();
      } else {
        pageHtml = renderStubPage(h5Route);
      }
      const title = h5NavTitle || ROUTE_TITLES[h5Route] || "详情";

        bodyHtml +=
          '<div class="h5-nav">' +

        const isActive = showTab && h5Route === t.key;
        tabHtml +=
          '<div class="tabbar-item' + (isActive ? " active" : "") + '" data-tab="' + t.key + '">' +
          '<i class="' + t.icon + '"></i>' +
          "<span>" + t.label + "</span>" +
          "</div>";
      });
      tabHtml += "</div>";

      app.innerHTML =
        '<div class="phone">' +
        '<div class="phone-body" id="phone-body">' + bodyHtml + "</div>" +
        tabHtml +
        (h5ShowPicker ? renderResidentPicker() : "") +
        (h5ShowOrgPicker ? renderOrgPicker() : "") +
        "</div>";

      bindShellEvents();
      flushPendingToast();

    function bindShellEvents() {
      const body = document.getElementById("phone-body");
      if (body) {
        body.querySelectorAll("[data-nav]").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            const path = el.getAttribute("data-nav");
            const id = el.getAttribute("data-id");
            if (!path) return;
            if (id) h5Navigate(path, { params: { id: id } });
            else h5Navigate(path);
          });
        });
        bindHomeStyleChips(body);
      }

      document.querySelectorAll(".tabbar-item[data-tab]").forEach(function (el) {
        el.addEventListener("click", function () {
          const tab = el.getAttribute("data-tab");
          if (tab) h5Navigate(tab, { replace: true });
        });
      });

      const back = document.getElementById("h5-back");
      if (back) {
        back.addEventListener("click", function () { h5Back(); });
      }

      const sw = document.getElementById("btn-switch-resident");
      if (sw) {
        sw.addEventListener("click", function () {
          h5ShowPicker = true;
          renderH5Shell();
        });
      }

      const btnLogout = document.getElementById("btn-logout");
      if (btnLogout) {
        btnLogout.addEventListener("click", function () {
          clearH5Session();
          h5ShowPicker = false;
          h5ShowOrgPicker = false;
          h5History = [];
          h5Route = "home";
          h5Params = {};
          toast("已退出登录");
          renderH5Shell();
        });
      }

      // 登录页账号选择
      if (body) {
        body.querySelectorAll("[data-login-id]").forEach(function (el) {
          el.addEventListener("click", function () {
            const id = el.getAttribute("data-login-id");
            if (id) loginAsResident(id);
          });
        });
      }

      const pickerClose = document.getElementById("picker-close");
      if (pickerClose) {
        pickerClose.addEventListener("click", function () {
          if (!isH5LoggedIn()) return;
          h5ShowPicker = false;
          renderH5Shell();
        });
      }
      const mask = document.getElementById("resident-picker");
      if (mask) {
        mask.addEventListener("click", function (e) {
          if (e.target === mask) {
            if (!isH5LoggedIn()) return;
            h5ShowPicker = false;
            renderH5Shell();
          }
        });
        mask.querySelectorAll("[data-res-id]").forEach(function (el) {
          el.addEventListener("click", function () {
            const id = el.getAttribute("data-res-id");
            if (!id) return;
            if (!isH5LoggedIn()) {
              loginAsResident(id);
              return;
            }
            const r = getAll(KEYS.residents).find(function (x) { return x.id === id; });
            if (!r) return;
            setH5Session({
              userId: r.id,
              userName: r.name,
              orgId: r.orgId,
            });
            h5ShowPicker = false;
            toast("已切换为 " + r.name);
            renderH5Shell();
          });
        });
      }

      // 组织级联选择
      const orgMask = document.getElementById("org-picker-mask");
      if (orgMask) {
        const closeOrg = function () {
          h5ShowOrgPicker = false;
          _orgPickerDraft = null;
          renderH5Shell();
        };
        const cancel = document.getElementById("org-picker-cancel");
        if (cancel) cancel.addEventListener("click", closeOrg);
        orgMask.addEventListener("click", function (e) {
          if (e.target === orgMask) closeOrg();
        });
        // 列内点击：仅到乡镇；点下级时自动补全上级路径
        orgMask.querySelectorAll("[data-org-pick-level]").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            var level = el.getAttribute("data-org-pick-level");
            var oid = el.getAttribute("data-org-id");
            if (!level || !oid) return;
            var draft = ensureOrgPickerDraft();
            if (level === "city") {
              draft.city = oid;
              draft.district = "";
              draft.town = "";
            } else if (level === "district") {
              draft.district = oid;
              draft.town = "";
              var dist = getOrg(oid);
              if (dist && dist.parentId) draft.city = dist.parentId;
            } else if (level === "town") {
              draft.town = oid;
              var town = getOrg(oid);
              if (town && town.parentId) {
                draft.district = town.parentId;
                var dist2 = getOrg(town.parentId);
                if (dist2 && dist2.parentId) draft.city = dist2.parentId;
              }
            }
            _orgPickerDraft = draft;
            renderH5Shell();
          });
        });
        // 确定：取最深已选区域
        const confirmBtn = document.getElementById("org-picker-confirm");
        if (confirmBtn) {
          confirmBtn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            var oid = getOrgPickerDeepestId();
            if (!oid) {
              toast("请选择所在区域");
              return;
            }
            var org = getOrg(oid);
            const sess = getH5Session() || {};
            setH5Session({
              userId: sess.userId || "res_001",
              userName: sess.userName || "居民",
              orgId: oid,
              orgSource: "manual",
            });
            h5ShowOrgPicker = false;
            _orgPickerDraft = null;
            toast("已切换至 " + ((org && org.name) || "区域"));
            renderH5Shell();
          });
        }
      }

      /* list filters / segment tabs */
      if (body) {
        body.querySelectorAll("[data-list-filter]").forEach(function (el) {
          el.addEventListener("click", function () {
            const route = el.getAttribute("data-list-route");
            const field = el.getAttribute("data-list-field") || "tab";
            const val = el.getAttribute("data-list-filter");
            if (!route) return;
            h5UiState[route] = h5UiState[route] || {};
            h5UiState[route][field] = val;
            // 帮扶「我的」两端共用筛选
            if (route === "home/assist-mine") {
              h5UiState["mine/assist"] = Object.assign({}, h5UiState[route]);
            }
            if (route === "mine/assist") {
              h5UiState["home/assist-mine"] = Object.assign({}, h5UiState[route]);
            }
            renderH5Shell();
          });
        });
        // 三务公开：区县/乡镇/村社 下拉三级联动
        body.querySelectorAll("select[data-affairs-org]").forEach(function (sel) {
          sel.addEventListener("change", function () {
            var route = sel.getAttribute("data-list-route") || "home/affairs";
            var field = sel.getAttribute("data-affairs-org");
            var val = sel.value || "all";
            if (!field) return;
            h5UiState[route] = h5UiState[route] || {};
            h5UiState[route][field] = val;
            if (field === "district") {
              h5UiState[route].town = "all";
              h5UiState[route].village = "all";
            } else if (field === "town") {
              h5UiState[route].village = "all";
              // 选中乡镇时自动补全区县
              if (val !== "all") {
                var t = getOrg(val);
                if (t && t.parentId) h5UiState[route].district = t.parentId;
              }
            } else if (field === "village") {
              if (val !== "all") {
                var v = getOrg(val);
                if (v && v.parentId) {
                  h5UiState[route].town = v.parentId;
                  var t2 = getOrg(v.parentId);
                  if (t2 && t2.parentId) h5UiState[route].district = t2.parentId;
                }
              }
            }
            // 标记已手动调整，仍保留当前 session 关联键
            var sess = getH5Session() || {};
            h5UiState[route]._syncedOrgId = sess.orgId || "";
            renderH5Shell();
          });
        });
      }

      function bindSearchInput(inputId, stateKey, field) {
        const input = document.getElementById(inputId);
        if (!input) return;
        let timer = null;
        input.addEventListener("input", function () {
          clearTimeout(timer);
          const val = input.value;
          timer = setTimeout(function () {
            h5UiState[stateKey] = h5UiState[stateKey] || {};
            h5UiState[stateKey][field || "kw"] = val;
            renderH5Shell();
            const again = document.getElementById(inputId);
            if (again) {
              again.focus();
              const len = again.value.length;
              try { again.setSelectionRange(len, len); } catch (e) { /* ignore */ }
            }
          }, 280);
        });
        input.addEventListener("keydown", function (e) {
          if (e.key === "Enter") {
            h5UiState[stateKey] = h5UiState[stateKey] || {};
            h5UiState[stateKey][field || "kw"] = input.value;
            renderH5Shell();
          }
        });
      }
      bindSearchInput("ntc-search", "home/notices", "kw");
      bindSearchInput("fac-search", "service/facilities", "kw");
      bindSearchInput("frc-search", "service/forces", "kw");
      bindSearchInput("global-search", "home/search", "kw");

      /* activity signup — 按活动配置的 formFields 采集 */
      const btnSignup = document.getElementById("btn-activity-signup");
      if (btnSignup) {
        btnSignup.addEventListener("click", function () {
          const activityId = btnSignup.getAttribute("data-activity-id");
          const session = getH5Session();
          if (!session || !activityId) return;
          if (hasSignedActivity(activityId)) {
            toast("您已报名该活动");
            return;
          }
          const act = getById(KEYS.activities, activityId);
          if (!act || isActivityEnded(act)) {
            toast("活动已结束，无法报名");
            return;
          }
          if (!isOnlineSignupEnabled(act)) {
            toast("本活动不支持在线报名");
            return;
          }
          if (!isActivitySignupOpen(act)) {
            toast("报名已截止");
            return;
          }
          if (act.maxSignups != null && act.maxSignups !== "" && !isNaN(Number(act.maxSignups))) {
            const cap = Number(act.maxSignups);
            if (cap > 0) {
              const used = getAll(KEYS.activitySignups).filter(function (x) {
                return x && !x.deleted && x.activityId === activityId;
              }).length;
              if (used >= cap) {
                toast("报名人数已满");
                return;
              }
            }
          }
          const fields = (act.formFields && act.formFields.length)
            ? act.formFields
            : [
                { id: "userName", type: "text", label: "姓名", required: true },
                { id: "phone", type: "phone", label: "手机号", required: true },
              ];
          const formData = {};
          for (var i = 0; i < fields.length; i++) {
            var f = fields[i];
            var el = document.querySelector('[data-signup-field="' + f.id + '"]');
            var val = el ? String(el.value || "").trim() : "";
            if (f.required && !val) {
              toast("请填写" + (f.label || f.id));
              return;
            }
            formData[f.id] = val;
          }
          const resident = getAll(KEYS.residents).find(function (r) {
            return r.id === session.userId;
          });
          const org = getOrg(session.orgId);
          saveRecord(KEYS.activitySignups, {
            id: uid("asg"),
            activityId: activityId,
            userId: session.userId,
            userName: formData.userName || session.userName,
            phone: formData.phone || (resident && resident.phone) || "",
            mobile: formData.phone || (resident && resident.phone) || "",
            formData: formData,
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            status: "submitted",
            createdAt: nowISO(),
            updatedAt: nowISO(),
          });
          toast("报名提交成功");
          renderH5Shell();
        });
      }

      /* campaign suggest */
      const btnGoSuggest = document.getElementById("btn-go-suggest");
      if (btnGoSuggest) {
        btnGoSuggest.addEventListener("click", function () {
          const cid = btnGoSuggest.getAttribute("data-campaign-id");
          h5Navigate("home/campaigns", { params: { id: cid, mode: "submit" } });
        });
      }
      // 建议征集：图片上传
      const sugAdd = document.getElementById("sug-upload-add");
      const sugInput = document.getElementById("sug-image-input");
      if (sugAdd && sugInput) {
        sugAdd.addEventListener("click", function () {
          sugInput.click();
        });
        sugInput.addEventListener("change", function () {
          const files = Array.prototype.slice.call(sugInput.files || []);
          sugInput.value = "";
          if (!files.length) return;
          var remain = SUGGEST_IMG_MAX - _suggestUploadImages.length;
          if (remain <= 0) {
            toast("最多上传 " + SUGGEST_IMG_MAX + " 张图片");
            return;
          }
          var picked = files.slice(0, remain);
          var pending = picked.length;
          if (!pending) return;
          picked.forEach(function (file) {
            compressImageFile(file, function (dataUrl) {
              pending -= 1;
              if (dataUrl) {
                _suggestUploadImages.push({
                  id: uid("img"),
                  name: file.name || "image.jpg",
                  dataUrl: dataUrl,
                });
              }
              if (pending <= 0) {
                // 保留已填标题内容再重绘
                var tEl = document.getElementById("sug-title");
                var cEl = document.getElementById("sug-content");
                var keepTitle = tEl ? tEl.value : "";
                var keepContent = cEl ? cEl.value : "";
                renderH5Shell();
                setTimeout(function () {
                  var t2 = document.getElementById("sug-title");
                  var c2 = document.getElementById("sug-content");
                  if (t2) t2.value = keepTitle;
                  if (c2) c2.value = keepContent;
                }, 0);
              }
            });
          });
          if (files.length > remain) {
            toast("最多 " + SUGGEST_IMG_MAX + " 张，已选择前 " + remain + " 张");
          }
        });
      }
      if (body) {
        body.querySelectorAll("[data-sug-img-del]").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            var idx = parseInt(el.getAttribute("data-sug-img-del"), 10);
            if (isNaN(idx)) return;
            var tEl = document.getElementById("sug-title");
            var cEl = document.getElementById("sug-content");
            var keepTitle = tEl ? tEl.value : "";
            var keepContent = cEl ? cEl.value : "";
            _suggestUploadImages.splice(idx, 1);
            renderH5Shell();
            setTimeout(function () {
              var t2 = document.getElementById("sug-title");
              var c2 = document.getElementById("sug-content");
              if (t2) t2.value = keepTitle;
              if (c2) c2.value = keepContent;
            }, 0);
          });
        });
        // 详情图片点击预览
        body.querySelectorAll("img[data-preview-list]").forEach(function (img) {
          img.addEventListener("click", function () {
            var phone = document.querySelector(".phone");
            if (!phone) return;
            var mask = document.createElement("div");
            mask.className = "img-preview-mask";
            mask.innerHTML = '<img src="' + img.getAttribute("src") + '" alt="预览" />';
            mask.addEventListener("click", function () {
              if (mask.parentNode) mask.parentNode.removeChild(mask);
            });
            phone.appendChild(mask);
          });
        });
      }

      const btnSubmitSug = document.getElementById("btn-submit-suggestion");
      if (btnSubmitSug) {
        btnSubmitSug.addEventListener("click", function () {
          const campaignId = btnSubmitSug.getAttribute("data-campaign-id");
          const content = ((document.getElementById("sug-content") || {}).value || "").trim();
          if (!content) {
            toast("请填写建议内容");
            return;
          }
          const camp = getById(KEYS.collectCampaigns, campaignId);
          if (!camp || !isPeriodOpen(camp) || !isH5PublicContentStatus(camp.status, KEYS.collectCampaigns, camp)) {
            toast(camp && !isPeriodEnded(camp) && camp.startAt && Date.parse(camp.startAt) > Date.now() ? "征集尚未开始" : "征集已结束");
            return;
          }
          const session = getH5Session() || {};
          const org = getOrg(session.orgId);
          const images = _suggestUploadImages.map(function (img) {
            return { id: img.id, name: img.name, dataUrl: img.dataUrl };
          });
          const autoTitle = content.length > 30 ? content.slice(0, 30) + "…" : content;
          const now = nowISO();
          const opinionType = camp.opinionType || "";
          saveRecord(KEYS.suggestions, {
            id: uid("sug"),
            campaignId: campaignId,
            userId: session.userId,
            userName: session.userName,
            title: autoTitle,
            content: content,
            opinionType: opinionType,
            images: images,
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            status: "submitted",
            createdAt: now,
            updatedAt: now,
          });
          saveRecord(KEYS.suggestionInbox, {
            id: uid("sin"),
            code: "JY" + String(Date.now()),
            title: autoTitle,
            content: content,
            opinionType: opinionType,
            source: "线索建议征集活动",
            campaignId: campaignId,
            reporter: session.userName || "",
            images: images,
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            status: "pending",
            createdAt: now,
            updatedAt: now,
            createdBy: session.userName || "群众",
          });
          _suggestUploadImages = [];
          _suggestUploadCampaignId = null;
          toast(
            images.length
              ? "建议提交成功（含 " + images.length + " 张图片）"
              : "建议提交成功"
          );
          h5Navigate("mine/suggestions", { replace: true });
        });
      }

      /* survey answer */
      if (body) {
        body.querySelectorAll(".score-opt").forEach(function (el) {
          el.addEventListener("click", function () {
            const qid = el.getAttribute("data-for");
            body.querySelectorAll('.score-opt[data-for="' + qid + '"]').forEach(function (x) {
              x.classList.remove("active");
            });
            el.classList.add("active");
          });
        });
        body.querySelectorAll(".choice-opt").forEach(function (el) {
          el.addEventListener("click", function () {
            const qid = el.getAttribute("data-for");
            const list = body.querySelector('.choice-list[data-for="' + qid + '"]');
            const mode = list ? list.getAttribute("data-choice-mode") : "single";
            if (mode === "multi") {
              el.classList.toggle("active");
            } else {
              body.querySelectorAll('.choice-opt[data-for="' + qid + '"]').forEach(function (x) {
                x.classList.remove("active");
              });
              el.classList.add("active");
            }
          });
        });
      }
      const btnGoAnswer = document.getElementById("btn-go-answer");
      if (btnGoAnswer) {
        btnGoAnswer.addEventListener("click", function () {
          const sid = btnGoAnswer.getAttribute("data-survey-id");
          const route = btnGoAnswer.getAttribute("data-route") || "home/surveys";
          h5Navigate(route, { params: { id: sid, mode: "answer" } });
        });
      }
      const btnSubmitSurvey = document.getElementById("btn-submit-survey");
      if (btnSubmitSurvey) {
        btnSubmitSurvey.addEventListener("click", function () {
          const surveyId = btnSubmitSurvey.getAttribute("data-survey-id");
          const survey = getById(KEYS.surveys, surveyId);
          if (!survey) return;
          if (hasAnsweredSurvey(surveyId)) {
            toast("您已提交过该问卷");
            return;
          }
          if (!isPeriodOpen(survey) || !isH5PublicContentStatus(survey.status, KEYS.surveys, survey)) {
            toast(isPeriodEnded(survey) ? "测评已结束" : "测评尚未开始");
            return;
          }
          const answers = {};
          const questions = survey.questions || [];
          for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            if (q.type === "score") {
              const active = body.querySelector('.score-opt.active[data-for="' + q.id + '"]');
              if (!active) {
                toast("请完成第 " + (i + 1) + " 题");
                return;
              }
              answers[q.id] = Number(active.getAttribute("data-score"));
            } else if (q.type === "single") {
              const active = body.querySelector('.choice-opt.active[data-for="' + q.id + '"]');
              if (!active) {
                toast("请完成第 " + (i + 1) + " 题");
                return;
              }
              answers[q.id] = active.getAttribute("data-value") || "";
            } else if (q.type === "multi") {
              const selected = [];
              body.querySelectorAll('.choice-opt.active[data-for="' + q.id + '"]').forEach(function (el) {
                const v = el.getAttribute("data-value");
                if (v) selected.push(v);
              });
              if (!selected.length) {
                toast("请完成第 " + (i + 1) + " 题（至少选一项）");
                return;
              }
              answers[q.id] = selected;
            } else {
              const ta = body.querySelector('.ans-text[data-for="' + q.id + '"]');
              const val = ta ? ta.value.trim() : "";
              if (!val) {
                toast("请完成第 " + (i + 1) + " 题");
                return;
              }
              answers[q.id] = val;
            }
          }
          const session = getH5Session() || {};
          const org = getOrg(session.orgId);
          saveRecord(KEYS.surveyAnswers, {
            id: uid("ans"),
            surveyId: surveyId,
            userId: session.userId,
            userName: session.userName,
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            answers: answers,
            status: "submitted",
            createdAt: nowISO(),
            updatedAt: nowISO(),
          });
          toast("答卷提交成功");
          h5Navigate(h5Route, { replace: true, params: { id: surveyId } });
        });
      }

      /* topic comment / vote */
      const anonSwitch = document.getElementById("topic-comment-anon");
      if (anonSwitch) {
        anonSwitch.addEventListener("click", function () {
          const on = !anonSwitch.classList.contains("on");
          if (on) anonSwitch.classList.add("on");
          else anonSwitch.classList.remove("on");
          anonSwitch.setAttribute("aria-pressed", on ? "true" : "false");
        });
      }
      const btnTopicComment = document.getElementById("btn-topic-comment");
      if (btnTopicComment) {
        btnTopicComment.addEventListener("click", function () {
          const topicId = btnTopicComment.getAttribute("data-topic-id");
          const topic = getById(KEYS.topics, topicId);
          const ta = document.getElementById("topic-comment");
          const content = ta ? ta.value.trim() : "";
          if (!content) {
            toast("请输入评论内容");
            return;
          }
          const session = getH5Session() || {};
          const phase = topicPhaseOf(topic);
          if (phase !== "discussing" && phase !== "voting") {
            toast("议题已结束，无法评论");
            return;
          }
          if (!canJoinTopic(topic, session)) {
            toast("本议题仅限发布村社居民参与");
            return;
          }
          const org = getOrg(session.orgId);
          const anonymous = !!(anonSwitch && anonSwitch.classList.contains("on"));
          const resident = getById(KEYS.residents, session.userId);
          saveRecord(KEYS.topicComments, {
            id: uid("tcm"),
            topicId: topicId,
            userId: session.userId,
            userName: session.userName,
            phone: (resident && resident.phone) || session.phone || "",
            anonymous: anonymous,
            content: content,
            orgId: session.orgId,
            orgLevel: (org && org.level) || "village",
            orgName: (org && org.name) || "",
            status: "active",
            createdAt: nowISO(),
            updatedAt: nowISO(),
          });
          toast("评论提交成功");
          renderH5Shell();
        });
      }
      if (body) {
        body.querySelectorAll("[data-vote-opt]").forEach(function (el) {
          el.addEventListener("click", function () {
            const topicId = el.getAttribute("data-topic-id");
            const optionId = el.getAttribute("data-vote-opt");
            const session = getH5Session() || {};
            const topic = getById(KEYS.topics, topicId);
            if (topicPhaseOf(topic) !== "voting") {
              toast("当前不在表决期");
              return;
            }
            if (!canJoinTopic(topic, session)) {
              toast("本议题仅限发布村社居民参与");
              return;
            }
            const exists = getAll(KEYS.topicVotes).some(function (v) {
              return v.topicId === topicId && v.userId === session.userId && !v.deleted;
            });
            if (exists) {
              toast("您已投过票");
              return;
            }
            // 弹窗期间先展示选中效果，取消则还原
            const voteOpts = body.querySelectorAll('[data-vote-opt][data-topic-id="' + topicId + '"]');
            function clearPendingSelect() {
              voteOpts.forEach(function (opt) {
                opt.classList.remove("selected");
                const mark = opt.querySelector(".vote-pending-check");
                if (mark) mark.parentNode.removeChild(mark);
              });
            }
            clearPendingSelect();
            el.classList.add("selected");
            if (!el.querySelector(".vote-pending-check")) {
              const mark = document.createElement("i");
              mark.className = "ri-check-line vote-pending-check";
              el.appendChild(mark);
            }
            confirmDialog({
              title: "确认提交",
              message: "表决后不可修改，确认提交吗？",
              okText: "确认提交",
              cancelText: "再想想",
              onCancel: function () {
                clearPendingSelect();
              },
              onOk: function () {
                const stillExists = getAll(KEYS.topicVotes).some(function (v) {
                  return v.topicId === topicId && v.userId === session.userId && !v.deleted;
                });
                if (stillExists) {
                  clearPendingSelect();
                  toast("您已投过票");
                  return;
                }
                const org = getOrg(session.orgId);
                const resident = getById(KEYS.residents, session.userId);
                saveRecord(KEYS.topicVotes, {
                  id: uid("tvt"),
                  topicId: topicId,
                  userId: session.userId,
                  userName: session.userName,
                  phone: (resident && resident.phone) || session.phone || "",
                  optionId: optionId,
                  orgId: session.orgId,
                  orgLevel: (org && org.level) || "village",
                  orgName: (org && org.name) || "",
                  status: "submitted",
                  createdAt: nowISO(),
                  updatedAt: nowISO(),
                });
                toast("表决提交成功");
                renderH5Shell();
              },
            });
          });
        });
      }

      /* assist apply：地区联动 */
      if (body) {
        body.querySelectorAll("select[data-assist-org]").forEach(function (sel) {
          sel.addEventListener("change", function () {
            var field = sel.getAttribute("data-assist-org");
            var val = sel.value || "";
            ensureAssistFormOrg();
            _assistFormOrg[field] = val;
            if (field === "district") {
              _assistFormOrg.town = "";
              _assistFormOrg.village = "";
            } else if (field === "town") {
              _assistFormOrg.village = "";
              if (val) {
                var t = getOrg(val);
                if (t && t.parentId) _assistFormOrg.district = t.parentId;
              }
            } else if (field === "village") {
              if (val) {
                var v = getOrg(val);
                if (v && v.parentId) {
                  _assistFormOrg.town = v.parentId;
                  var t2 = getOrg(v.parentId);
                  if (t2 && t2.parentId) _assistFormOrg.district = t2.parentId;
                }
              }
            }
            preserveAssistFormFieldsAndRerender();
          });
        });
      }

      // 帮扶申请图片上传
      const aplAdd = document.getElementById("apl-upload-add");
      const aplInput = document.getElementById("apl-image-input");
      if (aplAdd && aplInput) {
        aplAdd.addEventListener("click", function () {
          aplInput.click();
        });
        aplInput.addEventListener("change", function () {
          const files = Array.prototype.slice.call(aplInput.files || []);
          aplInput.value = "";
          if (!files.length) return;
          var remain = ASSIST_IMG_MAX - _assistUploadImages.length;
          if (remain <= 0) {
            toast("最多上传 " + ASSIST_IMG_MAX + " 张图片");
            return;
          }
          var picked = files.slice(0, remain);
          var pending = picked.length;
          picked.forEach(function (file) {
            compressImageFile(file, function (dataUrl) {
              pending -= 1;
              if (dataUrl) {
                _assistUploadImages.push({
                  id: uid("img"),
                  name: file.name || "image.jpg",
                  dataUrl: dataUrl,
                });
              }
              if (pending <= 0) preserveAssistFormFieldsAndRerender();
            });
          });
          if (files.length > remain) {
            toast("最多 " + ASSIST_IMG_MAX + " 张，已选择前 " + remain + " 张");
          }
        });
      }
      if (body) {
        body.querySelectorAll("[data-apl-img-del]").forEach(function (el) {
          el.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            var idx = parseInt(el.getAttribute("data-apl-img-del"), 10);
            if (isNaN(idx)) return;
            _assistUploadImages.splice(idx, 1);
            preserveAssistFormFieldsAndRerender();
          });
        });
      }

      /* assist apply */
      const btnAssist = document.getElementById("btn-submit-assist");
      if (btnAssist) {
        btnAssist.addEventListener("click", function () {
          let phone = ((document.getElementById("apl-phone") || {}).value || "").trim();
          const type = ((document.getElementById("apl-type") || {}).value || "").trim();
          const content = ((document.getElementById("apl-content") || {}).value || "").trim();
          const districtId = ((document.getElementById("apl-district") || {}).value || "").trim();
          const townId = ((document.getElementById("apl-town") || {}).value || "").trim();
          const villageId = ((document.getElementById("apl-village") || {}).value || "").trim();
          phone = toPlainPhone(phone);
          if (!phone) {
            toast("请填写联系方式");
            return;
          }
          if (!/^1\d{10}$/.test(phone)) {
            toast("请输入有效的11位手机号");
            return;
          }
          if (!districtId || !townId || !villageId) {
            toast("请选择所在地区");
            return;
          }
          if (!type || !content) {
            toast("请完整填写申请信息");
            return;
          }
          const session = getH5Session() || {};
          const district = getOrg(districtId);
          const town = getOrg(townId);
          const village = getOrg(villageId);
          if (!village || !town || !district) {
            toast("所在地区选择无效，请重新选择");
            return;
          }
          if (town.parentId !== district.id || village.parentId !== town.id) {
            toast("区县、街道、村社不匹配，请重新选择");
            return;
          }
          // 无独立标题字段：用类型 + 说明摘要自动生成
          const title =
            type +
            (content.length > 16 ? "：" + content.slice(0, 16) + "…" : content ? "：" + content : "");
          const ts = nowISO();
          const images = _assistUploadImages.map(function (img) {
            return { id: img.id, name: img.name, dataUrl: img.dataUrl };
          });
          const centerName = (district.name || "") + (town.name || "") + "综合信息指挥室";
          saveRecord(KEYS.assistApplications, {
            id: uid("apl"),
            title: title,
            type: type,
            content: content,
            reason: content,
            images: images,
            userId: session.userId,
            userName: session.userName,
            phone: phone,
            districtId: district.id,
            districtName: district.name,
            townId: town.id,
            townName: town.name,
            orgId: village.id,
            orgLevel: "village",
            orgName: village.name,
            status: "submitted",
            centerOrgId: town.id,
            deptId: null,
            deptName: null,
            assignRemark: null,
            rejectReason: null,
            returnReason: null,
            handleOrgName: centerName,
            progressText: "已提交，待" + town.name + "综合信息指挥室受理",
            timeline: [
              {
                step: "submit",
                label: "提交",
                at: ts,
                by: session.userName || "群众",
                remark: "群众提交申请",
              },
            ],
            createdAt: ts,
            updatedAt: ts,
          });
          _assistUploadImages = [];
          _assistFormOrg = null;
          toast(
            images.length
              ? "申请提交成功（含 " + images.length + " 张图片）"
              : "申请提交成功"
          );
          h5Navigate("mine/assist", { replace: true });
        });
      }
    }

    /* ========== Boot ========== */
    ensureSeed(false);
    renderH5Shell();
  </script>
</body>
</html>
