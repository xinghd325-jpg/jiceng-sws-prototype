<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>金华市基层智治综合应用 - 社会工作服务原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
      background: linear-gradient(180deg, #1564e8 0%, #1677FF 36%, #f0f2f5 36%);
      color: rgba(0,0,0,0.88);
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 64px; }
    .brand {
      color: #fff;
      margin-bottom: 36px;
    }
    .brand h1 { font-size: 22px; font-weight: 700; letter-spacing: 0.3px; }
    .brand p { margin-top: 8px; font-size: 13px; opacity: 0.86; }
    .cards { display: grid; gap: 16px; }
    a.card {
      display: block;
      background: #fff;
      border-radius: 10px;
      padding: 22px 22px 20px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 8px 24px rgba(15, 40, 80, 0.12);
      border: 1px solid #e5eaf0;
    }
    a.card:hover { border-color: #91caff; }
    .tag {
      display: inline-block;
      font-size: 12px;
      color: #1677FF;
      background: #e8f3ff;
      border-radius: 4px;
      padding: 2px 8px;
      margin-bottom: 8px;
    }
    a.card h2 { font-size: 18px; margin-bottom: 6px; }
    a.card p { font-size: 13px; color: rgba(0,0,0,0.55); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <h1>金华市基层智治综合应用</h1>
      <p>社会工作服务端原型 · PC 管理端 / 群众端 H5</p>
    </div>
    <div class="cards">
      <a class="card" href="pc.html">
        <span class="tag">PC 端</span>
        <h2>社会工作服务管理端</h2>
        <p>通知公告、活动、三务公开、服务项目、征集测评、议题、设施力量、帮扶统计等。左下角可查看开发说明、重置演示数据。</p>
      </a>
      <a class="card" href="h5.html">
        <span class="tag">群众端</span>
        <h2>社会工作服务 H5</h2>
        <p>首页、服务、我的。查看已上架内容、活动报名、建议征集、测评、议事协商等。</p>
      </a>
    </div>
  </div>
</body>
</html>
